<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>GeoChemAR – 2D/3D Vergleich</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#video {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  background: black;

  z-index: 1;
}

#threeCanvas {
  position: fixed;
  z-index: 2;
  pointer-events: none;
}

#overlay {
  position: fixed;
  z-index: 3;
  pointer-events: none;
}

#analysisCanvas {
  display: none;
}

#status {
  position: fixed;

  top: 10px;
  left: 10px;

  z-index: 10;

  padding: 10px 14px;

  border-radius: 8px;

  background: rgba(0,0,0,0.82);

  color: white;

  font-size: 14px;
  line-height: 1.45;

  white-space: pre-line;

  pointer-events: none;
}

#error {
  position: fixed;

  left: 10px;
  right: 10px;
  bottom: 10px;

  z-index: 20;

  padding: 10px;

  border-radius: 8px;

  background: rgba(160,0,0,0.92);

  color: white;

  font-size: 13px;

  white-space: pre-wrap;

  display: none;
}

</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<canvas
  id="analysisCanvas"
  width="640"
  height="480"
></canvas>

<canvas
  id="overlay"
  width="640"
  height="480"
></canvas>

<div id="status">
Initialisierung …
</div>

<div id="error"></div>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";

import * as Comlink
  from "https://unpkg.com/comlink/dist/esm/comlink.mjs";


/* =====================================================
   KONSTANTEN
   ===================================================== */

const WIDTH = 640;
const HEIGHT = 480;

const TAG_ID = 0;
const TAG_SIZE = 0.040;


/* =====================================================
   DOM
   ===================================================== */

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById("analysisCanvas");

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const overlay =
  document.getElementById("overlay");

const overlayCtx =
  overlay.getContext("2d");

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


/* =====================================================
   FEHLER
   ===================================================== */

function showError(error) {

  console.error(error);

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error?.stack ||
      String(error)
    );

}


/* =====================================================
   VORLÄUFIGE INTRINSICS

   Noch unverändert:
   angenommener horizontaler FOV = 60°
   ===================================================== */

const cx =
  WIDTH / 2;

const cy =
  HEIGHT / 2;

const horizontalFov =
  THREE.MathUtils.degToRad(60);

const fx =
  (WIDTH / 2) /
  Math.tan(horizontalFov / 2);

const fy =
  fx;


/* =====================================================
   THREE.JS
   ===================================================== */

const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(
    60,
    4 / 3,
    0.01,
    10
  );


camera.position.set(
  0,
  0,
  0
);


camera.lookAt(
  0,
  0,
  -1
);


const renderer =
  new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });


renderer.domElement.id =
  "threeCanvas";


renderer.setClearColor(
  0x000000,
  0
);


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);


document.body.appendChild(
  renderer.domElement
);


/* =====================================================
   ROTE 3D-KUGEL

   Position kommt aus pose.t
   ===================================================== */

const sphere =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      0.010,
      32,
      24
    ),

    new THREE.MeshBasicMaterial({
      color: 0xff0000
    })

  );


sphere.visible = false;

scene.add(sphere);


/* =====================================================
   APRILTAG
   ===================================================== */

let apriltag = null;

let detectorReady = false;
let cameraReady = false;
let detectionRunning = false;

let latestDetection = null;

let tagDetected = false;
let poseReceived = false;

let lastTx = 0;
let lastTy = 0;
let lastTz = 0;

let detectionCounter = 0;
let detectionFPS = 0;

let fpsStart =
  performance.now();


async function initializeAprilTag() {

  const worker =
    new Worker(
      "./libs/apriltag.js"
    );


  const Apriltag =
    Comlink.wrap(worker);


  apriltag =
    await new Apriltag(

      Comlink.proxy(
        function() {

          detectorReady = true;

        }
      )

    );


  const start =
    performance.now();


  while (!detectorReady) {

    await new Promise(
      resolve =>
        setTimeout(resolve, 20)
    );


    if (
      performance.now() - start >
      15000
    ) {

      throw new Error(
        "AprilTag-WASM wurde nicht bereit."
      );

    }

  }


  await apriltag.set_camera_info(
    fx,
    fy,
    cx,
    cy
  );


  await apriltag.set_tag_size(
    TAG_ID,
    TAG_SIZE
  );


  await apriltag.set_return_pose(
    1
  );


  await apriltag.set_return_solutions(
    1
  );


  await apriltag.set_max_detections(
    1
  );

}


/* =====================================================
   KAMERA
   ===================================================== */

async function startCamera() {

  const stream =
    await navigator.mediaDevices
      .getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: WIDTH
          },

          height: {
            ideal: HEIGHT
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        }

      });


  video.srcObject =
    stream;


  await new Promise(
    resolve => {

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        resolve();

      }

      else {

        video.addEventListener(
          "loadedmetadata",
          resolve,
          {
            once: true
          }
        );

      }

    }
  );


  await video.play();

  cameraReady = true;

}


/* =====================================================
   GRAUSTUFEN
   ===================================================== */

function createGrayscaleImage() {

  analysisCtx.drawImage(
    video,
    0,
    0,
    WIDTH,
    HEIGHT
  );


  const imageData =
    analysisCtx.getImageData(
      0,
      0,
      WIDTH,
      HEIGHT
    );


  const rgba =
    imageData.data;


  const grayscale =
    new Uint8Array(
      WIDTH * HEIGHT
    );


  for (
    let i = 0, j = 0;
    i < rgba.length;
    i += 4, j++
  ) {

    grayscale[j] =
      Math.round(
        (
          rgba[i] +
          rgba[i + 1] +
          rgba[i + 2]
        ) / 3
      );

  }


  return grayscale;

}


/* =====================================================
   3D-TRANSLATION
   ===================================================== */

function applyTranslation(pose) {

  poseReceived = false;

  sphere.visible = false;


  if (
    !pose ||
    !pose.t ||
    pose.t.length < 3
  ) {

    return;

  }


  const tx =
    Number(pose.t[0]);

  const ty =
    Number(pose.t[1]);

  const tz =
    Number(pose.t[2]);


  if (
    !Number.isFinite(tx) ||
    !Number.isFinite(ty) ||
    !Number.isFinite(tz)
  ) {

    return;

  }


  lastTx = tx;
  lastTy = ty;
  lastTz = tz;


  sphere.position.set(
    tx,
    -ty,
    -tz
  );


  sphere.visible = true;

  poseReceived = true;

}


/* =====================================================
   DETEKTION
   ===================================================== */

async function detectFrame() {

  if (
    !detectorReady ||
    !cameraReady ||
    detectionRunning
  ) {

    return;

  }


  detectionRunning = true;


  try {

    const grayscale =
      createGrayscaleImage();


    const result =
      await apriltag.detect(
        grayscale,
        WIDTH,
        HEIGHT
      );


    const detection =
      Array.isArray(result)

        ? result.find(
            d =>
              Number(d.id) === TAG_ID
          )

        : null;


    latestDetection =
      detection || null;


    if (detection) {

      tagDetected = true;


      applyTranslation(
        detection.pose
      );

    }

    else {

      tagDetected = false;
      poseReceived = false;

      sphere.visible = false;

    }


    detectionCounter++;


    const now =
      performance.now();


    if (
      now - fpsStart >= 1000
    ) {

      const seconds =
        (now - fpsStart) / 1000;


      detectionFPS =
        detectionCounter /
        seconds;


      detectionCounter = 0;

      fpsStart = now;

    }

  }

  catch(error) {

    showError(error);

  }

  finally {

    detectionRunning = false;

  }

}


/* =====================================================
   GRÜNER 2D-PUNKT

   detection.center kommt direkt aus
   der Bildanalyse des AprilTags.

   Keine Pose.
   Keine Brennweite.
   Keine 3D-Projektion.
   ===================================================== */

function drawOverlay() {

  overlayCtx.clearRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  if (
    !latestDetection ||
    !latestDetection.center
  ) {

    return;

  }


  const x =
    Number(
      latestDetection.center.x
    );


  const y =
    Number(
      latestDetection.center.y
    );


  if (
    !Number.isFinite(x) ||
    !Number.isFinite(y)
  ) {

    return;

  }


  /*
   * Großer grüner Ring:
   * Tagzentrum aus 2D-Detektion
   */

  overlayCtx.beginPath();

  overlayCtx.arc(
    x,
    y,
    12,
    0,
    Math.PI * 2
  );


  overlayCtx.lineWidth =
    5;


  overlayCtx.strokeStyle =
    "#00ff00";


  overlayCtx.stroke();


  /*
   * Kleines grünes Kreuz
   */

  overlayCtx.beginPath();

  overlayCtx.moveTo(
    x - 18,
    y
  );

  overlayCtx.lineTo(
    x + 18,
    y
  );

  overlayCtx.moveTo(
    x,
    y - 18
  );

  overlayCtx.lineTo(
    x,
    y + 18
  );

  overlayCtx.lineWidth =
    3;


  overlayCtx.strokeStyle =
    "#00ff00";


  overlayCtx.stroke();

}


/* =====================================================
   VIDEO / CANVASES SYNCHRON
   ===================================================== */

function resize() {

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  const videoAspect =
    WIDTH / HEIGHT;

  const screenAspect =
    screenWidth /
    screenHeight;


  let displayWidth;
  let displayHeight;


  if (
    screenAspect >
    videoAspect
  ) {

    displayHeight =
      screenHeight;

    displayWidth =
      displayHeight *
      videoAspect;

  }

  else {

    displayWidth =
      screenWidth;

    displayHeight =
      displayWidth /
      videoAspect;

  }


  const left =
    (
      screenWidth -
      displayWidth
    ) / 2;


  const top =
    (
      screenHeight -
      displayHeight
    ) / 2;


  renderer.setSize(
    displayWidth,
    displayHeight,
    false
  );


  renderer.domElement.style.width =
    displayWidth + "px";

  renderer.domElement.style.height =
    displayHeight + "px";

  renderer.domElement.style.left =
    left + "px";

  renderer.domElement.style.top =
    top + "px";


  overlay.style.width =
    displayWidth + "px";

  overlay.style.height =
    displayHeight + "px";

  overlay.style.left =
    left + "px";

  overlay.style.top =
    top + "px";


  camera.aspect =
    displayWidth /
    displayHeight;


  camera.updateProjectionMatrix();

}


window.addEventListener(
  "resize",
  resize
);


resize();


/* =====================================================
   LOOP
   ===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  if (!detectionRunning) {

    detectFrame();

  }


  drawOverlay();


  renderer.render(
    scene,
    camera
  );


  status.textContent =

    "APRILTAG 5b-5\n\n" +

    "GRÜN = direktes 2D-Tagzentrum\n" +

    "ROT = 3D-Pose\n\n" +

    "Tag 0: " +
    (
      tagDetected
        ? "ERKANNT"
        : "nicht erkannt"
    ) +

    "\nPose: " +
    (
      poseReceived
        ? "JA"
        : "NEIN"
    ) +

    "\nErkennungen/s: " +
    detectionFPS.toFixed(1);

}


/* =====================================================
   START
   ===================================================== */

async function start() {

  try {

    await initializeAprilTag();


    status.textContent =
      "Kamera wird gestartet …";


    await startCamera();


    requestAnimationFrame(
      animate
    );

  }

  catch(error) {

    showError(error);

  }

}


start();

</script>

</body>
</html>
