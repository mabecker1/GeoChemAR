<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>GeoChemAR – 5b Pose-Diagnose</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
  z-index: 1;
}

#analysisCanvas {
  display: none;
}

#status {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;

  z-index: 10;

  padding: 12px;

  border-radius: 8px;

  background: rgba(0,0,0,0.82);
  color: white;

  font-size: 13px;
  line-height: 1.35;

  white-space: pre-wrap;

  max-height: 80vh;
  overflow: auto;
}

#error {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;

  z-index: 20;

  padding: 10px;

  border-radius: 8px;

  background: rgba(160,0,0,0.90);
  color: white;

  font-size: 13px;
  white-space: pre-wrap;

  display: none;
}

</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<canvas
  id="analysisCanvas"
  width="640"
  height="480"
></canvas>

<div id="status">
AprilTag wird initialisiert …
</div>

<div id="error"></div>


<script type="module">

import * as Comlink
  from "https://unpkg.com/comlink/dist/esm/comlink.mjs";


/* =====================================================
   KONSTANTEN
   ===================================================== */

const WIDTH = 640;
const HEIGHT = 480;

const TAG_SIZE = 0.040;


/*
 * Gleiche Intrinsics wie im bisherigen 5b-Test.
 */

const cx = WIDTH / 2;
const cy = HEIGHT / 2;

const horizontalFov =
  60 * Math.PI / 180;

const fx =
  (WIDTH / 2) /
  Math.tan(horizontalFov / 2);

const fy = fx;


/* =====================================================
   DOM
   ===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("analysisCanvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


/* =====================================================
   STATUS
   ===================================================== */

let apriltag = null;

let detectorReady = false;
let cameraReady = false;

let detectionRunning = false;

let latestDetection = null;

let detectionCounter = 0;
let detectionFPS = 0;

let fpsStart =
  performance.now();


/* =====================================================
   FEHLER
   ===================================================== */

function showError(error) {

  console.error(error);

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error && error.stack
        ? error.stack
        : String(error)
    );

}


/* =====================================================
   APRILTAG
   ===================================================== */

async function initializeAprilTag() {

  const worker =
    new Worker(
      "./libs/apriltag.js"
    );

  const Apriltag =
    Comlink.wrap(worker);


  apriltag =
    await new Apriltag(

      Comlink.proxy(
        function() {

          detectorReady =
            true;

        }
      )

    );


  const start =
    performance.now();


  while (!detectorReady) {

    await new Promise(
      resolve =>
        setTimeout(resolve, 20)
    );


    if (
      performance.now() - start >
      15000
    ) {

      throw new Error(
        "AprilTag-WASM wurde nicht bereit."
      );

    }

  }


  /*
   * Kamera-Parameter
   */

  await apriltag.set_camera_info(
    fx,
    fy,
    cx,
    cy
  );


  /*
   * ID 0 ist 40 mm groß.
   *
   * Wichtig:
   * set_tag_size(ID, Größe)
   */

  await apriltag.set_tag_size(
    0,
    TAG_SIZE
  );


  /*
   * Diesmal absichtlich auch die
   * Lösungsdetails zurückgeben.
   *
   * Wir wollen sehen, was der Wrapper
   * tatsächlich liefert.
   */

  await apriltag.set_return_pose(
    1
  );

  await apriltag.set_return_solutions(
    1
  );

  await apriltag.set_max_detections(
    1
  );

}


/* =====================================================
   KAMERA
   ===================================================== */

async function startCamera() {

  const stream =
    await navigator.mediaDevices
      .getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: WIDTH
          },

          height: {
            ideal: HEIGHT
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        }

      });


  video.srcObject =
    stream;


  await new Promise(
    resolve => {

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        resolve();

      }

      else {

        video.addEventListener(
          "loadedmetadata",
          resolve,
          {
            once: true
          }
        );

      }

    }
  );


  await video.play();

  cameraReady = true;

}


/* =====================================================
   GRAUSTUFENBILD
   ===================================================== */

function createGrayscaleImage() {

  ctx.drawImage(
    video,
    0,
    0,
    WIDTH,
    HEIGHT
  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      WIDTH,
      HEIGHT
    );


  const rgba =
    imageData.data;


  const grayscale =
    new Uint8Array(
      WIDTH * HEIGHT
    );


  for (
    let i = 0, j = 0;
    i < rgba.length;
    i += 4, j++
  ) {

    grayscale[j] =
      Math.round(
        (
          rgba[i] +
          rgba[i + 1] +
          rgba[i + 2]
        ) / 3
      );

  }


  return grayscale;

}


/* =====================================================
   DETEKTION
   ===================================================== */

async function detectFrame() {

  if (
    !detectorReady ||
    !cameraReady ||
    detectionRunning
  ) {

    return;

  }


  detectionRunning = true;


  try {

    const grayscale =
      createGrayscaleImage();


    const result =
      await apriltag.detect(
        grayscale,
        WIDTH,
        HEIGHT
      );


    if (
      Array.isArray(result) &&
      result.length > 0
    ) {

      latestDetection =
        result.find(
          detection =>
            Number(detection.id) === 0
        ) || result[0];

    }

    else {

      latestDetection = null;

    }


    detectionCounter++;


    const now =
      performance.now();


    if (
      now - fpsStart >= 1000
    ) {

      const seconds =
        (now - fpsStart) / 1000;

      detectionFPS =
        detectionCounter /
        seconds;

      detectionCounter = 0;
      fpsStart = now;

    }

  }

  catch(error) {

    showError(error);

  }

  finally {

    detectionRunning = false;

  }

}


/* =====================================================
   POSE-DATEN LESBAR DARSTELLEN
   ===================================================== */

function shortJSON(value) {

  try {

    return JSON.stringify(
      value,
      null,
      2
    );

  }

  catch(error) {

    return String(value);

  }

}


/* =====================================================
   LOOP
   ===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  if (!detectionRunning) {

    detectFrame();

  }


  if (!latestDetection) {

    status.textContent =
      "GEOCHEMAR 5b – POSE-DIAGNOSE\n\n" +

      "Detector: " +
      (
        detectorReady
          ? "BEREIT"
          : "lädt …"
      ) +

      "\nKamera: " +
      (
        cameraReady
          ? "BEREIT"
          : "lädt …"
      ) +

      "\nTag 0: nicht erkannt" +

      "\nErkennungen/s: " +
      detectionFPS.toFixed(1);

    return;

  }


  /*
   * Wir zeigen:
   *
   * 1. vorhandene Feldnamen
   * 2. pose
   * 3. vollständige Detection
   */


  const keys =
    Object.keys(
      latestDetection
    );


  status.textContent =

    "GEOCHEMAR 5b – POSE-DIAGNOSE\n\n" +

    "Tag: " +
    latestDetection.id +

    "\nErkennungen/s: " +
    detectionFPS.toFixed(1) +

    "\n\nFELDNAMEN:\n" +
    keys.join(", ") +

    "\n\nPOSE:\n" +
    shortJSON(
      latestDetection.pose
    ) +

    "\n\nVOLLSTÄNDIGE DETECTION:\n" +
    shortJSON(
      latestDetection
    );

}


/* =====================================================
   START
   ===================================================== */

async function start() {

  try {

    status.textContent =
      "AprilTag wird gestartet …";


    await initializeAprilTag();


    status.textContent =
      "Kamera wird gestartet …";


    await startCamera();


    requestAnimationFrame(
      animate
    );

  }

  catch(error) {

    showError(error);

  }

}


start();

</script>

</body>
</html>
