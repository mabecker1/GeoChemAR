<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Geometrie-Test</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    /*
      Der Host und die A-Frame-Szene müssen über
      dem Kameravideo liegen.

      Das war die Ursache dafür, dass unsere
      3D-Objekte zuvor verschwunden waren.
    */

    #sceneHost {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10 !important;
      width: 100%;
      height: 100%;
      pointer-events: none !important;
    }

    #arScene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none !important;
      background: transparent !important;
    }

    /*
      Kameravideo unter der A-Frame-Szene.

      WICHTIG:
      Hier ändern wir NICHT width, height,
      object-fit oder transform.
    */

    #arjs-video {
      position: fixed !important;
      z-index: 1 !important;

      visibility: visible !important;
      opacity: 1 !important;
    }

    /*
      Der Canvas liegt über dem Video.

      Position und Größe werden später per
      JavaScript exakt an das sichtbare
      Kameravideo angepasst.
    */

    canvas.a-canvas {
      position: fixed !important;
      z-index: 11 !important;

      visibility: visible !important;
      opacity: 1 !important;

      display: block !important;

      background: transparent !important;

      pointer-events: none !important;
    }


    /* =========================================
       Startbildschirm Smartphone
       ========================================= */

    #startScreen {
      position: fixed;
      inset: 0;

      z-index: 2147483647;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding: 30px;

      background: #111;

      color: white;

      text-align: center;
    }

    #startScreen.visible {
      display: flex;
    }

    #startContent {
      width: 100%;
      max-width: 420px;
    }

    #rotateIcon {
      margin-bottom: 20px;

      font-size: 64px;
      line-height: 1;
    }

    #startTitle {
      display: block;

      margin-bottom: 12px;

      font-size: 23px;
      font-weight: bold;
    }

    #startText {
      margin-bottom: 22px;

      font-size: 15px;
      line-height: 1.45;

      opacity: 0.9;
    }

    #startButton {
      display: none;

      margin: 0 auto;

      padding: 13px 25px;

      border: 0;
      border-radius: 8px;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      background: white;
      color: #111;
    }


    /* =========================================
       Status
       ========================================= */

    #status {
      position: fixed;

      top: max(6px, env(safe-area-inset-top));
      left: max(6px, env(safe-area-inset-left));
      right: max(6px, env(safe-area-inset-right));

      z-index: 100000;

      box-sizing: border-box;

      padding: 9px 11px;

      background: rgba(0, 0, 0, 0.82);

      color: white;

      font-size: 11px;
      line-height: 1.5;

      border-radius: 6px;

      pointer-events: none;
    }

    #markerStatus {
      font-weight: bold;
    }

  </style>
</head>


<body>

  <div id="sceneHost"></div>


  <div id="status">

    <div id="systemStatus">
      GeoChemAR startet …
    </div>

    <div id="markerStatus">
      Marker: wartet …
    </div>

    <div id="geometryStatus">
      Geometrie: wartet …
    </div>

  </div>


  <div id="startScreen">

    <div id="startContent">

      <div id="rotateIcon">
        ↻
      </div>

      <div id="startTitle">
        Bitte Smartphone drehen
      </div>

      <div id="startText">
        GeoChemAR wird im Querformat verwendet.
      </div>

      <button id="startButton">
        AR starten
      </button>

    </div>

  </div>



<script>

const sceneHost =
  document.getElementById("sceneHost");

const systemStatus =
  document.getElementById("systemStatus");

const markerStatus =
  document.getElementById("markerStatus");

const geometryStatus =
  document.getElementById("geometryStatus");

const startScreen =
  document.getElementById("startScreen");

const rotateIcon =
  document.getElementById("rotateIcon");

const startTitle =
  document.getElementById("startTitle");

const startText =
  document.getElementById("startText");

const startButton =
  document.getElementById("startButton");


let arStarted = false;

let cameraOptimized = false;

let sceneLoaded = false;

let markerFoundCount = 0;



/* ==================================================
   Gerät erkennen
   ================================================== */

function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}



/* ==================================================
   Orientierung
   ================================================== */

function isLandscape() {

  return (
    window.innerWidth >
    window.innerHeight
  );

}



/* ==================================================
   Startbildschirm
   ================================================== */

function updateStartScreen() {

  if (!isMobileDevice()) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (arStarted) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (!isLandscape()) {

    rotateIcon.style.display =
      "block";

    startTitle.textContent =
      "Bitte Smartphone drehen";

    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";

    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";

    startTitle.textContent =
      "GeoChemAR";

    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";

    startButton.style.display =
      "block";

  }

}



/* ==================================================
   AR-Szene
   ================================================== */

function createARScene() {

  if (arStarted) {
    return;
  }


  arStarted = true;


  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono;
      "

    >


      <!-- ======================================
           Hiro-Marker
           ====================================== -->

      <a-marker

        id="hiroMarker"

        preset="hiro"

        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2"

      >


        <!--
          Blauer Würfel wie in unserer
          funktionierenden Ausgangsversion
        -->

        <a-box

          id="testBox"

          position="0 0.3 0"

          width="0.6"
          height="0.6"
          depth="0.6"

          material="
            color: #2563eb;
            opacity: 0.8;
            transparent: true;
            side: double;
          "

        >
        </a-box>


      </a-marker>



      <!-- ======================================
           AR-Kamera

           Pinkes Quadrat bleibt vorerst drin,
           weil man daran Verzerrung sehr gut
           erkennen kann.
           ====================================== -->

      <a-entity

        id="arCamera"

        camera

      >


        <a-plane

          id="rendererTest"

          position="0 0 -2"

          width="0.6"
          height="0.6"

          material="
            color: #ff00ff;
            shader: flat;
            side: double;
            opacity: 1;
            transparent: false;
          "

        >
        </a-plane>


      </a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );


  const scene =
    document.getElementById(
      "arScene"
    );


  const marker =
    document.getElementById(
      "hiroMarker"
    );


  if (marker) {

    marker.addEventListener(

      "markerFound",

      function () {

        markerFoundCount++;


        markerStatus.textContent =

          "Marker: GEFUNDEN | Erkennungen: "
          +
          markerFoundCount;

      }

    );


    marker.addEventListener(

      "markerLost",

      function () {

        markerStatus.textContent =

          "Marker: verloren | Erkennungen: "
          +
          markerFoundCount;

      }

    );


    markerStatus.textContent =
      "Marker: NICHT ERKANNT";

  }


  if (scene) {

    scene.addEventListener(

      "loaded",

      function () {

        sceneLoaded = true;

      }

    );


    if (scene.hasLoaded) {

      sceneLoaded = true;

    }

  }

}



/* ==================================================
   Mobiler Start
   ================================================== */

async function startMobileAR() {

  if (!isLandscape()) {

    updateStartScreen();

    return;

  }


  try {

    const element =
      document.documentElement;


    if (
      element.requestFullscreen
    ) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }


  try {

    if (
      screen.orientation
      &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }


  setTimeout(

    createARScene,

    400

  );

}



/* ==================================================
   AR-Video finden
   ================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ==================================================
   Ebenen erzwingen
   ================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );

  const scene =
    document.getElementById(
      "arScene"
    );

  const video =
    getARVideo();

  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (host) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }


  if (scene) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );

    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }


  if (video) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );


    video.setAttribute(
      "playsinline",
      ""
    );


    video.setAttribute(
      "webkit-playsinline",
      ""
    );


    video.muted = true;

  }


  if (canvas) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );

    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ==================================================
   NEU:
   Sichtbare Geometrie von Video und Canvas
   synchronisieren

   WICHTIG:
   Wir verändern ausschließlich CSS.

   NICHT verändert werden:
   - renderer.setSize()
   - canvas.width / canvas.height
   - camera.aspect
   - camera.projectionMatrix
   - updateProjectionMatrix()
   ================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (
    !video ||
    !canvas
  ) {

    return;

  }


  /*
    Wir fragen den Browser:

    Wo liegt das Kameravideo TATSÄCHLICH
    auf dem Bildschirm?

    getBoundingClientRect() berücksichtigt
    die von AR.js gesetzte Position und Größe.
  */

  const rect =
    video.getBoundingClientRect();


  /*
    Solange das Video noch nicht wirklich
    aufgebaut wurde, machen wir nichts.
  */

  if (
    rect.width <= 0 ||
    rect.height <= 0
  ) {

    return;

  }


  /*
    Canvas exakt auf denselben sichtbaren
    Ausschnitt legen.
  */

  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );


  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );


  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );


  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );


  /*
    Falls von A-Frame bottom/right gesetzt
    wurden, verhindern wir konkurrierende
    CSS-Geometrie.

    Auch das betrifft NUR CSS.
  */

  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );


  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}



/* ==================================================
   Geometrie-Diagnose
   ================================================== */

function updateGeometryDiagnostics() {

  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (!video) {

    geometryStatus.textContent =
      "Geometrie: Video fehlt";

    return;

  }


  if (!canvas) {

    geometryStatus.textContent =
      "Geometrie: Canvas fehlt";

    return;

  }


  const videoRect =
    video.getBoundingClientRect();


  const canvasRect =
    canvas.getBoundingClientRect();


  geometryStatus.textContent =

    "Video sichtbar: "
    +
    Math.round(videoRect.width)
    +
    "×"
    +
    Math.round(videoRect.height)

    +

    " | Video pos: "
    +
    Math.round(videoRect.left)
    +
    ","
    +
    Math.round(videoRect.top)

    +

    " | Canvas sichtbar: "
    +
    Math.round(canvasRect.width)
    +
    "×"
    +
    Math.round(canvasRect.height)

    +

    " | Canvas pos: "
    +
    Math.round(canvasRect.left)
    +
    ","
    +
    Math.round(canvasRect.top)

    +

    " | Canvas intern: "
    +
    canvas.width
    +
    "×"
    +
    canvas.height;

}



/* ==================================================
   Smartphone-Kamera optimieren
   ================================================== */

async function optimizeMobileCamera() {

  if (cameraOptimized) {
    return;
  }


  if (!arStarted) {
    return;
  }


  if (!isMobileDevice()) {

    cameraOptimized = true;

    return;

  }


  const video =
    getARVideo();


  if (!video) {
    return;
  }


  const stream =
    video.srcObject;


  if (!stream) {
    return;
  }


  const tracks =
    stream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }


  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        const desiredZoom =

          Math.max(

            capabilities.zoom.min,

            Math.min(
              1,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [
            {
              zoom: desiredZoom
            }
          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized = true;

}



/* ==================================================
   Status
   ================================================== */

function updateStatus() {

  if (!arStarted) {

    systemStatus.textContent =
      "AR noch nicht gestartet";

    return;

  }


  const video =
    getARVideo();


  let text = "";


  text +=

    typeof AFRAME !== "undefined"

      ? "A-Frame: OK"

      : "A-Frame: FEHLT";


  let arjsOK = false;


  if (
    typeof AFRAME !== "undefined"
    &&
    AFRAME.components
    &&
    AFRAME.components.arjs
  ) {

    arjsOK = true;

  }


  text +=

    arjsOK

      ? " | AR.js: OK"

      : " | AR.js: ?";


  text +=

    sceneLoaded

      ? " | Szene: OK"

      : " | Szene: lädt";


  if (video) {

    text +=

      " | Video "
      +
      video.videoWidth
      +
      "×"
      +
      video.videoHeight;

  }

  else {

    text +=
      " | Video: fehlt";

  }


  systemStatus.textContent =
    text;


  updateGeometryDiagnostics();

}



/* ==================================================
   Orientierung
   ================================================== */

function orientationChanged() {

  if (!arStarted) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (!isMobileDevice()) {
    return;
  }


  if (!isLandscape()) {

    const video =
      getARVideo();


    if (
      video
      &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    location.reload();

  }

}



/* ==================================================
   Events
   ================================================== */

startButton.addEventListener(

  "click",

  startMobileAR

);



window.addEventListener(

  "orientationchange",

  function () {

    setTimeout(
      orientationChanged,
      250
    );

  }

);



window.addEventListener(

  "resize",

  function () {

    if (!arStarted) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);



/* ==================================================
   Start
   ================================================== */

if (isMobileDevice()) {

  updateStartScreen();

}

else {

  createARScene();

}



/* ==================================================
   Laufende Pflege
   ================================================== */

setInterval(

  function () {

    if (!arStarted) {
      return;
    }


    /*
      Reihenfolge absichtlich:

      1. Ebenen korrekt setzen
      2. Kamera ggf. optimieren
      3. sichtbare Canvas-Geometrie
         ans Video anpassen
      4. Diagnose anzeigen
    */

    enforceLayers();

    optimizeMobileCamera();

    synchronizeVisualGeometry();

    updateStatus();

  },

  250

);

</script>

</body>
</html>
