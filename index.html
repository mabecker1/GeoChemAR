<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    /* VR-Button sicher ausblenden */
    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #status {
      position: fixed;
      top: max(6px, env(safe-area-inset-top));
      left: max(6px, env(safe-area-inset-left));
      right: max(6px, env(safe-area-inset-right));

      z-index: 99999;

      padding: 6px 8px;
      box-sizing: border-box;

      background: rgba(0, 0, 0, 0.72);
      color: white;

      font-size: 10px;
      line-height: 1.25;

      border-radius: 6px;

      pointer-events: none;
    }

    #rotateMessage {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 100000;

      background: #111;
      color: white;

      align-items: center;
      justify-content: center;

      text-align: center;
      box-sizing: border-box;

      padding: 30px;
    }

    #rotateMessage strong {
      display: block;
      font-size: 22px;
      margin-bottom: 8px;
    }

    #rotateMessage span {
      font-size: 15px;
    }

    @media (orientation: portrait) {
      #rotateMessage {
        display: flex;
      }

      #status {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="rotateMessage">
    <div>
      <strong>Bitte Smartphone drehen</strong>
      <span>GeoChemAR wird im Querformat verwendet.</span>
    </div>
  </div>

  <div id="status">
    GeoChemAR startet …
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"

    arjs="
      sourceType: webcam;
      sourceWidth: 640;
      sourceHeight: 480;
      displayWidth: 640;
      displayHeight: 480;
      debugUIEnabled: false;
      detectionMode: mono;
    "
  >

    <a-marker
      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >

      <a-box
        position="0 0.3 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
          side: double;
        "
      >
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>


<script>

const status = document.getElementById("status");


function updateStatus() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  let text =
    "Display: " +
    window.innerWidth +
    "×" +
    window.innerHeight;

  text +=
    window.innerWidth > window.innerHeight
      ? " | Querformat"
      : " | Hochformat";

  if (video) {

    text +=
      " | Kamera: " +
      video.videoWidth +
      "×" +
      video.videoHeight;

    text +=
      " | ready: " +
      video.readyState;

  } else {

    text += " | Kamera: nicht gefunden";

  }

  status.textContent = text;
}


setInterval(updateStatus, 1000);

</script>

</body>
</html>
