    </button>

<script>


/* ==========================================================
   KALIBRIERUNG
   ========================================================== */

AFRAME.registerComponent("cube-calibration", {

  init: function () {

    const THREE =
      AFRAME.THREE;


    this.markers = [];

    this.visible = [
      false,
      false,
      false,
      false,
      false,
      false
    ];


    /*
     * Diese fünf Verbindungen reichen aus,
     * um alle sechs Würfelseiten miteinander
     * zu verbinden.
     */

    this.pairs = [

      [1, 0],
      [1, 2],
      [1, 4],
      [2, 3],
      [1, 5]

    ];


    this.currentPair =
      0;


    this.samples =
      [];


    this.results =
      [];


    this.sampleCount =
      40;


    this.collecting =
      false;


    this.instruction =
      document.getElementById(
        "instruction"
      );


    this.visibleMarkers =
      document.getElementById(
        "visibleMarkers"
      );


    this.progress =
      document.getElementById(
        "progress"
      );


    this.button =
      document.getElementById(
        "calibrationButton"
      );


    this.measurement =
      document.getElementById(
        "measurement"
      );


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      const marker =
        document.getElementById(
          "marker" + i
        );


      this.markers[i] =
        marker;


      marker.addEventListener(

        "markerFound",

        () => {

          this.visible[i] =
            true;

        }

      );


      marker.addEventListener(

        "markerLost",

        () => {

          this.visible[i] =
            false;

        }

      );

    }


    this.button.addEventListener(

      "click",

      () => {

        if (
          this.collecting
        ) {

          return;

        }


        const pair =
          this.pairs[
            this.currentPair
          ];


        if (
          !pair
        ) {

          return;

        }


        if (
          !this.visible[pair[0]]
          ||
          !this.visible[pair[1]]
        ) {

          return;

        }


        this.samples =
          [];


        this.collecting =
          true;


        this.button.style.display =
          "none";


        this.instruction.textContent =
          "Würfel ruhig halten – Messung läuft …";

      }

    );


    this.updateUI();

  },



  /* ======================================================
     Relative Pose A -> B messen
     ====================================================== */

  getRelativeMatrix: function (
    a,
    b
  ) {

    const THREE =
      AFRAME.THREE;


    const markerA =
      this.markers[a];


    const markerB =
      this.markers[b];


    markerA.object3D.updateMatrixWorld(
      true
    );


    markerB.object3D.updateMatrixWorld(
      true
    );


    const inverseA =
      new THREE.Matrix4()
        .copy(
          markerA.object3D.matrixWorld
        )
        .invert();


    return new THREE.Matrix4()
      .multiplyMatrices(

        inverseA,

        markerB.object3D.matrixWorld

      );

  },



  /* ======================================================
     Messwerte mitteln
     ====================================================== */

  averageSamples: function () {

    const THREE =
      AFRAME.THREE;


    const avgPosition =
      new THREE.Vector3();


    const quaternions =
      [];


    for (
      const matrix of this.samples
    ) {

      const p =
        new THREE.Vector3();


      const q =
        new THREE.Quaternion();


      const s =
        new THREE.Vector3();


      matrix.decompose(
        p,
        q,
        s
      );


      avgPosition.add(
        p
      );


      quaternions.push(
        q
      );

    }


    avgPosition.multiplyScalar(

      1 /
      this.samples.length

    );



    /*
     * Quaternion-Mittelung:
     * schrittweises Slerp.
     */

    const avgQuaternion =
      quaternions[0].clone();


    for (
      let i = 1;
      i < quaternions.length;
      i++
    ) {

      let q =
        quaternions[i].clone();


      /*
       * q und -q beschreiben dieselbe Rotation.
       * Vor dem Mitteln gleiche Hemisphäre wählen.
       */

      if (
        avgQuaternion.dot(q) < 0
      ) {

        q.set(
          -q.x,
          -q.y,
          -q.z,
          -q.w
        );

      }


      avgQuaternion.slerp(

        q,

        1 / (i + 1)

      );

    }


    avgQuaternion.normalize();


    const scale =
      new THREE.Vector3(
        1,
        1,
        1
      );


    const result =
      new THREE.Matrix4()
        .compose(

          avgPosition,
          avgQuaternion,
          scale

        );


    return {

      matrix: result,

      position: avgPosition,

      quaternion: avgQuaternion

    };

  },



  /* ======================================================
     UI
     ====================================================== */

  updateUI: function () {

    const visibleIDs =
      [];


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      if (
        this.visible[i]
      ) {

        visibleIDs.push(
          i
        );

      }

    }


    this.visibleMarkers.textContent =

      "Sichtbar: "
      +
      (
        visibleIDs.length
        ?
        visibleIDs.join(", ")
        :
        "–"
      );


    this.progress.textContent =

      "Messung: "
      +
      this.currentPair
      +
      " / "
      +
      this.pairs.length;


    if (
      this.currentPair >=
      this.pairs.length
    ) {

      this.instruction.textContent =
        "Kalibrierung abgeschlossen.";


      this.button.style.display =
        "none";


      return;

    }


    const pair =
      this.pairs[
        this.currentPair
      ];


    if (
      this.collecting
    ) {

      return;

    }


    this.instruction.textContent =

      "Bitte Marker "
      +
      pair[0]
      +
      " und "
      +
      pair[1]
      +
      " gleichzeitig gut sichtbar halten.";


    if (
      this.visible[pair[0]]
      &&
      this.visible[pair[1]]
    ) {

      this.button.style.display =
        "block";


      this.button.textContent =

        "Marker "
        +
        pair[0]
        +
        " ↔ "
        +
        pair[1]
        +
        " messen";

    }

    else {

      this.button.style.display =
        "none";

    }

  },



  /* ======================================================
     Tick
     ====================================================== */

  tick: function () {

    this.updateUI();


    if (
      !this.collecting
    ) {

      return;

    }


    const pair =
      this.pairs[
        this.currentPair
      ];


    if (
      !pair
    ) {

      this.collecting =
        false;

      return;

    }


    /*
     * Sobald während der Messung einer der Marker
     * verloren geht, brechen wir die Messung ab.
     */

    if (
      !this.visible[pair[0]]
      ||
      !this.visible[pair[1]]
    ) {

      this.collecting =
        false;


      this.samples =
        [];


      this.instruction.textContent =

        "Messung abgebrochen – beide Marker müssen sichtbar bleiben.";


      return;

    }


    const matrix =
      this.getRelativeMatrix(

        pair[0],
        pair[1]

      );


    this.samples.push(
      matrix
    );


    this.instruction.textContent =

      "Würfel ruhig halten – "
      +
      this.samples.length
      +
      " / "
      +
      this.sampleCount;


    if (
      this.samples.length <
      this.sampleCount
    ) {

      return;

    }



    /* ====================================================
       Messung abgeschlossen
       ==================================================== */

    const result =
      this.averageSamples();


    this.results.push({

      a: pair[0],

      b: pair[1],

      matrix:
        result.matrix.clone(),

      position:
        result.position.clone(),

      quaternion:
        result.quaternion.clone()

    });


    const p =
      result.position;


    const q =
      result.quaternion;


    this.measurement.textContent +=

      "\n"
      +
      pair[0]
      +
      " -> "
      +
      pair[1]
      +
      "\n"
      +
      "P: "
      +
      p.x.toFixed(4)
      +
      ", "
      +
      p.y.toFixed(4)
      +
      ", "
      +
      p.z.toFixed(4)
      +
      "\n"
      +
      "Q: "
      +
      q.x.toFixed(5)
      +
      ", "
      +
      q.y.toFixed(5)
      +
      ", "
      +
      q.z.toFixed(5)
      +
      ", "
      +
      q.w.toFixed(5)
      +
      "\n";


    console.log(

      "GeoChemAR calibration",

      pair[0],
      "->",
      pair[1],

      {

        position: [
          p.x,
          p.y,
          p.z
        ],

        quaternion: [
          q.x,
          q.y,
          q.z,
          q.w
        ],

        matrix:
          result.matrix.toArray()

      }

    );


    this.collecting =
      false;


    this.samples =
      [];


    this.currentPair++;


    if (
      this.currentPair >=
      this.pairs.length
    ) {

      this.showFinalResult();

    }

  },



  /* ======================================================
     Gesamtergebnis
     ====================================================== */

  showFinalResult: function () {

    let text =

      "\n=== KALIBRIERUNG FERTIG ===\n";


    for (
      const r of this.results
    ) {

      text +=

        "\n"
        +
        r.a
        +
        " -> "
        +
        r.b
        +
        "\n";


      text +=

        "P: "
        +
        r.position.x.toFixed(4)
        +
        ", "
        +
        r.position.y.toFixed(4)
        +
        ", "
        +
        r.position.z.toFixed(4)
        +
        "\n";


      text +=

        "Q: "
        +
        r.quaternion.x.toFixed(5)
        +
        ", "
        +
        r.quaternion.y.toFixed(5)
        +
        ", "
        +
        r.quaternion.z.toFixed(5)
        +
        ", "
        +
        r.quaternion.w.toFixed(5)
        +
        "\n";

    }


    this.measurement.textContent =
      text;


    this.instruction.textContent =

      "Fertig. Bitte die unten angezeigten Messwerte an ChatGPT schicken.";


    this.progress.textContent =

      "Messung: "
      +
      this.pairs.length
      +
      " / "
      +
      this.pairs.length;


    console.log(
      text
    );

  }

});



/* ==========================================================
   HAUPTPROGRAMM
   ========================================================== */

const sceneHost =
  document.getElementById(
    "sceneHost"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const rotateIcon =
  document.getElementById(
    "rotateIcon"
  );


const startTitle =
  document.getElementById(
    "startTitle"
  );


const startText =
  document.getElementById(
    "startText"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


let arStarted =
  false;


let cameraOptimized =
  false;



function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}



function isLandscape() {

  return (

    window.innerWidth
    >
    window.innerHeight

  );

}



function updateStartScreen() {

  if (
    !isMobileDevice()
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (
    arStarted
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (
    !isLandscape()
  ) {

    rotateIcon.style.display =
      "block";


    startTitle.textContent =
      "Bitte Smartphone drehen";


    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";


    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";


    startTitle.textContent =
      "GeoChemAR";


    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";


    startButton.style.display =
      "block";

  }

}



/* ==========================================================
   AR-SZENE
   ========================================================== */

function createARScene() {

  if (
    arStarted
  ) {

    return;

  }


  arStarted =
    true;


  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
      "

    >


      <a-marker
        id="marker0"
        type="barcode"
        value="0"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker1"
        type="barcode"
        value="1"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker2"
        type="barcode"
        value="2"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker3"
        type="barcode"
        value="3"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker4"
        type="barcode"
        value="4"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker5"
        type="barcode"
        value="5"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>



      <!-- Kalibrierung läuft auf einem unsichtbaren Entity -->

      <a-entity
        cube-calibration>
      </a-entity>


      <a-entity camera></a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );

}



/* ==========================================================
   MOBILER START
   ========================================================== */

async function startMobileAR() {

  if (
    !isLandscape()
  ) {

    updateStartScreen();

    return;

  }


  try {

    const element =
      document.documentElement;


    if (
      element.requestFullscreen
    ) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }


  try {

    if (
      screen.orientation
      &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }


  setTimeout(

    createARScene,

    400

  );

}



/* ==========================================================
   AR-VIDEO
   ========================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ==========================================================
   EBENEN
   ========================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );


  const scene =
    document.getElementById(
      "arScene"
    );


  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (host) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }


  if (scene) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );

    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }


  if (video) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.muted =
      true;

  }


  if (canvas) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );

    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ==========================================================
   VIDEO UND CANVAS SYNCHRONISIEREN
   ========================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (
    !video
    ||
    !canvas
  ) {

    return;

  }


  const rect =
    video.getBoundingClientRect();


  if (
    rect.width <= 0
    ||
    rect.height <= 0
  ) {

    return;

  }


  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );


  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );


  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );


  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );


  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );


  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}



/* ==========================================================
   SMARTPHONE-KAMERA
   ========================================================== */

async function optimizeMobileCamera() {

  if (
    cameraOptimized
    ||
    !arStarted
  ) {

    return;

  }


  if (
    !isMobileDevice()
  ) {

    cameraOptimized =
      true;

    return;

  }


  const video =
    getARVideo();


  if (
    !video
    ||
    !video.srcObject
  ) {

    return;

  }


  const tracks =
    video.srcObject.getVideoTracks();


  if (
    !tracks.length
  ) {

    return;

  }


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }


  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        const desiredZoom =

          Math.max(

            capabilities.zoom.min,

            Math.min(
              1,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized =
    true;

}



/* ==========================================================
   ORIENTIERUNGSWECHSEL
   ========================================================== */

function orientationChanged() {

  if (
    !arStarted
  ) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (
    !isMobileDevice()
  ) {

    return;

  }


  if (
    !isLandscape()
  ) {

    const video =
      getARVideo();


    if (
      video
      &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    location.reload();

  }

}



/* ==========================================================
   EVENTS
   ========================================================== */

startButton.addEventListener(
  "click",
  startMobileAR
);


window.addEventListener(

  "orientationchange",

  function () {

    setTimeout(
      orientationChanged,
      250
    );

  }

);


window.addEventListener(

  "resize",

  function () {

    if (
      !arStarted
    ) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);



/* ==========================================================
   START
   ========================================================== */

if (
  isMobileDevice()
) {

  updateStartScreen();

}

else {

  createARScene();

}



/* ==========================================================
   LAUFENDE PFLEGE
   ========================================================== */

setInterval(

  function () {

    if (
      !arStarted
    ) {

      return;

    }


    enforceLayers();

    optimizeMobileCamera();

    synchronizeVisualGeometry();

  },

  250

);


</script>
