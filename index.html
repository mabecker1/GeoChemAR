<script>


/* ==========================================================
   METHAN
   ========================================================== */

AFRAME.registerComponent("methane-model", {

  init: function () {

    const THREE =
      AFRAME.THREE;


    const group =
      new THREE.Group();


    const carbonRadius =
      0.22;

    const hydrogenRadius =
      0.14;

    const hydrogenDistance =
      0.72;

    const bondRadius =
      0.040;


    const carbonMaterial =
      new THREE.MeshStandardMaterial({

        color: 0x202020,
        roughness: 0.55,
        metalness: 0

      });


    const hydrogenMaterial =
      new THREE.MeshStandardMaterial({

        color: 0xffffff,
        roughness: 0.45,
        metalness: 0

      });


    const bondMaterial =
      new THREE.MeshStandardMaterial({

        color: 0xb8bec7,
        roughness: 0.50,
        metalness: 0

      });



    const carbonGeometry =
      new THREE.SphereGeometry(

        carbonRadius,
        48,
        32

      );


    const carbon =
      new THREE.Mesh(

        carbonGeometry,
        carbonMaterial

      );


    group.add(
      carbon
    );



    const hydrogenGeometry =
      new THREE.SphereGeometry(

        hydrogenRadius,
        40,
        28

      );


    const directions = [

      new THREE.Vector3(1, 1, 1),

      new THREE.Vector3(1, -1, -1),

      new THREE.Vector3(-1, 1, -1),

      new THREE.Vector3(-1, -1, 1)

    ];


    directions.forEach(

      direction =>
        direction.normalize()

    );


    const yAxis =
      new THREE.Vector3(
        0,
        1,
        0
      );


    directions.forEach(
      function (direction) {


        const hydrogen =
          new THREE.Mesh(

            hydrogenGeometry,
            hydrogenMaterial

          );


        hydrogen.position.copy(

          direction
            .clone()
            .multiplyScalar(
              hydrogenDistance
            )

        );


        group.add(
          hydrogen
        );



        /*
         * Bindungsstab exakt von
         * Kugeloberfläche zu Kugeloberfläche.
         */

        const startDistance =
          carbonRadius;


        const endDistance =
          hydrogenDistance
          -
          hydrogenRadius;


        const startPoint =

          direction
            .clone()
            .multiplyScalar(
              startDistance
            );


        const endPoint =

          direction
            .clone()
            .multiplyScalar(
              endDistance
            );


        const bondVector =

          endPoint
            .clone()
            .sub(
              startPoint
            );


        const bondLength =
          bondVector.length();


        const bondGeometry =
          new THREE.CylinderGeometry(

            bondRadius,
            bondRadius,
            bondLength,
            32,
            1,
            false

          );


        const bond =
          new THREE.Mesh(

            bondGeometry,
            bondMaterial

          );


        bond.position.copy(

          startPoint
            .clone()
            .add(
              endPoint
            )
            .multiplyScalar(
              0.5
            )

        );


        bond.quaternion.setFromUnitVectors(

          yAxis,
          direction

        );


        group.add(
          bond
        );

      }
    );


    this.el.setObject3D(

      "methaneMesh",
      group

    );

  },


  remove: function () {

    this.el.removeObject3D(
      "methaneMesh"
    );

  }

});



/* ==========================================================
   EIGENROTATION DES MOLEKÜLS

   Diese Rotation ist ABSICHTLICH unabhängig
   von der Würfelpose.
   ========================================================== */

AFRAME.registerComponent("molecule-spin", {

  schema: {

    speedY: {
      type: "number",
      default: 18
    },

    speedX: {
      type: "number",
      default: 7
    }

  },


  tick: function (time, delta) {

    if (
      !delta
    ) {

      return;

    }


    const seconds =
      delta / 1000;


    this.el.object3D.rotation.y +=

      THREE.MathUtils.degToRad(
        this.data.speedY
      )
      *
      seconds;


    this.el.object3D.rotation.x +=

      THREE.MathUtils.degToRad(
        this.data.speedX
      )
      *
      seconds;

  }

});



/* ==========================================================
   WÜRFELTRACKER – PHASE 4d-2

   Ein gemeinsames Würfelkoordinatensystem.

   Mehrere sichtbare Marker liefern mehrere Schätzungen
   derselben Würfelpose.

   Position und Rotation werden anschließend gemittelt.
   ========================================================== */

AFRAME.registerComponent("cube-fusion", {

  init: function () {

    const THREE =
      AFRAME.THREE;


    this.markers =
      [];


    this.detected = [

      false,
      false,
      false,
      false,
      false,
      false

    ];


    /*
     * Kurzer eigener Hold.
     *
     * NICHT die alte Marker-Sichtbarkeit manipulieren.
     * Wir speichern lediglich, wann ein Marker zuletzt
     * tatsächlich gesehen wurde.
     */

    this.lastSeen = [

      0,
      0,
      0,
      0,
      0,
      0

    ];


    this.holdTime =
      250;



    /* ======================================================
       IDEALE WÜRFELGEOMETRIE
       ======================================================

       Marker 1 ist unser Referenzkoordinatensystem.

       Die Marker-Mittelpunkte benachbarter Würfelseiten
       liegen bei einem idealen Würfel geometrisch fest.

       h = halbe Würfelkantenlänge in AR.js-Marker-Einheiten.
       ====================================================== */

    const h =
      0.5;



    /*
     * Für jeden Marker speichern wir:
     *
     * Position des Markerzentrums relativ zum Würfelzentrum
     * und
     * Orientierung der Markerfläche.
     *
     * Die Drehorientierungen berücksichtigen die
     * gemessenen Markerorientierungen des realen Würfels.
     */

    this.faceData = [

      /* Marker 0 – oben */
      {
        position:
          new THREE.Vector3(
            0,
            h,
            0
          ),

        quaternion:
          new THREE.Quaternion(
            -0.71402,
            -0.00232,
            0.00412,
            0.70011
          ).normalize()
      },


      /* Marker 1 – Referenz / vorne */
      {
        position:
          new THREE.Vector3(
            0,
            0,
            h
          ),

        quaternion:
          new THREE.Quaternion(
            0,
            0,
            0,
            1
          )
      },


      /* Marker 2 – rechts */
      {
        position:
          new THREE.Vector3(
            h,
            0,
            0
          ),

        quaternion:
          new THREE.Quaternion(
            0.73739,
            0.67544,
            0.00384,
            0.00543
          ).normalize()
      },


      /*
       * Marker 3 – hinten
       *
       * Seine gemessene Orientierung stammt relativ
       * zu Marker 2. Sie wird unten zu Marker 1
       * zusammengesetzt.
       */
      {
        position:
          new THREE.Vector3(
            0,
            0,
            -h
          ),

        quaternion:
          null
      },


      /* Marker 4 – links */
      {
        position:
          new THREE.Vector3(
            -h,
            0,
            0
          ),

        quaternion:
          new THREE.Quaternion(
            -0.00465,
            -0.00539,
            0.72958,
            0.68386
          ).normalize()
      },


      /* Marker 5 – unten */
      {
        position:
          new THREE.Vector3(
            0,
            -h,
            0
          ),

        quaternion:
          new THREE.Quaternion(
            0.72399,
            -0.00474,
            0.01871,
            0.68954
          ).normalize()
      }

    ];



    /*
     * Marker 3:
     *
     * q(1->3) =
     * q(1->2) * q(2->3)
     */

    const q23 =
      new THREE.Quaternion(

        -0.19749,
        0.98009,
        0.00933,
        0.01826

      ).normalize();


    this.faceData[3].quaternion =

      this.faceData[2]
        .quaternion
        .clone()
        .multiply(
          q23
        )
        .normalize();



    /*
     * Aus den Face-Daten Matrizen bauen.
     *
     * faceMatrix:
     *
     * Würfelzentrum -> Marker
     */

    this.faceMatrices =
      [];


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      this.faceMatrices[i] =
        new THREE.Matrix4()
          .compose(

            this.faceData[i].position,

            this.faceData[i].quaternion,

            new THREE.Vector3(
              1,
              1,
              1
            )

          );

    }



    /*
     * Arbeitsobjekte
     */

    this.posePositions =
      [];


    this.poseQuaternions =
      [];


    this.tempInverse =
      new THREE.Matrix4();


    this.tempCubeMatrix =
      new THREE.Matrix4();


    this.targetPosition =
      new THREE.Vector3();


    this.targetQuaternion =
      new THREE.Quaternion();


    this.currentPosition =
      new THREE.Vector3();


    this.currentQuaternion =
      new THREE.Quaternion();


    this.havePose =
      false;


    /*
     * Zusätzliche sanfte Fusion.
     *
     * Keine starke Verzögerung – nur kleine
     * Übergänge zwischen Markern abfangen.
     */

    this.positionFollow =
      0.35;


    this.rotationFollow =
      0.35;



    /*
     * Marker-Ereignisse
     */

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      const marker =
        document.getElementById(
          "marker" + i
        );


      this.markers[i] =
        marker;


      marker.addEventListener(

        "markerFound",

        () => {

          this.detected[i] =
            true;


          this.lastSeen[i] =
            performance.now();

        }

      );


      marker.addEventListener(

        "markerLost",

        () => {

          this.detected[i] =
            false;

        }

      );

    }


    this.el.object3D.visible =
      false;

  },



  /* ======================================================
     Pose eines einzelnen Markers in eine Würfelpose
     umrechnen
     ====================================================== */

  getCubePoseFromMarker: function (
    markerIndex
  ) {

    const THREE =
      AFRAME.THREE;


    const marker =
      this.markers[
        markerIndex
      ];


    marker.object3D.updateMatrixWorld(
      true
    );


    /*
     * Würfel -> Marker invertieren:
     *
     * Marker -> Würfel
     */

    this.tempInverse
      .copy(
        this.faceMatrices[
          markerIndex
        ]
      )
      .invert();


    /*
     * Welt -> Marker
     * ×
     * Marker -> Würfel
     *
     * =
     *
     * Welt -> Würfel
     */

    this.tempCubeMatrix
      .multiplyMatrices(

        marker.object3D.matrixWorld,

        this.tempInverse

      );


    const position =
      new THREE.Vector3();


    const quaternion =
      new THREE.Quaternion();


    const scale =
      new THREE.Vector3();


    this.tempCubeMatrix.decompose(

      position,
      quaternion,
      scale

    );


    return {

      position: position,

      quaternion:
        quaternion.normalize()

    };

  },



  /* ======================================================
     Mehrere Quaternionen mitteln
     ====================================================== */

  averageQuaternions: function (
    quaternions
  ) {

    if (
      quaternions.length === 1
    ) {

      return quaternions[0].clone();

    }


    const result =
      quaternions[0].clone();


    for (
      let i = 1;
      i < quaternions.length;
      i++
    ) {

      const q =
        quaternions[i].clone();


      /*
       * Quaternion und -Quaternion sind dieselbe
       * räumliche Rotation.
       */

      if (
        result.dot(q) < 0
      ) {

        q.set(
          -q.x,
          -q.y,
          -q.z,
          -q.w
        );

      }


      result.slerp(

        q,

        1 / (i + 1)

      );

    }


    return result.normalize();

  },



  /* ======================================================
     FRAME
     ====================================================== */

  tick: function () {

    const now =
      performance.now();


    this.posePositions.length =
      0;


    this.poseQuaternions.length =
      0;



    /*
     * Alle aktuell brauchbaren Marker verwenden.
     */

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      /*
       * Bei markerFound aktualisieren wir lastSeen.
       *
       * Solange AR.js den Marker weiterhin als sichtbar
       * führt, erneuern wir den Zeitpunkt auch hier.
       */

      if (
        this.detected[i]
      ) {

        this.lastSeen[i] =
          now;

      }


      const age =
        now
        -
        this.lastSeen[i];


      if (
        age >
        this.holdTime
      ) {

        continue;

      }


      /*
       * Während des 250-ms-Holds besitzt der Marker
       * noch seine letzte gültige Pose.
       */

      const pose =
        this.getCubePoseFromMarker(
          i
        );


      this.posePositions.push(
        pose.position
      );


      this.poseQuaternions.push(
        pose.quaternion
      );

    }



    /*
     * Kein Marker verfügbar:
     *
     * Objekt nach Ablauf des Holds ausblenden.
     */

    if (
      this.posePositions.length === 0
    ) {

      this.el.object3D.visible =
        false;

      this.havePose =
        false;

      return;

    }



    /* ====================================================
       Position mitteln
       ==================================================== */

    this.targetPosition.set(
      0,
      0,
      0
    );


    for (
      const position of
      this.posePositions
    ) {

      this.targetPosition.add(
        position
      );

    }


    this.targetPosition.multiplyScalar(

      1 /
      this.posePositions.length

    );



    /* ====================================================
       Rotation mitteln
       ==================================================== */

    this.targetQuaternion.copy(

      this.averageQuaternions(
        this.poseQuaternions
      )

    );



    /* ====================================================
       Erste Pose sofort übernehmen
       ==================================================== */

    if (
      !this.havePose
    ) {

      this.currentPosition.copy(
        this.targetPosition
      );


      this.currentQuaternion.copy(
        this.targetQuaternion
      );


      this.havePose =
        true;

    }

    else {

      /*
       * Kleine Glättung gegen Restzittern und
       * harte Übergänge.
       */

      this.currentPosition.lerp(

        this.targetPosition,

        this.positionFollow

      );


      if (
        this.currentQuaternion.dot(
          this.targetQuaternion
        ) < 0
      ) {

        this.targetQuaternion.set(

          -this.targetQuaternion.x,
          -this.targetQuaternion.y,
          -this.targetQuaternion.z,
          -this.targetQuaternion.w

        );

      }


      this.currentQuaternion.slerp(

        this.targetQuaternion,

        this.rotationFollow

      );

    }



    /* ====================================================
       Gemeinsame Würfelpose setzen
       ==================================================== */

    this.el.object3D.position.copy(
      this.currentPosition
    );


    this.el.object3D.quaternion.copy(
      this.currentQuaternion
    );


    this.el.object3D.scale.set(
      1,
      1,
      1
    );


    this.el.object3D.visible =
      true;

  }

});



/* ==========================================================
   HAUPTPROGRAMM
   ========================================================== */

const sceneHost =
  document.getElementById(
    "sceneHost"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const rotateIcon =
  document.getElementById(
    "rotateIcon"
  );


const startTitle =
  document.getElementById(
    "startTitle"
  );


const startText =
  document.getElementById(
    "startText"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


let arStarted =
  false;


let cameraOptimized =
  false;



function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}



function isLandscape() {

  return (

    window.innerWidth
    >
    window.innerHeight

  );

}



function updateStartScreen() {

  if (
    !isMobileDevice()
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (
    arStarted
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (
    !isLandscape()
  ) {

    rotateIcon.style.display =
      "block";


    startTitle.textContent =
      "Bitte Smartphone drehen";


    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";


    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";


    startTitle.textContent =
      "GeoChemAR";


    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";


    startButton.style.display =
      "block";

  }

}



/* ==========================================================
   AR-SZENE
   ========================================================== */

function createARScene() {

  if (
    arStarted
  ) {

    return;

  }


  arStarted =
    true;


  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
      "

    >


      <!-- ============================================
           SECHS WÜRFELMARKER
           ============================================ -->

      <a-marker
        id="marker0"
        type="barcode"
        value="0"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker1"
        type="barcode"
        value="1"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker2"
        type="barcode"
        value="2"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker3"
        type="barcode"
        value="3"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker4"
        type="barcode"
        value="4"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker5"
        type="barcode"
        value="5"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>



      <!-- ============================================
           EIN gemeinsames virtuelles Würfelzentrum
           ============================================ -->

      <a-entity
        id="cubeRoot"
        cube-fusion
      >


        <!-- ==========================================
             EIN Methanmolekül

             Position 0 0 0:
             Mittelpunkt des Moleküls =
             Mittelpunkt des Würfels.

             molecule-spin ist eine EIGENE Rotation.
             ========================================== -->

        <a-entity

          id="methane"

          position="0 0 0"

          methane-model

          molecule-spin="
            speedY: 18;
            speedX: 7;
          "

        >
        </a-entity>


      </a-entity>



      <!-- ============================================
           BELEUCHTUNG
           ============================================ -->

      <a-entity

        light="
          type: ambient;
          intensity: 1.0;
          color: #ffffff;
        "

      >
      </a-entity>


      <a-entity

        light="
          type: directional;
          intensity: 0.8;
          color: #ffffff;
        "

        position="1 2 1"

      >
      </a-entity>



      <a-entity camera></a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );

}



/* ==========================================================
   MOBILER START
   ========================================================== */

async function startMobileAR() {

  if (
    !isLandscape()
  ) {

    updateStartScreen();

    return;

  }


  try {

    const element =
      document.documentElement;


    if (
      element.requestFullscreen
    ) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }


  try {

    if (
      screen.orientation
      &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }


  setTimeout(
    createARScene,
    400
  );

}



/* ==========================================================
   AR-VIDEO
   ========================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ==========================================================
   EBENEN
   ========================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );


  const scene =
    document.getElementById(
      "arScene"
    );


  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (host) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }


  if (scene) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );

    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }


  if (video) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.muted =
      true;

  }


  if (canvas) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );

    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ==========================================================
   VIDEO UND CANVAS SYNCHRONISIEREN
   ========================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (
    !video
    ||
    !canvas
  ) {

    return;

  }


  const rect =
    video.getBoundingClientRect();


  if (
    rect.width <= 0
    ||
    rect.height <= 0
  ) {

    return;

  }


  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );


  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );


  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );


  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );


  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );


  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}



/* ==========================================================
   SMARTPHONE-KAMERA
   ========================================================== */

async function optimizeMobileCamera() {

  if (
    cameraOptimized
    ||
    !arStarted
  ) {

    return;

  }


  if (
    !isMobileDevice()
  ) {

    cameraOptimized =
      true;

    return;

  }


  const video =
    getARVideo();


  if (
    !video
    ||
    !video.srcObject
  ) {

    return;

  }


  const tracks =
    video.srcObject.getVideoTracks();


  if (
    !tracks.length
  ) {

    return;

  }


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }


  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        const desiredZoom =

          Math.max(

            capabilities.zoom.min,

            Math.min(
              1,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized =
    true;

}



/* ==========================================================
   ORIENTIERUNGSWECHSEL
   ========================================================== */

function orientationChanged() {

  if (
    !arStarted
  ) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (
    !isMobileDevice()
  ) {

    return;

  }


  if (
    !isLandscape()
  ) {

    const video =
      getARVideo();


    if (
      video
      &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    location.reload();

  }

}



/* ==========================================================
   EVENTS
   ========================================================== */

startButton.addEventListener(
  "click",
  startMobileAR
);


window.addEventListener(

  "orientationchange",

  function () {

    setTimeout(
      orientationChanged,
      250
    );

  }

);


window.addEventListener(

  "resize",

  function () {

    if (
      !arStarted
    ) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);



/* ==========================================================
   START
   ========================================================== */

if (
  isMobileDevice()
) {

  updateStartScreen();

}

else {

  createARScene();

}



/* ==========================================================
   LAUFENDE PFLEGE
   ========================================================== */

setInterval(

  function () {

    if (
      !arStarted
    ) {

      return;

    }


    enforceLayers();

    optimizeMobileCamera();

    synchronizeVisualGeometry();

  },

  250

);


</script>
