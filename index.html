<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #status {
      position: fixed;
      top: max(6px, env(safe-area-inset-top));
      left: max(6px, env(safe-area-inset-left));
      right: max(6px, env(safe-area-inset-right));

      z-index: 100000;

      padding: 6px 8px;
      box-sizing: border-box;

      background: rgba(0, 0, 0, 0.72);
      color: white;

      font-size: 10px;
      line-height: 1.25;

      border-radius: 6px;
      pointer-events: none;
    }

    #rotateMessage {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 200000;

      background: #111;
      color: white;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;
      box-sizing: border-box;
    }

    #rotateMessage strong {
      display: block;
      font-size: 22px;
      margin-bottom: 8px;
    }

    @media (orientation: portrait) {
      #rotateMessage {
        display: flex;
      }

      #status {
        display: none;
      }
    }
  </style>
</head>

<body>

<div id="rotateMessage">
  <div>
    <strong>Bitte Smartphone drehen</strong>
    GeoChemAR wird im Querformat verwendet.
  </div>
</div>

<div id="status">
  GeoChemAR startet …
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"

  renderer="
    antialias: true;
    alpha: true;
  "

  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
    detectionMode: mono;
  "
>

  <a-marker
    preset="hiro"
    smooth="true"
    smoothCount="5"
    smoothTolerance="0.01"
    smoothThreshold="2"
  >

    <a-box
      position="0 0.3 0"

      width="0.6"
      height="0.6"
      depth="0.6"

      material="
        color: #2563eb;
        opacity: 0.8;
        transparent: true;
      "
    ></a-box>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>


<script>

const status = document.getElementById("status");


function fixMobileLayout() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  const canvas =
    document.querySelector("canvas.a-canvas");

  if (video) {

    video.setAttribute("playsinline", "");
    video.muted = true;
    video.autoplay = true;

    video.style.position = "fixed";
    video.style.top = "0";
    video.style.left = "0";

    video.style.width = "100vw";
    video.style.height = "100vh";

    /*
      Wichtig:
      contain statt cover.

      Dadurch wird das Kamerabild NICHT
      in eine Richtung gedehnt.
    */
    video.style.objectFit = "contain";

    video.style.margin = "0";
    video.style.transform = "none";

    video.style.zIndex = "1";
  }


  if (canvas) {

    canvas.style.position = "fixed";
    canvas.style.top = "0";
    canvas.style.left = "0";

    canvas.style.width = "100vw";
    canvas.style.height = "100vh";

    canvas.style.zIndex = "2";
  }

}


function updateStatus() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  let text =
    "Display: " +
    window.innerWidth +
    "×" +
    window.innerHeight;

  text +=
    window.innerWidth > window.innerHeight
      ? " | Querformat"
      : " | Hochformat";

  if (video) {

    text +=
      " | Kamera: " +
      video.videoWidth +
      "×" +
      video.videoHeight;

    text +=
      " | ready: " +
      video.readyState;

  } else {

    text += " | Kamera: nicht gefunden";
  }

  status.textContent = text;
}


setInterval(function () {

  fixMobileLayout();
  updateStatus();

}, 500);


window.addEventListener(
  "resize",
  function () {

    setTimeout(fixMobileLayout, 200);
    setTimeout(fixMobileLayout, 500);

  }
);


window.addEventListener(
  "orientationchange",
  function () {

    setTimeout(fixMobileLayout, 300);
    setTimeout(fixMobileLayout, 800);

  }
);

</script>

</body>
</html>
