<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>GeoChemAR – Kameramodell-Test</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
  z-index: 1;
}

#threeCanvas {
  position: fixed;
  z-index: 2;
  pointer-events: none;
}

#overlay {
  position: fixed;
  z-index: 3;
  pointer-events: none;
}

#analysisCanvas {
  display: none;
}

#status {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;

  padding: 10px 14px;
  border-radius: 8px;

  background: rgba(0,0,0,0.82);
  color: white;

  font-size: 14px;
  line-height: 1.45;
  white-space: pre-line;

  pointer-events: none;
}

#error {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 20;

  padding: 10px;
  border-radius: 8px;

  background: rgba(160,0,0,0.92);
  color: white;

  font-size: 13px;
  white-space: pre-wrap;

  display: none;
}

</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<canvas
  id="analysisCanvas"
  width="640"
  height="480"
></canvas>

<canvas
  id="overlay"
  width="640"
  height="480"
></canvas>

<div id="status">
Initialisierung …
</div>

<div id="error"></div>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";

import * as Comlink
  from "https://unpkg.com/comlink/dist/esm/comlink.mjs";


/* =====================================================
   KONSTANTEN
   ===================================================== */

const WIDTH = 640;
const HEIGHT = 480;

const TAG_ID = 0;
const TAG_SIZE = 0.040;


/* =====================================================
   DOM
   ===================================================== */

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById("analysisCanvas");

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const overlay =
  document.getElementById("overlay");

const overlayCtx =
  overlay.getContext("2d");

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


/* =====================================================
   FEHLER
   ===================================================== */

function showError(error) {

  console.error(error);

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error?.stack ||
      String(error)
    );

}


/* =====================================================
   GEMEINSAMES KAMERAMODELL

   Wir behalten vorerst die Annahme:

   horizontaler Bildwinkel = 60°

   Daraus bestimmen wir fx.

   WICHTIG:
   Three.js bekommt NICHT ebenfalls 60°,
   sondern den aus fy berechneten
   VERTIKALEN Bildwinkel.
   ===================================================== */

const cx =
  WIDTH / 2;

const cy =
  HEIGHT / 2;


const horizontalFovDeg =
  60;


const horizontalFovRad =
  THREE.MathUtils.degToRad(
    horizontalFovDeg
  );


const fx =
  (WIDTH / 2) /
  Math.tan(
    horizontalFovRad / 2
  );


/*
 * Für unseren vorläufigen Kameratest
 * setzen wir fy = fx.
 */

const fy =
  fx;


/*
 * Aus fy berechnen wir jetzt den
 * VERTIKALEN Bildwinkel für Three.js.
 */

const verticalFovRad =
  2 *
  Math.atan(
    HEIGHT /
    (2 * fy)
  );


const verticalFovDeg =
  THREE.MathUtils.radToDeg(
    verticalFovRad
  );


/* =====================================================
   THREE.JS

   Jetzt exakt dasselbe Lochkameramodell
   wie bei AprilTag.
   ===================================================== */

const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(
    verticalFovDeg,
    WIDTH / HEIGHT,
    0.01,
    10
  );


camera.position.set(
  0,
  0,
  0
);


camera.lookAt(
  0,
  0,
  -1
);


const renderer =
  new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });


renderer.domElement.id =
  "threeCanvas";


renderer.setClearColor(
  0x000000,
  0
);


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);


document.body.appendChild(
  renderer.domElement
);


/* =====================================================
   ROTE 3D-KUGEL
   ===================================================== */

const sphere =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      0.010,
      32,
      24
    ),

    new THREE.MeshBasicMaterial({
      color: 0xff0000
    })

  );


sphere.visible =
  false;


scene.add(
  sphere
);


/* =====================================================
   APRILTAG
   ===================================================== */

let apriltag =
  null;

let detectorReady =
  false;

let cameraReady =
  false;

let detectionRunning =
  false;

let latestDetection =
  null;

let tagDetected =
  false;

let poseReceived =
  false;

let lastTx =
  0;

let lastTy =
  0;

let lastTz =
  0;

let detectionCounter =
  0;

let detectionFPS =
  0;

let fpsStart =
  performance.now();


async function initializeAprilTag() {

  const worker =
    new Worker(
      "./libs/apriltag.js"
    );


  const Apriltag =
    Comlink.wrap(worker);


  apriltag =
    await new Apriltag(

      Comlink.proxy(
        function() {

          detectorReady =
            true;

        }
      )

    );


  const start =
    performance.now();


  while (!detectorReady) {

    await new Promise(
      resolve =>
        setTimeout(resolve, 20)
    );


    if (
      performance.now() - start >
      15000
    ) {

      throw new Error(
        "AprilTag-WASM wurde nicht bereit."
      );

    }

  }


  /*
   * EXAKT dieselben Intrinsics,
   * aus denen auch die Three.js-Kamera
   * abgeleitet wurde.
   */

  await apriltag.set_camera_info(
    fx,
    fy,
    cx,
    cy
  );


  await apriltag.set_tag_size(
    TAG_ID,
    TAG_SIZE
  );


  await apriltag.set_return_pose(
    1
  );


  await apriltag.set_return_solutions(
    1
  );


  await apriltag.set_max_detections(
    1
  );

}


/* =====================================================
   WEBCAM
   ===================================================== */

async function startCamera() {

  const stream =
    await navigator.mediaDevices
      .getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: WIDTH
          },

          height: {
            ideal: HEIGHT
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        }

      });


  video.srcObject =
    stream;


  await new Promise(
    resolve => {

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        resolve();

      }

      else {

        video.addEventListener(
          "loadedmetadata",
          resolve,
          {
            once: true
          }
        );

      }

    }
  );


  await video.play();

  cameraReady =
    true;

}


/* =====================================================
   GRAUSTUFEN
   ===================================================== */

function createGrayscaleImage() {

  analysisCtx.drawImage(
    video,
    0,
    0,
    WIDTH,
    HEIGHT
  );


  const imageData =
    analysisCtx.getImageData(
      0,
      0,
      WIDTH,
      HEIGHT
    );


  const rgba =
    imageData.data;


  const grayscale =
    new Uint8Array(
      WIDTH * HEIGHT
    );


  for (
    let i = 0, j = 0;
    i < rgba.length;
    i += 4, j++
  ) {

    grayscale[j] =
      Math.round(
        (
          rgba[i] +
          rgba[i + 1] +
          rgba[i + 2]
        ) / 3
      );

  }


  return grayscale;

}


/* =====================================================
   3D-TRANSLATION
   ===================================================== */

function applyTranslation(pose) {

  poseReceived =
    false;


  sphere.visible =
    false;


  if (
    !pose ||
    !pose.t ||
    pose.t.length < 3
  ) {

    return;

  }


  const tx =
    Number(pose.t[0]);

  const ty =
    Number(pose.t[1]);

  const tz =
    Number(pose.t[2]);


  if (
    !Number.isFinite(tx) ||
    !Number.isFinite(ty) ||
    !Number.isFinite(tz)
  ) {

    return;

  }


  lastTx =
    tx;

  lastTy =
    ty;

  lastTz =
    tz;


  /*
   * AprilTag:
   *
   * +X rechts
   * +Y unten
   * +Z vor Kamera
   *
   * Three.js:
   *
   * +X rechts
   * +Y oben
   * -Z vor Kamera
   */

  sphere.position.set(
    tx,
    -ty,
    -tz
  );


  sphere.visible =
    true;


  poseReceived =
    true;

}


/* =====================================================
   DETEKTION
   ===================================================== */

async function detectFrame() {

  if (
    !detectorReady ||
    !cameraReady ||
    detectionRunning
  ) {

    return;

  }


  detectionRunning =
    true;


  try {

    const grayscale =
      createGrayscaleImage();


    const result =
      await apriltag.detect(
        grayscale,
        WIDTH,
        HEIGHT
      );


    const detection =
      Array.isArray(result)

        ? result.find(
            d =>
              Number(d.id) === TAG_ID
          )

        : null;


    latestDetection =
      detection || null;


    if (detection) {

      tagDetected =
        true;


      applyTranslation(
        detection.pose
      );

    }

    else {

      tagDetected =
        false;

      poseReceived =
        false;

      sphere.visible =
        false;

    }


    detectionCounter++;


    const now =
      performance.now();


    if (
      now - fpsStart >=
      1000
    ) {

      const seconds =
        (now - fpsStart) / 1000;


      detectionFPS =
        detectionCounter /
        seconds;


      detectionCounter =
        0;


      fpsStart =
        now;

    }

  }

  catch(error) {

    showError(error);

  }

  finally {

    detectionRunning =
      false;

  }

}


/* =====================================================
   GRÜNER 2D-PUNKT
   ===================================================== */

function drawOverlay() {

  overlayCtx.clearRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  if (
    !latestDetection ||
    !latestDetection.center
  ) {

    return;

  }


  /*
   * Wrapper können center entweder als
   * {x,y} oder als [x,y] liefern.
   *
   * Unsere bisherige Version funktionierte;
   * wir unterstützen hier sicherheitshalber
   * beide Formen.
   */

  let x;
  let y;


  if (
    Array.isArray(
      latestDetection.center
    )
  ) {

    x =
      Number(
        latestDetection.center[0]
      );

    y =
      Number(
        latestDetection.center[1]
      );

  }

  else {

    x =
      Number(
        latestDetection.center.x
      );

    y =
      Number(
        latestDetection.center.y
      );

  }


  if (
    !Number.isFinite(x) ||
    !Number.isFinite(y)
  ) {

    return;

  }


  overlayCtx.beginPath();


  overlayCtx.arc(
    x,
    y,
    12,
    0,
    Math.PI * 2
  );


  overlayCtx.lineWidth =
    5;


  overlayCtx.strokeStyle =
    "#00ff00";


  overlayCtx.stroke();


  overlayCtx.beginPath();


  overlayCtx.moveTo(
    x - 18,
    y
  );


  overlayCtx.lineTo(
    x + 18,
    y
  );


  overlayCtx.moveTo(
    x,
    y - 18
  );


  overlayCtx.lineTo(
    x,
    y + 18
  );


  overlayCtx.lineWidth =
    3;


  overlayCtx.strokeStyle =
    "#00ff00";


  overlayCtx.stroke();

}


/* =====================================================
   VIDEO / CANVASES
   ===================================================== */

function resize() {

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  const videoAspect =
    WIDTH / HEIGHT;

  const screenAspect =
    screenWidth /
    screenHeight;


  let displayWidth;
  let displayHeight;


  if (
    screenAspect >
    videoAspect
  ) {

    displayHeight =
      screenHeight;

    displayWidth =
      displayHeight *
      videoAspect;

  }

  else {

    displayWidth =
      screenWidth;

    displayHeight =
      displayWidth /
      videoAspect;

  }


  const left =
    (
      screenWidth -
      displayWidth
    ) / 2;


  const top =
    (
      screenHeight -
      displayHeight
    ) / 2;


  renderer.setSize(
    displayWidth,
    displayHeight,
    false
  );


  renderer.domElement.style.width =
    displayWidth + "px";

  renderer.domElement.style.height =
    displayHeight + "px";

  renderer.domElement.style.left =
    left + "px";

  renderer.domElement.style.top =
    top + "px";


  overlay.style.width =
    displayWidth + "px";

  overlay.style.height =
    displayHeight + "px";

  overlay.style.left =
    left + "px";

  overlay.style.top =
    top + "px";


  /*
   * Das Bild bleibt 4:3.
   *
   * Wir ändern hier deshalb NICHT mehr
   * eigenständig den FOV.
   */

  camera.aspect =
    WIDTH / HEIGHT;


  camera.updateProjectionMatrix();

}


window.addEventListener(
  "resize",
  resize
);


resize();


/* =====================================================
   LOOP
   ===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  if (!detectionRunning) {

    detectFrame();

  }


  drawOverlay();


  renderer.render(
    scene,
    camera
  );


  status.textContent =

    "APRILTAG 5b-6\n\n" +

    "GRÜN = 2D-Zentrum\n" +

    "ROT = 3D-Translation\n\n" +

    "Tag 0: " +
    (
      tagDetected
        ? "ERKANNT"
        : "nicht erkannt"
    ) +

    "\nPose: " +
    (
      poseReceived
        ? "JA"
        : "NEIN"
    ) +

    "\nErkennungen/s: " +
    detectionFPS.toFixed(1) +

    "\n\nfx = " +
    fx.toFixed(1) +

    "\nfy = " +
    fy.toFixed(1) +

    "\nThree.js FOV vertikal = " +
    verticalFovDeg.toFixed(2) +
    "°";

}


/* =====================================================
   START
   ===================================================== */

async function start() {

  try {

    await initializeAprilTag();


    status.textContent =
      "Kamera wird gestartet …";


    await startCamera();


    requestAnimationFrame(
      animate
    );

  }

  catch(error) {

    showError(error);

  }

}


start();

</script>

</body>
</html>
