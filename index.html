<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GeoChemAR – Three.js Test</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;

      padding: 10px 14px;
      border-radius: 8px;

      background: rgba(0,0,0,0.75);
      color: white;

      font-size: 14px;
      line-height: 1.4;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 9999;

      padding: 10px;

      background: rgba(150,0,0,0.9);
      color: white;

      font-size: 13px;
      white-space: pre-wrap;

      display: none;
    }
  </style>
</head>

<body>

<div id="status">
  1 – HTML geladen
</div>

<div id="error"></div>


<script>

  /*
   * Auch JavaScript-Fehler, die außerhalb unseres
   * try/catch auftreten, sichtbar machen.
   */

  window.addEventListener(
    "error",
    function(event) {

      const box =
        document.getElementById("error");

      box.style.display = "block";

      box.textContent =
        "JavaScript-Fehler:\n"
        + event.message
        + "\n"
        + event.filename
        + "\nZeile "
        + event.lineno;

    }
  );


  window.addEventListener(
    "unhandledrejection",
    function(event) {

      const box =
        document.getElementById("error");

      box.style.display = "block";

      box.textContent =
        "Promise-Fehler:\n"
        + String(event.reason);

    }
  );

</script>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js",
    "threex": "./libs/ar-threex.mjs"
  }
}
</script>


<script type="module">

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


function setStatus(text) {

  status.textContent = text;

}


function showError(error) {

  console.error(error);

  errorBox.style.display = "block";

  errorBox.textContent =
    "FEHLER:\n"
    +
    (
      error &&
      error.stack

      ? error.stack

      : String(error)
    );

}


try {

  /* ========================================================
     MODULE LADEN
     ======================================================== */

  setStatus(
    "2 – Module werden geladen …"
  );


  const THREE =
    await import("three");


  setStatus(
    "3 – Three.js geladen"
  );


  const THREEX =
    await import("threex");


  setStatus(
    "4 – AR.js geladen"
  );


  const {
    ArToolkitSource,
    ArToolkitContext,
    ArMarkerControls
  } = THREEX;


  /* ========================================================
     THREE.JS
     ======================================================== */

  const scene =
    new THREE.Scene();


  const camera =
    new THREE.Camera();


  scene.add(
    camera
  );


  const renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });


  renderer.setClearColor(
    0x000000,
    0
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.domElement.style.position =
    "absolute";

  renderer.domElement.style.top =
    "0px";

  renderer.domElement.style.left =
    "0px";

  renderer.domElement.style.zIndex =
    "2";


  document.body.appendChild(
    renderer.domElement
  );


  /* ========================================================
     MARKER ROOT
     ======================================================== */

  const markerRoot =
    new THREE.Group();


  markerRoot.visible =
    false;


  scene.add(
    markerRoot
  );


  /* ========================================================
     TESTWÜRFEL

     Bewusst sehr simpel und auffällig.
     ======================================================== */

  const geometry =
    new THREE.BoxGeometry(
      0.6,
      0.6,
      0.6
    );


  const material =
    new THREE.MeshNormalMaterial();


  const cube =
    new THREE.Mesh(
      geometry,
      material
    );


  /*
   * Der Würfel steht etwas oberhalb
   * der Markerfläche.
   */

  cube.position.y =
    0.3;


  markerRoot.add(
    cube
  );


  /* ========================================================
     AR.JS KAMERA
     ======================================================== */

  setStatus(
    "5 – Kamera wird vorbereitet …"
  );


  const arToolkitSource =
    new ArToolkitSource({

      sourceType:
        "webcam",

      sourceWidth:
        640,

      sourceHeight:
        480,

      displayWidth:
        640,

      displayHeight:
        480

    });


  /* ========================================================
     ARTOOLKIT CONTEXT
     ======================================================== */

  const arToolkitContext =
    new ArToolkitContext({

      cameraParametersUrl:
        "https://raw.githack.com/AR-js-org/AR.js/3.4.8/data/data/camera_para.dat",

      detectionMode:
        "mono_and_matrix",

      matrixCodeType:
        "3x3_HAMMING63",

      maxDetectionRate:
        30,

      canvasWidth:
        640,

      canvasHeight:
        480

    });


  /* ========================================================
     RESIZE
     ======================================================== */

  function onResize() {

    arToolkitSource.onResizeElement();


    arToolkitSource.copyElementSizeTo(
      renderer.domElement
    );


    if (
      arToolkitContext.arController
    ) {

      arToolkitSource.copyElementSizeTo(

        arToolkitContext
          .arController
          .canvas

      );

    }

  }


  window.addEventListener(
    "resize",
    onResize
  );


  /* ========================================================
     ARTOOLKIT INITIALISIEREN
     ======================================================== */

  setStatus(
    "6 – ARToolKit wird initialisiert …"
  );


  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitContext.init(

          function() {

            try {

              camera
                .projectionMatrix
                .copy(

                  arToolkitContext
                    .getProjectionMatrix()

                );


              resolve();

            }

            catch(error) {

              reject(error);

            }

          }

        );

      }

      catch(error) {

        reject(error);

      }

    }
  );


  setStatus(
    "7 – ARToolKit bereit"
  );


  /* ========================================================
     BARCODE-MARKER 1
     ======================================================== */

  const markerControls =
    new ArMarkerControls(

      arToolkitContext,

      markerRoot,

      {

        type:
          "barcode",

        barcodeValue:
          1,

        size:
          1,

        changeMatrixMode:
          "modelViewMatrix"

      }

    );


  /* ========================================================
     KAMERA STARTEN
     ======================================================== */

  setStatus(
    "8 – Kamerazugriff …"
  );


  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitSource.init(

          function() {

            setTimeout(
              onResize,
              200
            );

            resolve();

          }

        );

      }

      catch(error) {

        reject(error);

      }

    }
  );


  setStatus(
    "9 – Kamera läuft – Marker 1 zeigen"
  );


  /* ========================================================
     RENDER LOOP
     ======================================================== */

  let previousVisible =
    false;


  function animate() {

    requestAnimationFrame(
      animate
    );


    if (
      arToolkitSource.ready
    ) {

      arToolkitContext.update(
        arToolkitSource.domElement
      );

    }


    if (
      markerRoot.visible
      !==
      previousVisible
    ) {

      previousVisible =
        markerRoot.visible;


      if (
        markerRoot.visible
      ) {

        setStatus(
          "10 – Marker 1 erkannt"
        );

      }

      else {

        setStatus(
          "9 – Kamera läuft – Marker 1 zeigen"
        );

      }

    }


    renderer.render(
      scene,
      camera
    );

  }


  animate();

}

catch(error) {

  showError(error);

}

</script>

</body>
</html>
