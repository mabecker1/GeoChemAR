<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Phase 4f-1</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #arContainer {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #arContainer video {
      position: absolute !important;
      z-index: 1 !important;
    }

    #arContainer canvas {
      position: absolute !important;
      z-index: 2 !important;
      pointer-events: none;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      font-size: 14px;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 30px;
      box-sizing: border-box;

      background: #111;
      color: white;
      text-align: center;
    }

    #startScreen.visible {
      display: flex;
    }

    #startContent {
      max-width: 420px;
    }

    #startTitle {
      margin-bottom: 12px;
      font-size: 23px;
      font-weight: bold;
    }

    #startText {
      margin-bottom: 22px;
      font-size: 15px;
      line-height: 1.45;
    }

    #startButton {
      display: none;
      margin: auto;

      padding: 13px 25px;

      border: 0;
      border-radius: 8px;

      background: white;
      color: #111;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="arContainer"></div>

<div id="status">
  Phase 4f-1 – Initialisierung …
</div>

<div id="startScreen">

  <div id="startContent">

    <div id="startTitle">
      Bitte Smartphone drehen
    </div>

    <div id="startText">
      GeoChemAR wird im Querformat verwendet.
    </div>

    <button id="startButton">
      AR starten
    </button>

  </div>

</div>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js",
    "threex": "./libs/ar-threex.mjs"
  }
}
</script>


<script type="module">

import * as THREE from "three";

import {
  ArToolkitSource,
  ArToolkitContext,
  ArMarkerControls
} from "threex";


/* ==========================================================
   GRUNDLAGEN
   ========================================================== */

const container =
  document.getElementById("arContainer");

const status =
  document.getElementById("status");

const startScreen =
  document.getElementById("startScreen");

const startTitle =
  document.getElementById("startTitle");

const startText =
  document.getElementById("startText");

const startButton =
  document.getElementById("startButton");


let started = false;


/* ==========================================================
   GERÄT ERKENNEN
   ========================================================== */

function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}


function isLandscape() {

  return (
    window.innerWidth >
    window.innerHeight
  );

}


/* ==========================================================
   THREE.JS
   ========================================================== */

const scene =
  new THREE.Scene();


const camera =
  new THREE.Camera();

scene.add(camera);


const renderer =
  new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });

renderer.setClearColor(
  new THREE.Color("lightgrey"),
  0
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.domElement.style.position =
  "absolute";

renderer.domElement.style.top =
  "0px";

renderer.domElement.style.left =
  "0px";

container.appendChild(
  renderer.domElement
);


/* ==========================================================
   LICHT
   ========================================================== */

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    1.0
  );

scene.add(
  ambientLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.8
  );

directionalLight.position.set(
  1,
  2,
  1
);

scene.add(
  directionalLight
);


/* ==========================================================
   MARKER ROOT

   Alles, was hier hineinkommt, folgt Marker 1.
   ========================================================== */

const markerRoot =
  new THREE.Group();

scene.add(
  markerRoot
);


/* ==========================================================
   METHAN
   ========================================================== */

function createMethane() {

  const group =
    new THREE.Group();


  const carbonRadius = 0.22;
  const hydrogenRadius = 0.14;
  const hydrogenDistance = 0.72;
  const bondRadius = 0.040;


  const carbonMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x202020,
      roughness: 0.55,
      metalness: 0
    });


  const hydrogenMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.45,
      metalness: 0
    });


  const bondMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xb8bec7,
      roughness: 0.50,
      metalness: 0
    });


  const carbon =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        carbonRadius,
        48,
        32
      ),

      carbonMaterial

    );


  group.add(
    carbon
  );


  const hydrogenGeometry =
    new THREE.SphereGeometry(
      hydrogenRadius,
      40,
      28
    );


  const directions = [

    new THREE.Vector3(
      1,
      1,
      1
    ),

    new THREE.Vector3(
      1,
      -1,
      -1
    ),

    new THREE.Vector3(
      -1,
      1,
      -1
    ),

    new THREE.Vector3(
      -1,
      -1,
      1
    )

  ];


  directions.forEach(
    direction =>
      direction.normalize()
  );


  const yAxis =
    new THREE.Vector3(
      0,
      1,
      0
    );


  directions.forEach(
    function(direction) {

      const hydrogen =
        new THREE.Mesh(

          hydrogenGeometry,

          hydrogenMaterial

        );


      hydrogen.position.copy(

        direction
          .clone()
          .multiplyScalar(
            hydrogenDistance
          )

      );


      group.add(
        hydrogen
      );


      const startDistance =
        carbonRadius;


      const endDistance =
        hydrogenDistance
        -
        hydrogenRadius;


      const startPoint =
        direction
          .clone()
          .multiplyScalar(
            startDistance
          );


      const endPoint =
        direction
          .clone()
          .multiplyScalar(
            endDistance
          );


      const bondVector =
        endPoint
          .clone()
          .sub(
            startPoint
          );


      const bondLength =
        bondVector.length();


      const bondGeometry =
        new THREE.CylinderGeometry(

          bondRadius,
          bondRadius,
          bondLength,
          32,
          1,
          false

        );


      const bond =
        new THREE.Mesh(

          bondGeometry,

          bondMaterial

        );


      bond.position.copy(

        startPoint
          .clone()
          .add(
            endPoint
          )
          .multiplyScalar(
            0.5
          )

      );


      bond.quaternion.setFromUnitVectors(

        yAxis,

        direction

      );


      group.add(
        bond
      );

    }
  );


  return group;

}


const methane =
  createMethane();


/*
   Markerfläche liegt in X/Z.

   Y zeigt aus dem Marker heraus.

   Das Molekül sitzt deshalb etwas
   oberhalb von Marker 1.
*/

methane.position.set(
  0,
  0.55,
  0
);


markerRoot.add(
  methane
);


/* ==========================================================
   AR.JS
   ========================================================== */

let arToolkitSource = null;
let arToolkitContext = null;
let markerControls = null;


/* ==========================================================
   GRÖSSENANPASSUNG
   ========================================================== */

function onResize() {

  if (
    !arToolkitSource
  ) {
    return;
  }


  arToolkitSource.onResizeElement();


  arToolkitSource.copyElementSizeTo(
    renderer.domElement
  );


  if (
    arToolkitContext
    &&
    arToolkitContext.arController
  ) {

    arToolkitSource.copyElementSizeTo(

      arToolkitContext
        .arController
        .canvas

    );

  }

}


window.addEventListener(
  "resize",
  onResize
);


/* ==========================================================
   AR STARTEN
   ========================================================== */

function startAR() {

  if (
    started
  ) {
    return;
  }


  started = true;


  status.textContent =
    "Kamera wird gestartet …";


  arToolkitSource =
    new ArToolkitSource({

      sourceType: "webcam",

      sourceWidth: 640,

      sourceHeight: 480,

      displayWidth: 640,

      displayHeight: 480

    });


  arToolkitSource.init(

    function onReady() {

      setTimeout(
        onResize,
        200
      );


      optimizeCamera();


      status.textContent =
        "Kamera bereit – Marker 1 zeigen";

    }

  );


  arToolkitContext =
    new ArToolkitContext({

      cameraParametersUrl:
        "https://raw.githack.com/AR-js-org/AR.js/3.4.8/data/data/camera_para.dat",

      detectionMode:
        "mono_and_matrix",

      matrixCodeType:
        "3x3_HAMMING63",

      maxDetectionRate:
        30,

      canvasWidth:
        640,

      canvasHeight:
        480

    });


  arToolkitContext.init(

    function onCompleted() {

      camera.projectionMatrix.copy(

        arToolkitContext
          .getProjectionMatrix()

      );

    }

  );


  markerControls =
    new ArMarkerControls(

      arToolkitContext,

      markerRoot,

      {

        type:
          "barcode",

        barcodeValue:
          1,

        size:
          1,

        changeMatrixMode:
          "modelViewMatrix"

      }

    );


  startScreen.classList.remove(
    "visible"
  );


  requestAnimationFrame(
    animate
  );

}


/* ==========================================================
   MOBILE KAMERA

   Bewährte 640 × 480 / 30 fps.
   ========================================================== */

async function optimizeCamera() {

  if (
    !isMobileDevice()
  ) {
    return;
  }


  const video =
    arToolkitSource
      ? arToolkitSource.domElement
      : null;


  if (
    !video
    ||
    !video.srcObject
  ) {
    return;
  }


  const tracks =
    video
      .srcObject
      .getVideoTracks();


  if (
    tracks.length === 0
  ) {
    return;
  }


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 640
      },

      height: {
        ideal: 480
      },

      aspectRatio: {
        ideal: 4 / 3
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "Kamera-Constraints nicht übernommen:",
      error
    );

  }

}


/* ==========================================================
   UPDATE
   ========================================================== */

function updateAR() {

  if (
    !arToolkitSource
    ||
    !arToolkitSource.ready
  ) {
    return;
  }


  arToolkitContext.update(

    arToolkitSource.domElement

  );


  scene.visible =
    camera.visible;

}


/* ==========================================================
   RENDER LOOP
   ========================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  updateAR();


  if (
    markerRoot.visible
  ) {

    status.textContent =
      "Marker 1 erkannt";

  }

  else {

    status.textContent =
      "Marker 1 suchen …";

  }


  renderer.render(
    scene,
    camera
  );

}


/* ==========================================================
   SMARTPHONE STARTBILDSCHIRM
   ========================================================== */

function updateStartScreen() {

  if (
    !isMobileDevice()
  ) {

    startScreen.classList.remove(
      "visible"
    );

    startAR();

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (
    !isLandscape()
  ) {

    startTitle.textContent =
      "Bitte Smartphone drehen";


    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";


    startButton.style.display =
      "none";

  }

  else {

    startTitle.textContent =
      "GeoChemAR";


    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";


    startButton.style.display =
      "block";

  }

}


/* ==========================================================
   STARTBUTTON
   ========================================================== */

startButton.addEventListener(

  "click",

  async function() {

    try {

      if (
        document.documentElement
          .requestFullscreen
      ) {

        await document
          .documentElement
          .requestFullscreen();

      }

    }

    catch (error) {

      console.log(
        "Vollbild nicht verfügbar."
      );

    }


    try {

      if (
        screen.orientation
        &&
        screen.orientation.lock
      ) {

        await screen
          .orientation
          .lock(
            "landscape"
          );

      }

    }

    catch (error) {

      console.log(
        "Landscape-Lock nicht verfügbar."
      );

    }


    setTimeout(

      startAR,

      400

    );

  }

);


/* ==========================================================
   INITIALISIERUNG
   ========================================================== */

updateStartScreen();

</script>

</body>
</html>
