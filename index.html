<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GeoChemAR – Native MultiMarker 1+2</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#status {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 9999;

  padding: 10px 14px;
  border-radius: 8px;

  background: rgba(0,0,0,0.78);
  color: white;

  font-size: 14px;
  line-height: 1.5;

  pointer-events: none;
  white-space: pre-line;
}

#error {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 9999;

  padding: 10px;

  background: rgba(150,0,0,0.9);
  color: white;

  font-size: 13px;
  white-space: pre-wrap;

  display: none;
}

canvas {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  z-index: 2 !important;
}

video {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  z-index: 1 !important;

  visibility: visible !important;
  opacity: 1 !important;
}

</style>
</head>

<body>

<div id="status">
Initialisierung …
</div>

<div id="error"></div>


<script>

window.addEventListener(
  "error",
  function(event) {

    const box =
      document.getElementById("error");

    box.style.display =
      "block";

    box.textContent =
      "JavaScript-Fehler:\n" +
      event.message +
      "\n" +
      event.filename +
      "\nZeile " +
      event.lineno;

  }
);


window.addEventListener(
  "unhandledrejection",
  function(event) {

    const box =
      document.getElementById("error");

    box.style.display =
      "block";

    box.textContent =
      "Promise-Fehler:\n" +
      String(event.reason);

  }
);

</script>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js",
    "threex": "./libs/ar-threex.mjs"
  }
}
</script>


<script type="module">

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


function setStatus(text) {
  status.textContent = text;
}


function showError(error) {

  console.error(error);

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error && error.stack
        ? error.stack
        : String(error)
    );

}


try {

  /* =====================================================
     MODULE
     ===================================================== */

  const THREE =
    await import("three");


  const THREEX =
    await import("threex");


  const {
    ArToolkitSource,
    ArToolkitContext
  } = THREEX;



  /* =====================================================
     THREE.JS
     ===================================================== */

  const scene =
    new THREE.Scene();


  const camera =
    new THREE.Camera();


  scene.add(camera);


  const renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });


  renderer.setClearColor(
    0x000000,
    0
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  document.body.appendChild(
    renderer.domElement
  );



  /* =====================================================
     MULTIMARKER ROOT

     Dieser Root bekommt direkt die Pose,
     die ARToolKit für den gesamten
     MultiMarker berechnet.
     ===================================================== */

  const cubeRoot =
    new THREE.Group();


  cubeRoot.matrixAutoUpdate =
    false;


  cubeRoot.visible =
    false;


  scene.add(
    cubeRoot
  );



  /* =====================================================
     METHAN
     ===================================================== */

  const methane =
    new THREE.Group();


  const carbonRadius =
    0.22;

  const hydrogenRadius =
    0.14;

  const hydrogenDistance =
    0.72;

  const bondRadius =
    0.040;



  const carbonMaterial =
    new THREE.MeshBasicMaterial({
      color: 0x202020
    });


  const hydrogenMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xffffff
    });


  const bondMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xb8bec7
    });



  /* Kohlenstoff */

  const carbon =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        carbonRadius,
        48,
        32
      ),

      carbonMaterial

    );


  methane.add(
    carbon
  );



  /* Tetraederrichtungen */

  const directions = [

    new THREE.Vector3(
      1,
      1,
      1
    ).normalize(),

    new THREE.Vector3(
      1,
      -1,
      -1
    ).normalize(),

    new THREE.Vector3(
      -1,
      1,
      -1
    ).normalize(),

    new THREE.Vector3(
      -1,
      -1,
      1
    ).normalize()

  ];



  directions.forEach(
    function(direction) {

      /* Wasserstoff */

      const hydrogen =
        new THREE.Mesh(

          new THREE.SphereGeometry(
            hydrogenRadius,
            40,
            28
          ),

          hydrogenMaterial

        );


      hydrogen.position.copy(

        direction
          .clone()
          .multiplyScalar(
            hydrogenDistance
          )

      );


      methane.add(
        hydrogen
      );



      /* Bindung */

      const startDistance =
        carbonRadius;


      const endDistance =
        hydrogenDistance -
        hydrogenRadius;


      const startPoint =
        direction
          .clone()
          .multiplyScalar(
            startDistance
          );


      const endPoint =
        direction
          .clone()
          .multiplyScalar(
            endDistance
          );


      const bondVector =
        endPoint
          .clone()
          .sub(
            startPoint
          );


      const bondLength =
        bondVector.length();


      const bondGeometry =
        new THREE.CylinderGeometry(
          bondRadius,
          bondRadius,
          bondLength,
          32,
          1,
          false
        );


      const bond =
        new THREE.Mesh(
          bondGeometry,
          bondMaterial
        );


      bond.position.copy(

        startPoint
          .clone()
          .add(
            endPoint
          )
          .multiplyScalar(
            0.5
          )

      );


      bond.quaternion.setFromUnitVectors(

        new THREE.Vector3(
          0,
          1,
          0
        ),

        direction

      );


      methane.add(
        bond
      );

    }
  );



  /*
   * Die .dat-Datei arbeitet in Millimetern.
   *
   * Unsere bisherige Molekülgeometrie ist
   * auf Markerbreite 1 skaliert.
   *
   * Deshalb skalieren wir:
   *
   * 1 Three.js-Einheit = 40 mm
   */

  methane.scale.setScalar(
    40
  );


  /*
   * Der Ursprung der .dat-Datei liegt
   * im Würfelzentrum.
   *
   * Das Methan sitzt daher direkt dort.
   */

  methane.position.set(
    0,
    0,
    0
  );


  cubeRoot.add(
    methane
  );



  /* =====================================================
     KAMERA
     ===================================================== */

  const arToolkitSource =
    new ArToolkitSource({

      sourceType:
        "webcam",

      sourceWidth:
        640,

      sourceHeight:
        480,

      displayWidth:
        640,

      displayHeight:
        480

    });


  setStatus(
    "Kamera wird gestartet …"
  );


  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitSource.init(
          function() {
            resolve();
          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  const video =
    arToolkitSource.domElement;


  if (!video) {

    throw new Error(
      "Kein Videoelement vorhanden."
    );

  }


  video.setAttribute(
    "playsinline",
    ""
  );


  video.muted =
    true;


  video.style.position =
    "fixed";

  video.style.top =
    "0px";

  video.style.left =
    "0px";

  video.style.zIndex =
    "1";

  video.style.visibility =
    "visible";

  video.style.opacity =
    "1";



  /* =====================================================
     AUF VIDEOBILD WARTEN
     ===================================================== */

  if (
    video.readyState < 2 ||
    video.videoWidth === 0
  ) {

    await new Promise(
      (resolve, reject) => {

        const timeout =
          setTimeout(
            function() {

              reject(
                new Error(
                  "Kein Kamerabild nach 10 Sekunden."
                )
              );

            },
            10000
          );


        function ready() {

          if (
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {

            clearTimeout(
              timeout
            );


            video.removeEventListener(
              "canplay",
              ready
            );


            video.removeEventListener(
              "loadedmetadata",
              ready
            );


            resolve();

          }

        }


        video.addEventListener(
          "canplay",
          ready
        );


        video.addEventListener(
          "loadedmetadata",
          ready
        );


        ready();

      }
    );

  }



  /* =====================================================
     BEWÄHRTE KAMERAEINSTELLUNGEN
     ===================================================== */

  try {

    const stream =
      video.srcObject;


    if (stream) {

      const tracks =
        stream.getVideoTracks();


      if (tracks.length > 0) {

        await tracks[0].applyConstraints({

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        });

      }

    }

  }

  catch(error) {

    console.warn(
      "Kamera-Constraints:",
      error
    );

  }



  /* =====================================================
     ARTOOLKIT
     ===================================================== */

  setStatus(
    "ARToolKit wird initialisiert …"
  );


  const arToolkitContext =
    new ArToolkitContext({

      cameraParametersUrl:
        "https://raw.githack.com/AR-js-org/AR.js/3.4.8/data/data/camera_para.dat",

      detectionMode:
        "mono_and_matrix",

      matrixCodeType:
        "3x3_HAMMING63",

      maxDetectionRate:
        30,

      canvasWidth:
        640,

      canvasHeight:
        480

    });



  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitContext.init(
          function() {

            try {

              camera
                .projectionMatrix
                .copy(
                  arToolkitContext
                    .getProjectionMatrix()
                );


              resolve();

            }

            catch(error) {
              reject(error);
            }

          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  const controller =
    arToolkitContext.arController;


  if (!controller) {

    throw new Error(
      "ARController nicht vorhanden."
    );

  }



  /* =====================================================
     MULTIMARKER LADEN
     ===================================================== */

  setStatus(
    "MultiMarker 1+2 wird geladen …"
  );


  const multiMarkerId =
    await new Promise(
      (resolve, reject) => {

        controller.loadMultiMarker(

          "./data/cube-12.dat",

          function(
            markerId,
            markerNum
          ) {

            console.log(
              "MultiMarker geladen:",
              markerId,
              markerNum
            );


            if (
              markerNum !== 2
            ) {

              reject(
                new Error(
                  "cube-12.dat wurde geladen, enthält laut ARToolKit aber " +
                  markerNum +
                  " Marker statt 2."
                )
              );

              return;

            }


            resolve(
              markerId
            );

          },

          function(error) {

            reject(
              new Error(
                "cube-12.dat konnte nicht geladen werden: " +
                String(error)
              )
            );

          }

        );

      }
    );



  /* =====================================================
     MULTIMARKER EVENT

     ARToolKit liefert hier bereits die robuste
     gemeinsame Pose des gesamten Marker-Sets.
     ===================================================== */

  let multiSeenThisFrame =
    false;


  let lastSeenTime =
    0;


  controller.addEventListener(

    "getMultiMarker",

    function(event) {

      if (
        event.data.multiMarkerId !==
        multiMarkerId
      ) {

        return;

      }


      /*
       * event.data.matrix ist bereits eine
       * WebGL-kompatible 4×4-Matrix.
       */

      cubeRoot.matrix.fromArray(
        event.data.matrix
      );


      cubeRoot.matrixWorldNeedsUpdate =
        true;


      cubeRoot.visible =
        true;


      multiSeenThisFrame =
        true;


      lastSeenTime =
        performance.now();

    }

  );



  /* =====================================================
     RESIZE
     ===================================================== */

  function onResize() {

    arToolkitSource
      .onResizeElement();


    arToolkitSource
      .copyElementSizeTo(
        renderer.domElement
      );


    if (
      arToolkitContext &&
      arToolkitContext.arController
    ) {

      arToolkitSource
        .copyElementSizeTo(
          arToolkitContext
            .arController
            .canvas
        );

    }

  }


  window.addEventListener(
    "resize",
    onResize
  );


  onResize();


  video.style.zIndex =
    "1";


  renderer.domElement.style.zIndex =
    "2";


  setStatus(
    "Native MultiMarker 1+2 bereit\n\n" +
    "Marker 1 oder 2 zeigen."
  );



  /* =====================================================
     RENDER LOOP
     ===================================================== */

  function animate() {

    requestAnimationFrame(
      animate
    );


    multiSeenThisFrame =
      false;


    if (
      arToolkitSource.ready
    ) {

      arToolkitContext.update(
        arToolkitSource.domElement
      );

    }



    /*
     * Ein sehr kurzer Hold verhindert nur,
     * dass das Objekt zwischen zwei
     * einzelnen Videoframes flackert.
     *
     * KEINE Poseglättung.
     */

    if (
      performance.now() -
      lastSeenTime >
      150
    ) {

      cubeRoot.visible =
        false;

    }



    if (
      cubeRoot.visible
    ) {

      setStatus(
        "MultiMarker erkannt\n\n" +
        "Jetzt langsam von Seite 1 über die Kante zu Seite 2 drehen."
      );

    }

    else {

      setStatus(
        "MultiMarker 1+2 bereit\n\n" +
        "Marker 1 oder 2 zeigen."
      );

    }



    renderer.render(
      scene,
      camera
    );

  }


  animate();

}

catch(error) {

  showError(error);

}

</script>

</body>
</html>
