<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR</title>

  <!-- Lokale Bibliotheken -->
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

      font-family: Arial, sans-serif;
    }


    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }


    #sceneHost {
      width: 100%;
      height: 100%;
    }


    #arjs-video {
      z-index: 0 !important;

      visibility: visible !important;
      opacity: 1 !important;
    }


    canvas.a-canvas {
      z-index: 1 !important;

      background: transparent !important;
    }


    /* --------------------------------
       Diagnose
       -------------------------------- */

    #status {

      position: fixed;

      top: max(6px, env(safe-area-inset-top));
      left: max(6px, env(safe-area-inset-left));
      right: max(6px, env(safe-area-inset-right));

      z-index: 2147483646;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.76);

      color: white;

      font-size: 10px;
      line-height: 1.3;

      border-radius: 6px;

      pointer-events: none;
    }


    /* --------------------------------
       Querformat-Warnung
       -------------------------------- */

    #rotateMessage {

      display: none;

      position: fixed !important;

      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;

      z-index: 2147483647 !important;

      box-sizing: border-box;

      padding: 30px;

      background: #111 !important;

      color: white;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    #rotateMessage.visible {
      display: flex !important;
    }


    #rotateMessage .content {
      max-width: 420px;
    }


    #rotateIcon {

      margin-bottom: 22px;

      font-size: 64px;
      line-height: 1;
    }


    #rotateMessage strong {

      display: block;

      margin-bottom: 12px;

      font-size: 22px;
    }


    #rotateMessage span {

      display: block;

      font-size: 15px;
      line-height: 1.45;

      opacity: 0.9;
    }

  </style>

</head>


<body>


  <!-- Hier wird die AR-Szene nur dann eingefügt,
       wenn sie wirklich gestartet werden darf. -->

  <div id="sceneHost"></div>



  <!-- Diagnose -->

  <div id="status">
    GeoChemAR startet …
  </div>



  <!-- Querformat-Warnung -->

  <div id="rotateMessage">

    <div class="content">

      <div id="rotateIcon">
        ↻
      </div>

      <strong>
        Bitte Smartphone drehen
      </strong>

      <span>
        GeoChemAR wird auf dem Smartphone
        im Querformat verwendet.
      </span>

    </div>

  </div>



<script>

const sceneHost =
  document.getElementById("sceneHost");

const status =
  document.getElementById("status");

const rotateMessage =
  document.getElementById("rotateMessage");


let cameraOptimized = false;

let arStarted = false;

/*
  Merkt sich, ob während einer laufenden
  AR-Sitzung die Orientierung geändert wurde.
*/
let orientationChangedDuringAR = false;



/* ====================================================
   Gerät erkennen
   ==================================================== */

function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        window.screen.width,
        window.screen.height
      ) < 1000
    )

  );

}



/* ====================================================
   Querformat erkennen
   ==================================================== */

function isLandscape() {

  return (
    window.innerWidth >
    window.innerHeight
  );

}



/* ====================================================
   Warnung
   ==================================================== */

function showRotateWarning() {

  rotateMessage.classList.add(
    "visible"
  );

  status.style.display =
    "none";

}


function hideRotateWarning() {

  rotateMessage.classList.remove(
    "visible"
  );

  status.style.display =
    "block";

}



/* ====================================================
   AR-Szene erzeugen
   ==================================================== */

function startAR() {

  if (arStarted) {
    return;
  }


  arStarted = true;


  sceneHost.innerHTML = `

    <a-scene

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono;
      "

    >


      <a-marker

        preset="hiro"

        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2"

      >


        <a-box

          position="0 0.3 0"

          width="0.6"
          height="0.6"
          depth="0.6"

          material="
            color: #2563eb;
            opacity: 0.8;
            transparent: true;
            side: double;
          "

        >
        </a-box>


      </a-marker>


      <a-entity camera></a-entity>


    </a-scene>

  `;

}



/* ====================================================
   AR.js-Video finden
   ==================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ====================================================
   Video sichtbar halten
   ==================================================== */

function keepVideoVisible() {

  if (!arStarted) {
    return;
  }


  const video =
    getARVideo();


  if (!video) {
    return;
  }


  video.style.setProperty(
    "visibility",
    "visible",
    "important"
  );


  video.style.setProperty(
    "opacity",
    "1",
    "important"
  );


  video.style.setProperty(
    "z-index",
    "0",
    "important"
  );


  video.setAttribute(
    "playsinline",
    ""
  );


  video.setAttribute(
    "webkit-playsinline",
    ""
  );


  video.muted = true;


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (canvas) {

    canvas.style.setProperty(
      "z-index",
      "1",
      "important"
    );


    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ====================================================
   Smartphone-Kamera optimieren

   Dies ist dieselbe Logik wie in unserer
   funktionierenden Version.
   ==================================================== */

async function optimizeMobileCamera() {

  if (cameraOptimized) {
    return;
  }


  if (!arStarted) {
    return;
  }


  if (!isMobileDevice()) {

    cameraOptimized = true;

    console.log(
      "GeoChemAR: Desktop – Webcam unverändert."
    );

    return;

  }


  const video =
    getARVideo();


  if (!video) {
    return;
  }


  const stream =
    video.srcObject;


  if (!stream) {
    return;
  }


  const tracks =
    stream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  const track =
    tracks[0];



  /* --------------------------------
     Kameraauflösung
     -------------------------------- */

  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }



  /* --------------------------------
     Zoom möglichst 1×
     -------------------------------- */

  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        let desiredZoom = 1;


        desiredZoom =
          Math.max(

            capabilities.zoom.min,

            Math.min(
              desiredZoom,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized = true;

}



/* ====================================================
   Diagnose
   ==================================================== */

function updateStatus() {

  if (!arStarted) {
    return;
  }


  const video =
    getARVideo();


  let text =

    isMobileDevice()

      ? "Mobil"

      : "Computer";


  text +=

    " | Fenster "
    +
    window.innerWidth
    +
    "×"
    +
    window.innerHeight;


  if (!video) {

    text +=
      " | Kamera wird initialisiert …";

    status.textContent =
      text;

    return;

  }


  text +=

    " | Video "
    +
    video.videoWidth
    +
    "×"
    +
    video.videoHeight;


  const stream =
    video.srcObject;


  if (
    stream
    &&
    stream.getVideoTracks
  ) {

    const tracks =
      stream.getVideoTracks();


    if (tracks.length) {

      const track =
        tracks[0];


      if (track.getSettings) {

        const settings =
          track.getSettings();


        if (
          settings.width
          &&
          settings.height
        ) {

          text +=

            " | Stream "
            +
            settings.width
            +
            "×"
            +
            settings.height;

        }


        if (settings.frameRate) {

          text +=

            " @ "
            +
            Math.round(
              settings.frameRate
            )
            +
            "fps";

        }


        if (settings.facingMode) {

          text +=

            " | "
            +
            settings.facingMode;

        }


        if (
          settings.zoom !== undefined
        ) {

          text +=

            " | Zoom "
            +
            settings.zoom;

        }

      }


      if (track.label) {

        text +=

          " | "
          +
          track.label;

      }

    }

  }


  status.textContent =
    text;

}



/* ====================================================
   Startentscheidung

   PC:
   sofort starten

   Smartphone Querformat:
   sofort starten

   Smartphone Hochformat:
   KEINE Kamera starten
   ==================================================== */

function initialStart() {

  if (!isMobileDevice()) {

    hideRotateWarning();

    startAR();

    return;

  }


  if (isLandscape()) {

    hideRotateWarning();

    startAR();

  }

  else {

    /*
      Ganz wichtig:

      Im Hochformat wird AR überhaupt
      nicht initialisiert.

      Dadurch gibt es keine falsche
      Portrait-Kalibrierung.
    */

    showRotateWarning();

  }

}



/* ====================================================
   Orientierungswechsel
   ==================================================== */

function handleOrientationChange() {

  /*
    Am PC interessiert uns die
    Geräteorientierung nicht.
  */

  if (!isMobileDevice()) {
    return;
  }


  /*
    Smartphone steht jetzt hochkant.
  */

  if (!isLandscape()) {

    showRotateWarning();


    /*
      Falls AR bereits lief, merken wir uns,
      dass diese Sitzung jetzt nicht mehr
      sicher weiterverwendet werden soll.
    */

    if (arStarted) {

      orientationChangedDuringAR =
        true;

    }


    return;

  }



  /*
    Smartphone steht jetzt quer.
  */


  hideRotateWarning();


  /*
    Fall 1:
    Seite wurde ursprünglich im Hochformat
    geöffnet.

    AR läuft noch gar nicht.

    Wir laden einmal neu, damit AR.js
    direkt im Querformat initialisiert wird.
  */

  if (!arStarted) {

    location.reload();

    return;

  }



  /*
    Fall 2:
    AR lief bereits, danach wurde das Gerät
    hochkant gehalten und jetzt wieder quer.

    Auch hier laden wir neu.

    Das verhindert:
    - falsche Projektion
    - verzerrte Objekte
    - falsche Position
    - Pixel-/Scaling-Probleme
  */

  if (orientationChangedDuringAR) {

    location.reload();

  }

}



/* ====================================================
   Events
   ==================================================== */

window.addEventListener(

  "orientationchange",

  function () {

    /*
      Der Browser braucht kurz, bis
      innerWidth und innerHeight zur
      neuen Orientierung passen.
    */

    setTimeout(
      handleOrientationChange,
      350
    );

  }

);



window.addEventListener(

  "resize",

  function () {

    /*
      Manche Android-Browser feuern kein
      zuverlässiges orientationchange.

      Deshalb prüfen wir zusätzlich resize.
    */

    setTimeout(
      handleOrientationChange,
      150
    );

  }

);



/* ====================================================
   Start
   ==================================================== */

initialStart();



/* ====================================================
   Laufende AR-Pflege
   ==================================================== */

setInterval(

  function () {

    if (!arStarted) {
      return;
    }


    keepVideoVisible();

    optimizeMobileCamera();

    updateStatus();

  },

  500

);

</script>


</body>

</html>
