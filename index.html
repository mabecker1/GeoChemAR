<script>

/* ==========================================================
   METHAN
   ========================================================== */

AFRAME.registerComponent("methane-model", {

  init: function () {

    const THREE = AFRAME.THREE;
    const group = new THREE.Group();

    const carbonRadius = 0.22;
    const hydrogenRadius = 0.14;
    const hydrogenDistance = 0.72;
    const bondRadius = 0.040;

    const carbonMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x202020,
        roughness: 0.55,
        metalness: 0
      });

    const hydrogenMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.45,
        metalness: 0
      });

    const bondMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xb8bec7,
        roughness: 0.50,
        metalness: 0
      });

    const carbon =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          carbonRadius,
          48,
          32
        ),
        carbonMaterial
      );

    group.add(carbon);

    const hydrogenGeometry =
      new THREE.SphereGeometry(
        hydrogenRadius,
        40,
        28
      );

    const directions = [
      new THREE.Vector3(1, 1, 1),
      new THREE.Vector3(1, -1, -1),
      new THREE.Vector3(-1, 1, -1),
      new THREE.Vector3(-1, -1, 1)
    ];

    directions.forEach(
      direction => direction.normalize()
    );

    const yAxis =
      new THREE.Vector3(0, 1, 0);

    directions.forEach(function(direction) {

      const hydrogen =
        new THREE.Mesh(
          hydrogenGeometry,
          hydrogenMaterial
        );

      hydrogen.position.copy(
        direction.clone().multiplyScalar(
          hydrogenDistance
        )
      );

      group.add(hydrogen);

      const startDistance =
        carbonRadius;

      const endDistance =
        hydrogenDistance - hydrogenRadius;

      const startPoint =
        direction.clone().multiplyScalar(
          startDistance
        );

      const endPoint =
        direction.clone().multiplyScalar(
          endDistance
        );

      const bondVector =
        endPoint.clone().sub(startPoint);

      const bondLength =
        bondVector.length();

      const bond =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            bondRadius,
            bondRadius,
            bondLength,
            32,
            1,
            false
          ),
          bondMaterial
        );

      bond.position.copy(
        startPoint
          .clone()
          .add(endPoint)
          .multiplyScalar(0.5)
      );

      bond.quaternion.setFromUnitVectors(
        yAxis,
        direction
      );

      group.add(bond);

    });

    this.el.setObject3D(
      "methaneMesh",
      group
    );

  }

});


/* ==========================================================
   WÜRFELTRACKER – PHASE 4e-4
   ========================================================== */

AFRAME.registerComponent("cube-tracker", {

  init: function () {

    const THREE = AFRAME.THREE;

    const h = 0.5625;
    const s = Math.SQRT1_2;

    this.markers = [];

    this.visible = [
      false, false, false,
      false, false, false
    ];

    this.faces = [

      {
        position: new THREE.Vector3(0, 0, -h),
        quaternion: new THREE.Quaternion(-s, 0, 0, s)
      },

      {
        position: new THREE.Vector3(0, h, 0),
        quaternion: new THREE.Quaternion(0, 0, 0, 1)
      },

      {
        position: new THREE.Vector3(h, 0, 0),
        quaternion: new THREE.Quaternion(s, s, 0, 0)
      },

      {
        position: new THREE.Vector3(0, -h, 0),
        quaternion: new THREE.Quaternion(0, 0, 1, 0)
      },

      {
        position: new THREE.Vector3(-h, 0, 0),
        quaternion: new THREE.Quaternion(0, 0, s, s)
      },

      {
        position: new THREE.Vector3(0, 0, h),
        quaternion: new THREE.Quaternion(s, 0, 0, s)
      }

    ];

    this.faceMatrices = [];

    const unitScale =
      new THREE.Vector3(1,1,1);

    for (let i = 0; i < 6; i++) {

      this.faceMatrices[i] =
        new THREE.Matrix4().compose(
          this.faces[i].position,
          this.faces[i].quaternion,
          unitScale
        );

    }


    this.camera =
      document.querySelector("[camera]").object3D;

    this.cameraPosition =
      new THREE.Vector3();

    this.markerPosition =
      new THREE.Vector3();

    this.markerQuaternion =
      new THREE.Quaternion();

    this.markerScale =
      new THREE.Vector3();

    this.markerNormal =
      new THREE.Vector3();

    this.toCamera =
      new THREE.Vector3();

    this.tempMatrix =
      new THREE.Matrix4();

    this.inverseFace =
      new THREE.Matrix4();


    this.currentPosition =
      new THREE.Vector3();

    this.currentQuaternion =
      new THREE.Quaternion();

    this.hasPose = false;

    this.lastSeenTime = 0;

    this.holdTime = 250;


    /*
       ======================================================
       4e-4: MULTI-MARKER-KONSISTENZ

       Mehrere Marker dürfen schnelle echte Bewegung
       bestätigen.

       Die Toleranzen sind bewusst großzügiger als in 4e-3,
       damit Kanten-/Eckenübergänge nicht blockiert werden.
       ======================================================
    */

    this.multiPositionTolerance = 0.48;
    this.multiRotationToleranceDeg = 38;


    /*
       ======================================================
       EINZELMARKER-SCHUTZ

       Nur wenn wirklich nur ein brauchbarer Marker vorhanden
       ist, greifen wir stärker gegen extreme Einzelmessungen
       ein.
       ======================================================
    */

    this.singleJumpPositionThreshold = 0.52;
    this.singleJumpRotationThresholdDeg = 45;

    this.singlePendingPosition =
      new THREE.Vector3();

    this.singlePendingQuaternion =
      new THREE.Quaternion();

    this.singlePendingFrames = 0;

    this.singlePending = false;


    this.info =
      document.getElementById("trackingInfo");


    for (let i = 0; i < 6; i++) {

      const marker =
        document.getElementById(
          "marker" + i
        );

      this.markers[i] = marker;

      marker.addEventListener(
        "markerFound",
        () => {
          this.visible[i] = true;
        }
      );

      marker.addEventListener(
        "markerLost",
        () => {
          this.visible[i] = false;
        }
      );

    }

    this.el.object3D.visible = false;

  },


  quaternionAngleDeg: function(a, b) {

    let dot =
      Math.abs(
        a.dot(b)
      );

    dot =
      Math.min(
        1,
        Math.max(
          -1,
          dot
        )
      );

    return (
      2 *
      Math.acos(dot) *
      180 /
      Math.PI
    );

  },


  getCubeCandidate: function(index) {

    const THREE = AFRAME.THREE;

    const marker =
      this.markers[index];

    marker.object3D.updateMatrixWorld(true);

    this.inverseFace
      .copy(
        this.faceMatrices[index]
      )
      .invert();

    this.tempMatrix.multiplyMatrices(
      marker.object3D.matrixWorld,
      this.inverseFace
    );

    const position =
      new THREE.Vector3();

    const quaternion =
      new THREE.Quaternion();

    const scale =
      new THREE.Vector3();

    this.tempMatrix.decompose(
      position,
      quaternion,
      scale
    );

    marker.object3D.matrixWorld.decompose(
      this.markerPosition,
      this.markerQuaternion,
      this.markerScale
    );

    this.markerNormal
      .set(0,1,0)
      .applyQuaternion(
        this.markerQuaternion
      )
      .normalize();

    this.camera.getWorldPosition(
      this.cameraPosition
    );

    this.toCamera
      .copy(this.cameraPosition)
      .sub(this.markerPosition)
      .normalize();

    let frontality =
      Math.abs(
        this.markerNormal.dot(
          this.toCamera
        )
      );

    let weight =
      Math.pow(
        frontality,
        4
      );

    weight =
      Math.max(
        0.03,
        weight
      );

    return {
      index,
      position,
      quaternion,
      weight,
      frontality
    };

  },


  /* ========================================================
     PAARWEISE KONSISTENZ

     Ein Marker bekommt einen Konsistenzwert dafür,
     mit wie vielen anderen Markern seine Würfelpose
     übereinstimmt.
     ======================================================== */

  findConsistentCandidates: function(candidates) {

    if (candidates.length < 2) {

      return {
        candidates: candidates,
        confirmed: false
      };

    }


    const scores =
      candidates.map(() => 0);


    for (
      let i = 0;
      i < candidates.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < candidates.length;
        j++
      ) {

        const positionDifference =
          candidates[i].position.distanceTo(
            candidates[j].position
          );

        const rotationDifference =
          this.quaternionAngleDeg(
            candidates[i].quaternion,
            candidates[j].quaternion
          );


        if (
          positionDifference <=
            this.multiPositionTolerance
          &&
          rotationDifference <=
            this.multiRotationToleranceDeg
        ) {

          scores[i]++;
          scores[j]++;

        }

      }

    }


    const bestScore =
      Math.max(...scores);


    /*
       Mindestens zwei Marker stimmen miteinander überein.
    */

    if (bestScore >= 1) {

      const result =
        candidates.filter(
          (candidate, index) =>
            scores[index] >= 1
        );


      return {
        candidates: result,
        confirmed: true
      };

    }


    /*
       Kein konsistentes Paar.

       Dann nehmen wir nur den geometrisch günstigsten
       Marker und behandeln die Situation wie
       Einzelmarkertracking.
    */

    const sorted =
      [...candidates].sort(
        (a,b) =>
          b.weight - a.weight
      );


    return {
      candidates: [sorted[0]],
      confirmed: false
    };

  },


  fusePositions: function(candidates) {

    const THREE = AFRAME.THREE;

    const result =
      new THREE.Vector3();

    let totalWeight = 0;


    candidates.forEach(
      candidate => {

        result.addScaledVector(
          candidate.position,
          candidate.weight
        );

        totalWeight +=
          candidate.weight;

      }
    );


    if (totalWeight > 0) {

      result.multiplyScalar(
        1 / totalWeight
      );

    }


    return result;

  },


  fuseQuaternions: function(candidates) {

    let best =
      candidates[0];


    candidates.forEach(
      candidate => {

        if (
          candidate.weight >
          best.weight
        ) {

          best = candidate;

        }

      }
    );


    const result =
      best.quaternion.clone();


    let accumulatedWeight =
      best.weight;


    const others =
      candidates
        .filter(
          c => c !== best
        )
        .sort(
          (a,b) =>
            b.weight - a.weight
        );


    others.forEach(
      candidate => {

        const q =
          candidate.quaternion.clone();


        if (
          result.dot(q) < 0
        ) {

          q.x *= -1;
          q.y *= -1;
          q.z *= -1;
          q.w *= -1;

        }


        const t =
          candidate.weight
          /
          (
            accumulatedWeight +
            candidate.weight
          );


        result.slerp(
          q,
          t
        );


        accumulatedWeight +=
          candidate.weight;

      }
    );


    result.normalize();

    return result;

  },


  /* ========================================================
     EINZELMARKER-SCHUTZ

     Wichtig:
     Dieser Schutz wird NICHT verwendet, wenn mindestens
     zwei Marker dieselbe neue Würfelpose bestätigen.

     Dadurch werden schnelle echte Drehungen über Kanten
     und Ecken nicht mehr pauschal blockiert.
     ======================================================== */

  acceptSingleMarkerPose: function(
    position,
    quaternion
  ) {

    if (!this.hasPose) {

      this.singlePending = false;
      this.singlePendingFrames = 0;

      return true;

    }


    const positionDifference =
      this.currentPosition.distanceTo(
        position
      );


    const rotationDifference =
      this.quaternionAngleDeg(
        this.currentQuaternion,
        quaternion
      );


    const suspicious =
      positionDifference >
        this.singleJumpPositionThreshold
      ||
      rotationDifference >
        this.singleJumpRotationThresholdDeg;


    /*
       Normale Einzelmarkerbewegung:
       sofort übernehmen.
    */

    if (!suspicious) {

      this.singlePending = false;
      this.singlePendingFrames = 0;

      return true;

    }


    /*
       Erster verdächtiger Frame.
    */

    if (!this.singlePending) {

      this.singlePendingPosition.copy(
        position
      );

      this.singlePendingQuaternion.copy(
        quaternion
      );

      this.singlePendingFrames = 1;

      this.singlePending = true;

      return false;

    }


    /*
       Prüfen, ob sich die neue Pose bestätigt.
    */

    const confirmationPosition =
      this.singlePendingPosition.distanceTo(
        position
      );


    const confirmationRotation =
      this.quaternionAngleDeg(
        this.singlePendingQuaternion,
        quaternion
      );


    if (
      confirmationPosition < 0.34
      &&
      confirmationRotation < 30
    ) {

      this.singlePendingFrames++;


      /*
         Bereits der zweite konsistente Frame reicht.

         Dadurch ist die Verzögerung deutlich kleiner
         als ein dauerhafter Sprungschutz.
      */

      if (
        this.singlePendingFrames >= 2
      ) {

        this.singlePending = false;
        this.singlePendingFrames = 0;

        return true;

      }


      return false;

    }


    /*
       Keine Bestätigung:
       vermutlich Fehlmessung.

       Die aktuelle Messung wird der neue Kandidat.
    */

    this.singlePendingPosition.copy(
      position
    );

    this.singlePendingQuaternion.copy(
      quaternion
    );

    this.singlePendingFrames = 1;

    return false;

  },


  /* ========================================================
     ADAPTIVE GLÄTTUNG

     Kleine Änderungen:
       stärker beruhigen

     Große echte Bewegungen:
       sehr direkt folgen
     ======================================================== */

  applyAdaptivePose: function(
    targetPosition,
    targetQuaternion,
    multiConfirmed
  ) {

    /*
       Abweichung von der aktuell dargestellten Pose.
    */

    const positionDifference =
      this.currentPosition.distanceTo(
        targetPosition
      );


    const rotationDifference =
      this.quaternionAngleDeg(
        this.currentQuaternion,
        targetQuaternion
      );


    let positionAlpha;
    let rotationAlpha;


    /*
       ------------------------------------------------------
       MEHRERE MARKER BESTÄTIGEN DIE POSE

       Hier vertrauen wir der Messung stark.
       ------------------------------------------------------
    */

    if (multiConfirmed) {

      if (
        positionDifference < 0.035
      ) {

        positionAlpha = 0.38;

      }

      else if (
        positionDifference < 0.12
      ) {

        positionAlpha = 0.68;

      }

      else {

        positionAlpha = 0.90;

      }


      if (
        rotationDifference < 2.0
      ) {

        rotationAlpha = 0.42;

      }

      else if (
        rotationDifference < 8.0
      ) {

        rotationAlpha = 0.75;

      }

      else {

        rotationAlpha = 0.94;

      }

    }


    /*
       ------------------------------------------------------
       NUR EIN MARKER

       Etwas vorsichtiger, aber immer noch direkter
       als eine starke permanente Glättung.
       ------------------------------------------------------
    */

    else {

      if (
        positionDifference < 0.035
      ) {

        positionAlpha = 0.30;

      }

      else if (
        positionDifference < 0.12
      ) {

        positionAlpha = 0.58;

      }

      else {

        positionAlpha = 0.80;

      }


      if (
        rotationDifference < 2.0
      ) {

        rotationAlpha = 0.34;

      }

      else if (
        rotationDifference < 8.0
      ) {

        rotationAlpha = 0.65;

      }

      else {

        rotationAlpha = 0.86;

      }

    }


    this.currentPosition.lerp(
      targetPosition,
      positionAlpha
    );


    const q =
      targetQuaternion.clone();


    if (
      this.currentQuaternion.dot(q) < 0
    ) {

      q.x *= -1;
      q.y *= -1;
      q.z *= -1;
      q.w *= -1;

    }


    this.currentQuaternion.slerp(
      q,
      rotationAlpha
    );

  },


  tick: function() {

    const now =
      performance.now();


    let candidates = [];


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      if (!this.visible[i]) {

        continue;

      }


      candidates.push(
        this.getCubeCandidate(i)
      );

    }


    /*
       ======================================================
       KEIN MARKER
       ======================================================
    */

    if (
      candidates.length === 0
    ) {

      const elapsed =
        now - this.lastSeenTime;


      if (
        this.hasPose &&
        elapsed < this.holdTime
      ) {

        this.el.object3D.visible =
          true;

        this.info.textContent =
          "Würfel: kurz gehalten";

      }

      else {

        this.el.object3D.visible =
          false;

        this.info.textContent =
          "Würfel: –";

      }


      return;

    }


    this.lastSeenTime = now;


    candidates.sort(
      (a,b) =>
        b.weight - a.weight
    );


    const visibleCount =
      candidates.length;


    /*
       ======================================================
       FRONTality-FILTER

       Schwache, extrem schräge Marker sollen nicht unnötig
       die Fusion beeinflussen.
       ======================================================
    */

    const bestWeight =
      candidates[0].weight;


    let useful =
      candidates.filter(
        candidate =>
          candidate.weight >=
          Math.max(
            0.06,
            bestWeight * 0.15
          )
      );


    if (
      useful.length === 0
    ) {

      useful = [
        candidates[0]
      ];

    }


    /*
       ======================================================
       KONSISTENZPRÜFUNG
       ======================================================
    */

    const consistency =
      this.findConsistentCandidates(
        useful
      );


    useful =
      consistency.candidates;


    const multiConfirmed =
      consistency.confirmed;


    /*
       ======================================================
       WÜRFELPOSE BERECHNEN
       ======================================================
    */

    const fusedPosition =
      this.fusePositions(
        useful
      );


    const fusedQuaternion =
      this.fuseQuaternions(
        useful
      );


    /*
       ======================================================
       ERSTE POSE
       ======================================================
    */

    if (!this.hasPose) {

      this.currentPosition.copy(
        fusedPosition
      );

      this.currentQuaternion.copy(
        fusedQuaternion
      );

      this.hasPose = true;

    }

    else {

      /*
         ====================================================
         NUR EIN MARKER / KEINE MULTI-BESTÄTIGUNG

         Hier bleibt der Schutz gegen Fingerfehler aktiv.
         ====================================================
      */

      if (!multiConfirmed) {

        const accepted =
          this.acceptSingleMarkerPose(
            fusedPosition,
            fusedQuaternion
          );


        if (!accepted) {

          this.el.object3D.visible =
            true;


          this.info.textContent =
            "Würfel: "
            +
            useful
              .map(c => c.index)
              .join(",")
            +
            " | Einzelmarker geschützt";


          return;

        }

      }

      else {

        /*
           Sobald mehrere Marker dieselbe Pose bestätigen,
           löschen wir einen eventuell wartenden
           Einzelmarker-Sprung.
        */

        this.singlePending = false;
        this.singlePendingFrames = 0;

      }


      /*
         Adaptive statt starre Glättung.
      */

      this.applyAdaptivePose(
        fusedPosition,
        fusedQuaternion,
        multiConfirmed
      );

    }


    this.el.object3D.position.copy(
      this.currentPosition
    );


    this.el.object3D.quaternion.copy(
      this.currentQuaternion
    );


    this.el.object3D.scale.set(
      1,1,1
    );


    this.el.object3D.visible =
      true;


    const markerText =
      useful
        .map(
          candidate =>
            candidate.index
        )
        .join(",");


    this.info.textContent =
      "Würfel: "
      +
      markerText
      +
      " | sichtbar: "
      +
      visibleCount
      +
      (
        multiConfirmed
          ? " | Multi ✓"
          : " | Einzel"
      );

  }

});


/* ==========================================================
   HAUPTPROGRAMM
   ========================================================== */

const sceneHost =
  document.getElementById(
    "sceneHost"
  );

const startScreen =
  document.getElementById(
    "startScreen"
  );

const rotateIcon =
  document.getElementById(
    "rotateIcon"
  );

const startTitle =
  document.getElementById(
    "startTitle"
  );

const startText =
  document.getElementById(
    "startText"
  );

const startButton =
  document.getElementById(
    "startButton"
  );


let arStarted = false;
let cameraOptimized = false;


function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}


function isLandscape() {

  return (
    window.innerWidth >
    window.innerHeight
  );

}


function updateStartScreen() {

  if (!isMobileDevice()) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (arStarted) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (!isLandscape()) {

    rotateIcon.style.display =
      "block";

    startTitle.textContent =
      "Bitte Smartphone drehen";

    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";

    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";

    startTitle.textContent =
      "GeoChemAR";

    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";

    startButton.style.display =
      "block";

  }

}


/* ==========================================================
   AR-SZENE
   ========================================================== */

function createARScene() {

  if (arStarted) return;


  arStarted = true;


  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
      "

    >


      <a-marker
        id="marker0"
        type="barcode"
        value="0"
        smooth="false">
      </a-marker>


      <a-marker
        id="marker1"
        type="barcode"
        value="1"
        smooth="false">
      </a-marker>


      <a-marker
        id="marker2"
        type="barcode"
        value="2"
        smooth="false">
      </a-marker>


      <a-marker
        id="marker3"
        type="barcode"
        value="3"
        smooth="false">
      </a-marker>


      <a-marker
        id="marker4"
        type="barcode"
        value="4"
        smooth="false">
      </a-marker>


      <a-marker
        id="marker5"
        type="barcode"
        value="5"
        smooth="false">
      </a-marker>


      <a-entity
        id="cubeRoot"
        cube-tracker
      >

        <a-entity
          id="methane"
          position="0 0 0"
          rotation="0 0 0"
          methane-model>
        </a-entity>

      </a-entity>


      <a-entity
        light="
          type: ambient;
          intensity: 1.0;
          color: #ffffff;
        ">
      </a-entity>


      <a-entity
        light="
          type: directional;
          intensity: 0.8;
          color: #ffffff;
        "
        position="1 2 1">
      </a-entity>


      <a-entity camera></a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );

}


/* ==========================================================
   MOBILER START
   ========================================================== */

async function startMobileAR() {

  if (!isLandscape()) {

    updateStartScreen();

    return;

  }


  try {

    const element =
      document.documentElement;


    if (element.requestFullscreen) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }


  try {

    if (
      screen.orientation &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }


  setTimeout(
    createARScene,
    400
  );

}


/* ==========================================================
   VIDEO
   ========================================================== */

function getARVideo() {

  return (
    document.getElementById(
      "arjs-video"
    )
    ||
    document.querySelector(
      "video"
    )
  );

}


/* ==========================================================
   EBENEN
   ========================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );

  const scene =
    document.getElementById(
      "arScene"
    );

  const video =
    getARVideo();

  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (host) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }


  if (scene) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );

    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }


  if (video) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.muted = true;

  }


  if (canvas) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );

    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}


/* ==========================================================
   VIDEO / CANVAS SYNCHRONISIEREN
   ========================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();

  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (!video || !canvas) return;


  const rect =
    video.getBoundingClientRect();


  if (
    rect.width <= 0 ||
    rect.height <= 0
  ) return;


  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );

  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );

  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );

  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );

  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );

  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}


/* ==========================================================
   SMARTPHONE-KAMERA
   640 × 480 / 4:3
   ========================================================== */

async function optimizeMobileCamera() {

  if (
    cameraOptimized ||
    !arStarted
  ) return;


  if (!isMobileDevice()) {

    cameraOptimized = true;

    return;

  }


  const video =
    getARVideo();


  if (
    !video ||
    !video.srcObject
  ) return;


  const tracks =
    video.srcObject.getVideoTracks();


  if (!tracks.length) return;


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 640
      },

      height: {
        ideal: 480
      },

      aspectRatio: {
        ideal: 4 / 3
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }


  try {

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : null;


    if (
      capabilities &&
      capabilities.zoom
    ) {

      const desiredZoom =
        Math.max(
          capabilities.zoom.min,
          Math.min(
            1,
            capabilities.zoom.max
          )
        );


      await track.applyConstraints({

        advanced: [
          {
            zoom: desiredZoom
          }
        ]

      });

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized = true;

}


/* ==========================================================
   ORIENTIERUNGSWECHSEL
   ========================================================== */

function orientationChanged() {

  if (!arStarted) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (!isMobileDevice()) return;


  if (!isLandscape()) {

    const video =
      getARVideo();


    if (
      video &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    location.reload();

  }

}


/* ==========================================================
   EVENTS
   ========================================================== */

startButton.addEventListener(
  "click",
  startMobileAR
);


window.addEventListener(

  "orientationchange",

  function() {

    setTimeout(
      orientationChanged,
      250
    );

  }

);


window.addEventListener(

  "resize",

  function() {

    if (!arStarted) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);


/* ==========================================================
   START
   ========================================================== */

if (isMobileDevice()) {

  updateStartScreen();

}

else {

  createARScene();

}


/* ==========================================================
   LAUFENDE PFLEGE
   ========================================================== */

setInterval(

  function() {

    if (!arStarted) return;

    enforceLayers();
    optimizeMobileCamera();
    synchronizeVisualGeometry();

  },

  250

);

</script>
