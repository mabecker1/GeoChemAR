<script>


/* ==========================================================
   METHAN
   ========================================================== */

AFRAME.registerComponent("methane-model", {

  init: function () {

    const THREE = AFRAME.THREE;

    const group =
      new THREE.Group();


    const carbonRadius =
      0.22;

    const hydrogenRadius =
      0.14;

    const hydrogenDistance =
      0.72;

    const bondRadius =
      0.040;


    const carbonMaterial =
      new THREE.MeshStandardMaterial({

        color: 0x202020,
        roughness: 0.55,
        metalness: 0

      });


    const hydrogenMaterial =
      new THREE.MeshStandardMaterial({

        color: 0xffffff,
        roughness: 0.45,
        metalness: 0

      });


    const bondMaterial =
      new THREE.MeshStandardMaterial({

        color: 0xb8bec7,
        roughness: 0.50,
        metalness: 0

      });



    const carbonGeometry =
      new THREE.SphereGeometry(

        carbonRadius,
        48,
        32

      );


    const carbon =
      new THREE.Mesh(

        carbonGeometry,
        carbonMaterial

      );


    group.add(
      carbon
    );



    const hydrogenGeometry =
      new THREE.SphereGeometry(

        hydrogenRadius,
        40,
        28

      );


    const directions = [

      new THREE.Vector3(
        1,
        1,
        1
      ),

      new THREE.Vector3(
        1,
        -1,
        -1
      ),

      new THREE.Vector3(
        -1,
        1,
        -1
      ),

      new THREE.Vector3(
        -1,
        -1,
        1
      )

    ];


    directions.forEach(

      direction =>
        direction.normalize()

    );


    const yAxis =
      new THREE.Vector3(
        0,
        1,
        0
      );


    directions.forEach(
      function (direction) {


        const hydrogen =
          new THREE.Mesh(

            hydrogenGeometry,
            hydrogenMaterial

          );


        hydrogen.position.copy(

          direction
            .clone()
            .multiplyScalar(
              hydrogenDistance
            )

        );


        group.add(
          hydrogen
        );



        /*
         * Stab exakt zwischen den beiden
         * Kugeloberflächen.
         */

        const startDistance =
          carbonRadius;


        const endDistance =
          hydrogenDistance
          -
          hydrogenRadius;


        const startPoint =

          direction
            .clone()
            .multiplyScalar(
              startDistance
            );


        const endPoint =

          direction
            .clone()
            .multiplyScalar(
              endDistance
            );


        const bondVector =

          endPoint
            .clone()
            .sub(
              startPoint
            );


        const bondLength =
          bondVector.length();


        const bondGeometry =
          new THREE.CylinderGeometry(

            bondRadius,
            bondRadius,
            bondLength,
            32,
            1,
            false

          );


        const bond =
          new THREE.Mesh(

            bondGeometry,
            bondMaterial

          );


        bond.position.copy(

          startPoint
            .clone()
            .add(
              endPoint
            )
            .multiplyScalar(
              0.5
            )

        );


        bond.quaternion.setFromUnitVectors(

          yAxis,
          direction

        );


        group.add(
          bond
        );

      }
    );


    this.el.setObject3D(

      "methaneMesh",
      group

    );

  },


  remove: function () {

    this.el.removeObject3D(
      "methaneMesh"
    );

  }

});



/* ==========================================================
   GEMEINSAME WÜRFELPOSE
   ========================================================== */

AFRAME.registerComponent("cube-tracker", {

  init: function () {

    const THREE =
      AFRAME.THREE;


    this.markers = [];

    this.detected = [
      false,
      false,
      false,
      false,
      false,
      false
    ];


    this.activeMarker =
      -1;


    this.cubeMatrix =
      new THREE.Matrix4();


    this.tempMatrix =
      new THREE.Matrix4();


    this.inverseFaceMatrix =
      new THREE.Matrix4();


    /*
     * Abstand Markerfläche -> Würfelzentrum.
     *
     * AR.js verwendet die Markerbreite als Einheit.
     * Bei einem Würfel, dessen Seitenbreite der
     * Markerbreite entspricht, liegt das Zentrum
     * 0.5 Einheiten hinter der Markerfläche.
     */

    const h =
      0.5;



    /* ======================================================
       MARKER -> WÜRFEL

       Tatsächlicher gebauter Würfel:

                    0
                    |
              4 — 1 — 2 — 3
                    |
                    5

       Die Matrizen beschreiben die Pose jeder Markerfläche
       relativ zum gemeinsamen Würfelzentrum.
       ====================================================== */

    this.faceMatrices = [];


    function makeFaceMatrix(
      px,
      py,
      pz,
      rx,
      ry,
      rz
    ) {

      const position =
        new THREE.Vector3(
          px,
          py,
          pz
        );


      const euler =
        new THREE.Euler(

          THREE.MathUtils.degToRad(rx),

          THREE.MathUtils.degToRad(ry),

          THREE.MathUtils.degToRad(rz),

          "XYZ"

        );


      const quaternion =
        new THREE.Quaternion()
          .setFromEuler(
            euler
          );


      const scale =
        new THREE.Vector3(
          1,
          1,
          1
        );


      return new THREE.Matrix4()
        .compose(
          position,
          quaternion,
          scale
        );

    }



    /*
     * Marker 1 = Vorderseite
     *
     * Dies ist unser Referenzmarker.
     */

    this.faceMatrices[1] =
      makeFaceMatrix(
        0,
        0,
        h,
        0,
        0,
        0
      );


    /*
     * Marker 2 = rechte Seite
     */

    this.faceMatrices[2] =
      makeFaceMatrix(
        h,
        0,
        0,
        0,
        90,
        0
      );


    /*
     * Marker 3 = Rückseite
     */

    this.faceMatrices[3] =
      makeFaceMatrix(
        0,
        0,
        -h,
        0,
        180,
        0
      );


    /*
     * Marker 4 = linke Seite
     */

    this.faceMatrices[4] =
      makeFaceMatrix(
        -h,
        0,
        0,
        0,
        -90,
        0
      );


    /*
     * Marker 0 = Oberseite
     */

    this.faceMatrices[0] =
      makeFaceMatrix(
        0,
        h,
        0,
        -90,
        0,
        0
      );


    /*
     * Marker 5 = Unterseite
     */

    this.faceMatrices[5] =
      makeFaceMatrix(
        0,
        -h,
        0,
        90,
        0,
        0
      );



    /*
     * Marker suchen und echte Found/Lost-Ereignisse
     * speichern.
     */

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      const marker =
        document.getElementById(
          "marker" + i
        );


      this.markers[i] =
        marker;


      marker.addEventListener(

        "markerFound",

        () => {

          this.detected[i] =
            true;


          /*
           * Wenn bisher kein Marker aktiv war,
           * nehmen wir diesen.
           */

          if (
            this.activeMarker === -1
          ) {

            this.activeMarker =
              i;

          }

        }

      );


      marker.addEventListener(

        "markerLost",

        () => {

          this.detected[i] =
            false;


          /*
           * War dies unser aktiver Marker,
           * suchen wir einen anderen tatsächlich
           * sichtbaren Marker.
           */

          if (
            this.activeMarker === i
          ) {

            this.activeMarker =
              -1;


            for (
              let j = 0;
              j < 6;
              j++
            ) {

              if (
                this.detected[j]
              ) {

                this.activeMarker =
                  j;

                break;

              }

            }

          }

        }

      );

    }



    this.el.object3D.visible =
      false;

  },



  tick: function () {

    const THREE =
      AFRAME.THREE;


    if (
      this.activeMarker < 0
    ) {

      this.el.object3D.visible =
        false;

      return;

    }


    const marker =
      this.markers[
        this.activeMarker
      ];


    if (
      !marker
      ||
      !this.detected[
        this.activeMarker
      ]
    ) {

      this.el.object3D.visible =
        false;

      return;

    }



    /*
     * Marker-Weltmatrix aktualisieren.
     */

    marker.object3D
      .updateMatrixWorld(
        true
      );


    /*
     * faceMatrix:
     *
     * Würfelzentrum -> Markerfläche
     *
     * Gesucht:
     *
     * Markerfläche -> Würfelzentrum
     *
     * Deshalb inverse Matrix.
     */

    this.inverseFaceMatrix
      .copy(

        this.faceMatrices[
          this.activeMarker
        ]

      )
      .invert();



    /*
     * Welt -> Marker
     * kombiniert mit
     * Marker -> Würfelzentrum
     *
     * ergibt die Pose des Würfelzentrums.
     */

    this.cubeMatrix
      .multiplyMatrices(

        marker.object3D.matrixWorld,

        this.inverseFaceMatrix

      );



    /*
     * Da das gemeinsame Molekül direkt in der Szene
     * liegt, können wir die Matrix zerlegen.
     */

    this.cubeMatrix.decompose(

      this.el.object3D.position,

      this.el.object3D.quaternion,

      this.el.object3D.scale

    );


    this.el.object3D.visible =
      true;

  }

});



/* ==========================================================
   HAUPTPROGRAMM
   ========================================================== */

const sceneHost =
  document.getElementById(
    "sceneHost"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const rotateIcon =
  document.getElementById(
    "rotateIcon"
  );


const startTitle =
  document.getElementById(
    "startTitle"
  );


const startText =
  document.getElementById(
    "startText"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


let arStarted =
  false;


let cameraOptimized =
  false;



function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}



function isLandscape() {

  return (

    window.innerWidth
    >
    window.innerHeight

  );

}



function updateStartScreen() {

  if (
    !isMobileDevice()
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (
    arStarted
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (
    !isLandscape()
  ) {

    rotateIcon.style.display =
      "block";


    startTitle.textContent =
      "Bitte Smartphone drehen";


    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";


    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";


    startTitle.textContent =
      "GeoChemAR";


    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";


    startButton.style.display =
      "block";

  }

}



/* ==========================================================
   AR-SZENE
   ========================================================== */

    arStarted
  ) {

    return;

  }


  arStarted =
    true;


  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
      "

    >


      <!-- ============================================
           Die sechs Marker enthalten jetzt KEINE
           Moleküle mehr.
           ============================================ -->

      <a-marker
        id="marker0"
        type="barcode"
        value="0"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker1"
        type="barcode"
        value="1"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker2"
        type="barcode"
        value="2"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker3"
        type="barcode"
        value="3"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker4"
        type="barcode"
        value="4"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker5"
        type="barcode"
        value="5"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>



      <!-- ============================================
           EIN gemeinsames Würfelobjekt
           ============================================ -->

      <a-entity
        id="cubeRoot"
        cube-tracker
      >

        <!--
          Molekül oberhalb des Würfels.

          Das Würfelzentrum ist der Ursprung.
          Die Oberseite liegt bei y = 0.5.

          0.55 zusätzliche Einheiten ergeben ungefähr
          denselben Abstand zur Oberfläche wie bisher.
        -->

        <a-entity

          id="methane"

          position="0 1.05 0"

          methane-model

        >
        </a-entity>

      </a-entity>



      <a-entity

        light="
          type: ambient;
          intensity: 1.0;
          color: #ffffff;
        "

      >
      </a-entity>


      <a-entity

        light="
          type: directional;
          intensity: 0.8;
          color: #ffffff;
        "

        position="1 2 1"

      >
      </a-entity>


      <a-entity camera></a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );

}



/* ==========================================================
   MOBILER START
   ========================================================== */

async function startMobileAR() {

  if (
    !isLandscape()
  ) {

    updateStartScreen();

    return;

  }


  try {

    const element =
      document.documentElement;


    if (
      element.requestFullscreen
    ) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }


  try {

    if (

      screen.orientation
      &&
      screen.orientation.lock

    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }


  setTimeout(

    createARScene,

    400

  );

}



/* ==========================================================
   AR-VIDEO
   ========================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ==========================================================
   EBENEN
   ========================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );


  const scene =
    document.getElementById(
      "arScene"
    );


  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (
    host
  ) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );


    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }


  if (
    scene
  ) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );


    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );


    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );


    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }


  if (
    video
  ) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );


    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );


    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );


    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );


    video.setAttribute(
      "playsinline",
      ""
    );


    video.setAttribute(
      "webkit-playsinline",
      ""
    );


    video.muted =
      true;

  }


  if (
    canvas
  ) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );


    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );


    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );


    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );


    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );


    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ==========================================================
   VIDEO / CANVAS SYNCHRONISIEREN
   ========================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (
    !video
    ||
    !canvas
  ) {

    return;

  }


  const rect =
    video.getBoundingClientRect();


  if (
    rect.width <= 0
    ||
    rect.height <= 0
  ) {

    return;

  }


  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );


  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );


  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );


  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );


  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );


  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}



/* ==========================================================
   MOBILE KAMERAOPTIMIERUNG
   ========================================================== */

async function optimizeMobileCamera() {

  if (
    cameraOptimized
  ) {

    return;

  }


  if (
    !arStarted
  ) {

    return;

  }


  if (
    !isMobileDevice()
  ) {

    cameraOptimized =
      true;

    return;

  }


  const video =
    getARVideo();


  if (
    !video
  ) {

    return;

  }


  const stream =
    video.srcObject;


  if (
    !stream
  ) {

    return;

  }


  const tracks =
    stream.getVideoTracks();


  if (
    !tracks.length
  ) {

    return;

  }


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }


  try {

    if (

      track.getCapabilities
      &&
      track.applyConstraints

    ) {

      const capabilities =
        track.getCapabilities();


      if (

        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined

      ) {

        const desiredZoom =

          Math.max(

            capabilities.zoom.min,

            Math.min(
              1,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized =
    true;

}



/* ==========================================================
   ORIENTIERUNGSWECHSEL
   ========================================================== */

function orientationChanged() {

  if (
    !arStarted
  ) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (
    !isMobileDevice()
  ) {

    return;

  }


  if (
    !isLandscape()
  ) {

    const video =
      getARVideo();


    if (

      video
      &&
      video.srcObject

    ) {

      video.srcObject
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );

    }


    location.reload();

  }

}



/* ==========================================================
   EVENTS
   ========================================================== */

startButton.addEventListener(

  "click",

  startMobileAR

);


window.addEventListener(

  "orientationchange",

  function () {

    setTimeout(

      orientationChanged,

      250

    );

  }

);


window.addEventListener(

  "resize",

  function () {

    if (
      !arStarted
    ) {

      setTimeout(

        updateStartScreen,

        150

      );

    }

  }

);



/* ==========================================================
   START
   ========================================================== */

if (
  isMobileDevice()
) {

  updateStartScreen();

}

else {

  createARScene();

}



/* ==========================================================
   LAUFENDE PFLEGE
   ========================================================== */

setInterval(

  function () {

    if (
      !arStarted
    ) {

      return;

    }


    enforceLayers();

    optimizeMobileCamera();

    synchronizeVisualGeometry();

  },

  250

);


</script>

</body>

</html>
