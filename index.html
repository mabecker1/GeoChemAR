<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>GeoChemAR – Würfel ID-Test</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
  z-index: 1;
}

#overlay {
  position: fixed;
  z-index: 2;
  pointer-events: none;
}

#analysisCanvas {
  display: none;
}

#status {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;

  padding: 10px 14px;
  border-radius: 8px;

  background: rgba(0,0,0,0.82);
  color: white;

  font-size: 15px;
  line-height: 1.5;
  white-space: pre-line;

  pointer-events: none;
}

#error {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 20;

  padding: 10px;
  border-radius: 8px;

  background: rgba(160,0,0,0.92);
  color: white;

  font-size: 13px;
  white-space: pre-wrap;

  display: none;
}

</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<canvas
  id="analysisCanvas"
  width="640"
  height="480"
></canvas>

<canvas
  id="overlay"
  width="640"
  height="480"
></canvas>

<div id="status">
Initialisierung …
</div>

<div id="error"></div>


<script type="module">

import * as Comlink
  from "https://unpkg.com/comlink/dist/esm/comlink.mjs";


/* =====================================================
   KONSTANTEN
   ===================================================== */

const WIDTH = 640;
const HEIGHT = 480;


/* =====================================================
   DOM
   ===================================================== */

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById("analysisCanvas");

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const overlay =
  document.getElementById("overlay");

const overlayCtx =
  overlay.getContext("2d");

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


/* =====================================================
   STATUS
   ===================================================== */

let apriltag =
  null;

let detectorReady =
  false;

let cameraReady =
  false;

let detectionRunning =
  false;

let latestDetections =
  [];

let detectionCounter =
  0;

let detectionFPS =
  0;

let fpsStart =
  performance.now();


/* =====================================================
   FEHLER
   ===================================================== */

function showError(error) {

  console.error(error);

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error?.stack ||
      String(error)
    );

}


/* =====================================================
   APRILTAG
   ===================================================== */

async function initializeAprilTag() {

  const worker =
    new Worker(
      "./libs/apriltag.js"
    );


  const Apriltag =
    Comlink.wrap(worker);


  apriltag =
    await new Apriltag(

      Comlink.proxy(
        function() {

          detectorReady =
            true;

        }
      )

    );


  const start =
    performance.now();


  while (!detectorReady) {

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          20
        )
    );


    if (
      performance.now() -
      start >
      15000
    ) {

      throw new Error(
        "AprilTag-WASM wurde nicht bereit."
      );

    }

  }


  /*
   * Für diesen Test benötigen wir
   * ausschließlich ID + Ecken.
   */

  await apriltag.set_return_pose(
    0
  );


  /*
   * Bis zu sechs Würfelseiten dürfen
   * gleichzeitig erkannt werden.
   */

  await apriltag.set_max_detections(
    6
  );

}


/* =====================================================
   KAMERA
   ===================================================== */

async function startCamera() {

  const stream =
    await navigator.mediaDevices
      .getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: WIDTH
          },

          height: {
            ideal: HEIGHT
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        }

      });


  video.srcObject =
    stream;


  await new Promise(
    resolve => {

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        resolve();

      }

      else {

        video.addEventListener(
          "loadedmetadata",
          resolve,
          {
            once: true
          }
        );

      }

    }
  );


  await video.play();


  cameraReady =
    true;

}


/* =====================================================
   GRAUSTUFENBILD
   ===================================================== */

function createGrayscaleImage() {

  analysisCtx.drawImage(
    video,
    0,
    0,
    WIDTH,
    HEIGHT
  );


  const imageData =
    analysisCtx.getImageData(
      0,
      0,
      WIDTH,
      HEIGHT
    );


  const rgba =
    imageData.data;


  const grayscale =
    new Uint8Array(
      WIDTH * HEIGHT
    );


  for (
    let i = 0, j = 0;
    i < rgba.length;
    i += 4, j++
  ) {

    grayscale[j] =
      Math.round(
        (
          rgba[i] +
          rgba[i + 1] +
          rgba[i + 2]
        ) / 3
      );

  }


  return grayscale;

}


/* =====================================================
   DETEKTION
   ===================================================== */

async function detectFrame() {

  if (
    !detectorReady ||
    !cameraReady ||
    detectionRunning
  ) {

    return;

  }


  detectionRunning =
    true;


  try {

    const grayscale =
      createGrayscaleImage();


    const result =
      await apriltag.detect(
        grayscale,
        WIDTH,
        HEIGHT
      );


    latestDetections =
      Array.isArray(result)
        ? result
        : [];


    detectionCounter++;


    const now =
      performance.now();


    if (
      now -
      fpsStart >=
      1000
    ) {

      const seconds =
        (
          now -
          fpsStart
        ) / 1000;


      detectionFPS =
        detectionCounter /
        seconds;


      detectionCounter =
        0;


      fpsStart =
        now;

    }

  }

  catch(error) {

    showError(error);

  }

  finally {

    detectionRunning =
      false;

  }

}


/* =====================================================
   HILFSFUNKTIONEN FÜR KOORDINATEN
   ===================================================== */

function getPoint(point) {

  if (!point) {
    return null;
  }


  if (Array.isArray(point)) {

    const x =
      Number(point[0]);

    const y =
      Number(point[1]);


    if (
      Number.isFinite(x) &&
      Number.isFinite(y)
    ) {

      return {
        x,
        y
      };

    }

  }


  const x =
    Number(point.x);

  const y =
    Number(point.y);


  if (
    Number.isFinite(x) &&
    Number.isFinite(y)
  ) {

    return {
      x,
      y
    };

  }


  return null;

}


/* =====================================================
   OVERLAY
   ===================================================== */

function drawDetections() {

  overlayCtx.clearRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  for (
    const detection
    of latestDetections
  ) {

    const id =
      Number(detection.id);


    const center =
      getPoint(
        detection.center
      );


    /*
     * Tag-Umrandung zeichnen.
     */

    if (
      Array.isArray(
        detection.corners
      ) &&
      detection.corners.length >= 4
    ) {

      const corners =
        detection.corners
          .map(getPoint)
          .filter(Boolean);


      if (
        corners.length >= 4
      ) {

        overlayCtx.beginPath();


        overlayCtx.moveTo(
          corners[0].x,
          corners[0].y
        );


        for (
          let i = 1;
          i < corners.length;
          i++
        ) {

          overlayCtx.lineTo(
            corners[i].x,
            corners[i].y
          );

        }


        overlayCtx.closePath();


        overlayCtx.lineWidth =
          4;


        overlayCtx.strokeStyle =
          "#00ff00";


        overlayCtx.stroke();

      }

    }


    /*
     * ID direkt auf den Tag schreiben.
     */

    if (center) {

      const text =
        "ID " + id;


      overlayCtx.font =
        "bold 30px Arial";


      overlayCtx.textAlign =
        "center";


      overlayCtx.textBaseline =
        "middle";


      /*
       * Schwarzer Hintergrund für
       * gute Lesbarkeit.
       */

      const metrics =
        overlayCtx.measureText(
          text
        );


      const boxWidth =
        metrics.width + 20;


      const boxHeight =
        42;


      overlayCtx.fillStyle =
        "rgba(0,0,0,0.75)";


      overlayCtx.fillRect(

        center.x -
        boxWidth / 2,

        center.y -
        boxHeight / 2,

        boxWidth,

        boxHeight

      );


      overlayCtx.fillStyle =
        "#00ff00";


      overlayCtx.fillText(
        text,
        center.x,
        center.y
      );

    }

  }

}


/* =====================================================
   VIDEO / OVERLAY SYNCHRONISIEREN
   ===================================================== */

function resize() {

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  const videoAspect =
    WIDTH / HEIGHT;

  const screenAspect =
    screenWidth /
    screenHeight;


  let displayWidth;
  let displayHeight;


  if (
    screenAspect >
    videoAspect
  ) {

    displayHeight =
      screenHeight;

    displayWidth =
      displayHeight *
      videoAspect;

  }

  else {

    displayWidth =
      screenWidth;

    displayHeight =
      displayWidth /
      videoAspect;

  }


  const left =
    (
      screenWidth -
      displayWidth
    ) / 2;


  const top =
    (
      screenHeight -
      displayHeight
    ) / 2;


  overlay.style.width =
    displayWidth + "px";

  overlay.style.height =
    displayHeight + "px";

  overlay.style.left =
    left + "px";

  overlay.style.top =
    top + "px";

}


window.addEventListener(
  "resize",
  resize
);


resize();


/* =====================================================
   LOOP
   ===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  if (!detectionRunning) {

    detectFrame();

  }


  drawDetections();


  const ids =
    latestDetections
      .map(
        detection =>
          Number(detection.id)
      )
      .filter(
        Number.isFinite
      )
      .sort(
        (a, b) =>
          a - b
      );


  status.textContent =

    "APRILTAG 5c-0 – WÜRFEL-ID-TEST\n\n" +

    "Sichtbare IDs: " +
    (
      ids.length > 0
        ? ids.join(", ")
        : "keine"
    ) +

    "\nErkennungen/s: " +
    detectionFPS.toFixed(1);

}


/* =====================================================
   START
   ===================================================== */

async function start() {

  try {

    await initializeAprilTag();


    status.textContent =
      "Kamera wird gestartet …";


    await startCamera();


    requestAnimationFrame(
      animate
    );

  }

  catch(error) {

    showError(error);

  }

}


start();

</script>

</body>
</html>
