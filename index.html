<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>GeoChemAR – Smartphone-Test</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100dvh !important;
    }

    #status {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 8px;
      right: 8px;

      z-index: 99999;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.72);
      color: white;

      font-size: 11px;
      line-height: 1.25;

      border-radius: 7px;

      white-space: normal;
      overflow-wrap: anywhere;

      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="status">
  GeoChemAR startet …
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="antialias: true; alpha: true;"
  arjs="
    sourceType: webcam;
    sourceWidth: 1280;
    sourceHeight: 720;
    displayWidth: 1280;
    displayHeight: 720;
    debugUIEnabled: false;
    detectionMode: mono;
  "
>

  <a-marker
    preset="hiro"
    smooth="true"
    smoothCount="5"
    smoothTolerance="0.01"
    smoothThreshold="2"
  >

    <a-box
      position="0 0.5 0"
      scale="0.6 0.6 0.6"
      material="color: #2563eb; opacity: 0.8; transparent: true;"
    ></a-box>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>

const status = document.getElementById("status");

function updateStatus() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  const scene = document.querySelector("a-scene");

  let text = "";

  text += "A-Frame: ";
  text += window.AFRAME ? "OK" : "FEHLT";

  text += " | Szene: ";
  text += scene && scene.hasLoaded ? "geladen" : "lädt";

  text += " | Display: ";
  text += window.innerWidth + "×" + window.innerHeight;

  if (video) {

    text += " | Kamera: ";
    text += video.videoWidth + "×" + video.videoHeight;

    text += " | readyState: ";
    text += video.readyState;

  } else {

    text += " | Kamera: nicht gefunden";

  }

  status.textContent = text;
}

setInterval(updateStatus, 1000);

</script>

</body>
</html>
