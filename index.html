<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR</title>

  <!-- Lokale Bibliotheken -->
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

      font-family: Arial, sans-serif;
    }


    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }


    #arjs-video {
      z-index: 0 !important;

      visibility: visible !important;
      opacity: 1 !important;
    }


    canvas.a-canvas {
      z-index: 1 !important;
      background: transparent !important;
    }


    #status {
      position: fixed;

      top: 6px;
      left: 6px;
      right: 6px;

      z-index: 100000;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.76);

      color: white;

      font-size: 10px;
      line-height: 1.3;

      border-radius: 6px;

      pointer-events: none;
    }


    #rotateMessage {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 200000;

      align-items: center;
      justify-content: center;

      padding: 30px;

      box-sizing: border-box;

      background: #111;
      color: white;

      text-align: center;
    }


    #rotateMessage strong {
      display: block;

      margin-bottom: 10px;

      font-size: 22px;
    }


    /*
      Nur auf kleinen Geräten zeigen wir
      den Querformat-Hinweis.
      Am Computer gibt es diesen Hinweis nicht.
    */
    @media
      (orientation: portrait)
      and (max-width: 900px) {

      #rotateMessage {
        display: flex;
      }

      #status {
        display: none;
      }

    }

  </style>

</head>


<body>


  <div id="rotateMessage">
    <div>

      <strong>
        Bitte Smartphone drehen
      </strong>

      GeoChemAR wird auf mobilen Geräten
      im Querformat verwendet.

    </div>
  </div>


  <div id="status">
    GeoChemAR startet …
  </div>



  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    renderer="
      alpha: true;
      antialias: true;
    "

    arjs="
      sourceType: webcam;
      sourceWidth: 640;
      sourceHeight: 480;
      debugUIEnabled: false;
      detectionMode: mono;
    "

  >


    <a-marker

      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"

    >


      <a-box

        position="0 0.3 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
          side: double;
        "

      >
      </a-box>


    </a-marker>


    <a-entity camera></a-entity>


  </a-scene>



<script>

const status =
  document.getElementById("status");


let cameraOptimized = false;


/*
  ----------------------------------------------------
  Prüfen, ob wir vermutlich auf einem Mobilgerät sind
  ----------------------------------------------------
*/

function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        window.screen.width,
        window.screen.height
      ) < 1000
    )

  );

}



/*
  ----------------------------------------------------
  AR.js-Videoelement finden
  ----------------------------------------------------
*/

function getARVideo() {

  return (

    document.getElementById("arjs-video")
    ||
    document.querySelector("video")

  );

}



/*
  ----------------------------------------------------
  Sichtbarkeit absichern

  WICHTIG:
  Keine Größenänderung.
  Keine Änderung der Projektion.
  ----------------------------------------------------
*/

function keepVideoVisible() {

  const video = getARVideo();

  if (!video) {
    return;
  }


  video.style.setProperty(
    "visibility",
    "visible",
    "important"
  );

  video.style.setProperty(
    "opacity",
    "1",
    "important"
  );

  video.style.setProperty(
    "z-index",
    "0",
    "important"
  );


  video.setAttribute(
    "playsinline",
    ""
  );

  video.setAttribute(
    "webkit-playsinline",
    ""
  );


  video.muted = true;


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (canvas) {

    canvas.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/*
  ----------------------------------------------------
  Smartphone-Kamera optimieren

  AR.js hat die Kamera bereits geöffnet.

  Wir greifen anschließend auf den
  tatsächlich verwendeten Video-Track zu
  und bitten den Browser um bessere
  Einstellungen.

  Am Computer lassen wir die Webcam
  praktisch unangetastet.
  ----------------------------------------------------
*/

async function optimizeMobileCamera() {

  if (cameraOptimized) {
    return;
  }


  if (!isMobileDevice()) {

    cameraOptimized = true;

    console.log(
      "GeoChemAR: Desktop – Webcam unverändert."
    );

    return;

  }


  const video = getARVideo();


  if (!video) {
    return;
  }


  const stream =
    video.srcObject;


  if (!stream) {
    return;
  }


  const tracks =
    stream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  const track =
    tracks[0];


  /*
    Erst einmal versuchen wir NICHT,
    eine andere Kamera zu öffnen.

    Wir verbessern zunächst die aktuelle
    Rückkamera.

    Dadurch bleibt AR.js vollständig
    mit seinem vorhandenen Stream verbunden.
  */

  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Auflösungs-Constraints nicht übernommen:",
      error
    );

  }


  /*
    Falls die Kamera Zoom unterstützt,
    versuchen wir explizit Zoom 1×.

    Nicht alle Browser unterstützen das.
  */

  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        let desiredZoom = 1;


        /*
          Falls 1 außerhalb des möglichen
          Bereichs liegt, nehmen wir den
          kleinsten möglichen Wert.
        */

        desiredZoom =
          Math.max(
            capabilities.zoom.min,
            Math.min(
              desiredZoom,
              capabilities.zoom.max
            )
          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht gesetzt werden:",
      error
    );

  }


  cameraOptimized = true;

}



/*
  ----------------------------------------------------
  Diagnose
  ----------------------------------------------------
*/

function updateStatus() {

  const video = getARVideo();


  let text =

    isMobileDevice()

    ? "Mobil"

    : "Computer";


  text +=

    " | Fenster "
    +
    window.innerWidth
    +
    "×"
    +
    window.innerHeight;


  if (!video) {

    text +=
      " | Kamera wird initialisiert …";

    status.textContent =
      text;

    return;

  }


  text +=

    " | Video "
    +
    video.videoWidth
    +
    "×"
    +
    video.videoHeight;


  const stream =
    video.srcObject;


  if (
    stream
    &&
    stream.getVideoTracks
  ) {

    const tracks =
      stream.getVideoTracks();


    if (tracks.length) {

      const track =
        tracks[0];


      if (track.getSettings) {

        const settings =
          track.getSettings();


        if (
          settings.width
          &&
          settings.height
        ) {

          text +=

            " | Stream "
            +
            settings.width
            +
            "×"
            +
            settings.height;

        }


        if (settings.frameRate) {

          text +=

            " @ "
            +
            Math.round(
              settings.frameRate
            )
            +
            "fps";

        }


        if (settings.facingMode) {

          text +=

            " | "
            +
            settings.facingMode;

        }


        if (
          settings.zoom !== undefined
        ) {

          text +=

            " | Zoom "
            +
            settings.zoom;

        }

      }


      if (track.label) {

        text +=

          " | "
          +
          track.label;

      }

    }

  }


  status.textContent =
    text;

}



/*
  ----------------------------------------------------
  Regelmäßige Initialisierung

  AR.js erzeugt das Video erst etwas
  nach dem Laden der Seite.
  ----------------------------------------------------
*/

setInterval(

  function () {

    keepVideoVisible();

    optimizeMobileCamera();

    updateStatus();

  },

  500

);

</script>


</body>

</html>
