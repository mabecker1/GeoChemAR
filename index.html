<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GeoChemAR – MultiMarker API-Test</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0,0,0,0.78);
      color: white;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
      white-space: pre-line;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 9999;
      padding: 10px;
      background: rgba(150,0,0,0.9);
      color: white;
      font-size: 13px;
      white-space: pre-wrap;
      display: none;
    }

    canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 2 !important;
    }

    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
  </style>
</head>

<body>

<div id="status">1 – HTML geladen</div>
<div id="error"></div>


<script>
  window.addEventListener("error", function(event) {
    const box = document.getElementById("error");

    box.style.display = "block";

    box.textContent =
      "JavaScript-Fehler:\n" +
      event.message +
      "\n" +
      event.filename +
      "\nZeile " +
      event.lineno;
  });

  window.addEventListener("unhandledrejection", function(event) {
    const box = document.getElementById("error");

    box.style.display = "block";

    box.textContent =
      "Promise-Fehler:\n" +
      String(event.reason);
  });
</script>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js",
    "threex": "./libs/ar-threex.mjs"
  }
}
</script>


<script type="module">

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


function setStatus(text) {
  status.textContent = text;
}


function showError(error) {
  console.error(error);

  errorBox.style.display = "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error && error.stack
        ? error.stack
        : String(error)
    );
}


try {

  /* =====================================================
     1. MODULE
     ===================================================== */

  setStatus(
    "2 – Three.js wird geladen …"
  );

  const THREE =
    await import("three");

  setStatus(
    "3 – Three.js geladen"
  );

  const THREEX =
    await import("threex");

  setStatus(
    "4 – AR.js geladen"
  );


  const {
    ArToolkitSource,
    ArToolkitContext,
    ArMarkerControls
  } = THREEX;



  /* =====================================================
     2. THREE.JS
     ===================================================== */

  const scene =
    new THREE.Scene();


  const camera =
    new THREE.Camera();

  scene.add(camera);


  const renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });


  renderer.setClearColor(
    0x000000,
    0
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.domElement.style.position =
    "fixed";

  renderer.domElement.style.top =
    "0px";

  renderer.domElement.style.left =
    "0px";

  renderer.domElement.style.zIndex =
    "2";


  document.body.appendChild(
    renderer.domElement
  );



  /* =====================================================
     3. MARKER ROOT
     ===================================================== */

  const markerRoot =
    new THREE.Group();

  markerRoot.visible =
    false;

  scene.add(
    markerRoot
  );



  /* =====================================================
     4. METHAN
     ===================================================== */

  const methane =
    new THREE.Group();


  const carbonRadius =
    0.22;

  const hydrogenRadius =
    0.14;

  const hydrogenDistance =
    0.72;

  const bondRadius =
    0.040;


  const carbonMaterial =
    new THREE.MeshBasicMaterial({
      color: 0x202020
    });


  const hydrogenMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xffffff
    });


  const bondMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xb8bec7
    });



  /* Kohlenstoff */

  const carbon =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        carbonRadius,
        48,
        32
      ),

      carbonMaterial

    );


  methane.add(
    carbon
  );



  /* Exakte Tetraederrichtungen */

  const directions = [

    new THREE.Vector3(
      1,
      1,
      1
    ).normalize(),

    new THREE.Vector3(
      1,
      -1,
      -1
    ).normalize(),

    new THREE.Vector3(
      -1,
      1,
      -1
    ).normalize(),

    new THREE.Vector3(
      -1,
      -1,
      1
    ).normalize()

  ];



  directions.forEach(
    function(direction) {

      /* Wasserstoff */

      const hydrogen =
        new THREE.Mesh(

          new THREE.SphereGeometry(
            hydrogenRadius,
            40,
            28
          ),

          hydrogenMaterial

        );


      hydrogen.position.copy(

        direction
          .clone()
          .multiplyScalar(
            hydrogenDistance
          )

      );


      methane.add(
        hydrogen
      );



      /* Bindung */

      const startDistance =
        carbonRadius;


      const endDistance =
        hydrogenDistance -
        hydrogenRadius;


      const startPoint =
        direction
          .clone()
          .multiplyScalar(
            startDistance
          );


      const endPoint =
        direction
          .clone()
          .multiplyScalar(
            endDistance
          );


      const bondVector =
        endPoint
          .clone()
          .sub(
            startPoint
          );


      const bondLength =
        bondVector.length();


      const bondGeometry =
        new THREE.CylinderGeometry(
          bondRadius,
          bondRadius,
          bondLength,
          32,
          1,
          false
        );


      const bond =
        new THREE.Mesh(
          bondGeometry,
          bondMaterial
        );


      bond.position.copy(

        startPoint
          .clone()
          .add(
            endPoint
          )
          .multiplyScalar(
            0.5
          )

      );


      bond.quaternion.setFromUnitVectors(

        new THREE.Vector3(
          0,
          1,
          0
        ),

        direction

      );


      methane.add(
        bond
      );

    }
  );



  methane.position.set(
    0,
    0.75,
    0
  );


  markerRoot.add(
    methane
  );



  /* =====================================================
     5. KAMERA
     ===================================================== */

  const arToolkitSource =
    new ArToolkitSource({

      sourceType:
        "webcam",

      sourceWidth:
        640,

      sourceHeight:
        480,

      displayWidth:
        640,

      displayHeight:
        480

    });


  setStatus(
    "5 – Kamera wird angefordert …"
  );


  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitSource.init(
          function() {
            resolve();
          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  const video =
    arToolkitSource.domElement;


  if (!video) {

    throw new Error(
      "AR.js hat kein Videoelement erzeugt."
    );

  }


  video.setAttribute(
    "playsinline",
    ""
  );

  video.muted =
    true;


  video.style.position =
    "fixed";

  video.style.top =
    "0px";

  video.style.left =
    "0px";

  video.style.zIndex =
    "1";

  video.style.visibility =
    "visible";

  video.style.opacity =
    "1";



  /* =====================================================
     6. AUF ECHTES VIDEOBILD WARTEN
     ===================================================== */

  if (
    video.readyState < 2 ||
    video.videoWidth === 0
  ) {

    setStatus(
      "6 – Kamera geöffnet, warte auf Videobild …"
    );


    await new Promise(
      (resolve, reject) => {

        const timeout =
          setTimeout(
            function() {

              reject(
                new Error(
                  "Die Kamera liefert nach 10 Sekunden noch kein Videobild."
                )
              );

            },
            10000
          );


        function videoReady() {

          if (
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {

            clearTimeout(
              timeout
            );


            video.removeEventListener(
              "canplay",
              videoReady
            );


            video.removeEventListener(
              "loadedmetadata",
              videoReady
            );


            resolve();

          }

        }


        video.addEventListener(
          "canplay",
          videoReady
        );


        video.addEventListener(
          "loadedmetadata",
          videoReady
        );


        videoReady();

      }
    );

  }



  /* =====================================================
     7. BEWÄHRTE 640×480 / 30 FPS
     ===================================================== */

  try {

    const stream =
      video.srcObject;


    if (stream) {

      const tracks =
        stream.getVideoTracks();


      if (tracks.length > 0) {

        await tracks[0].applyConstraints({

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        });

      }

    }

  }

  catch(error) {

    console.warn(
      "Kamera-Constraints:",
      error
    );

  }



  /* =====================================================
     8. ARTOOLKIT
     ===================================================== */

  setStatus(
    "7 – ARToolKit wird initialisiert …"
  );


  const arToolkitContext =
    new ArToolkitContext({

      cameraParametersUrl:
        "https://raw.githack.com/AR-js-org/AR.js/3.4.8/data/data/camera_para.dat",

      detectionMode:
        "mono_and_matrix",

      matrixCodeType:
        "3x3_HAMMING63",

      maxDetectionRate:
        30,

      canvasWidth:
        640,

      canvasHeight:
        480

    });



  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitContext.init(
          function() {

            try {

              camera
                .projectionMatrix
                .copy(
                  arToolkitContext
                    .getProjectionMatrix()
                );


              resolve();

            }

            catch(error) {
              reject(error);
            }

          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  /* =====================================================
     9. MULTIMARKER-API DIAGNOSE
     ===================================================== */

  const controller =
    arToolkitContext.arController;


  if (!controller) {

    throw new Error(
      "arToolkitContext.arController ist nicht vorhanden."
    );

  }


  const hasLoadMultiMarker =
    typeof controller.loadMultiMarker ===
    "function";


  const hasGetMultiMarkerCount =
    typeof controller.getMultiMarkerCount ===
    "function";


  const hasGetMultiMarkerPatternCount =
    typeof controller.getMultiMarkerPatternCount ===
    "function";


  const apiText =

    "MultiMarker-API:\n" +

    "loadMultiMarker: " +
    (
      hasLoadMultiMarker
        ? "JA"
        : "NEIN"
    ) +

    "\ngetMultiMarkerCount: " +
    (
      hasGetMultiMarkerCount
        ? "JA"
        : "NEIN"
    ) +

    "\ngetMultiMarkerPatternCount: " +
    (
      hasGetMultiMarkerPatternCount
        ? "JA"
        : "NEIN"
    );


  console.log(
    apiText
  );



  /* =====================================================
     10. MARKER 1 – UNVERÄNDERT
     ===================================================== */

  const markerControls =
    new ArMarkerControls(

      arToolkitContext,

      markerRoot,

      {

        type:
          "barcode",

        barcodeValue:
          1,

        size:
          1,

        changeMatrixMode:
          "modelViewMatrix"

      }

    );



  /* =====================================================
     11. RESIZE
     ===================================================== */

  function onResize() {

    arToolkitSource
      .onResizeElement();


    arToolkitSource
      .copyElementSizeTo(
        renderer.domElement
      );


    if (
      arToolkitContext &&
      arToolkitContext.arController
    ) {

      arToolkitSource
        .copyElementSizeTo(
          arToolkitContext
            .arController
            .canvas
        );

    }

  }


  window.addEventListener(
    "resize",
    onResize
  );


  onResize();


  video.style.zIndex =
    "1";

  renderer.domElement.style.zIndex =
    "2";



  /* =====================================================
     12. STATUS
     ===================================================== */

  setStatus(
    "API-Test abgeschlossen\n\n" +
    apiText +
    "\n\nMarker 1 zeigen"
  );



  /* =====================================================
     13. RENDER LOOP
     ===================================================== */

  let previousVisible =
    false;


  function animate() {

    requestAnimationFrame(
      animate
    );


    if (
      arToolkitSource.ready
    ) {

      arToolkitContext.update(
        arToolkitSource.domElement
      );

    }


    if (
      markerRoot.visible !==
      previousVisible
    ) {

      previousVisible =
        markerRoot.visible;


      if (
        markerRoot.visible
      ) {

        setStatus(
          "Marker 1 erkannt – Methan\n\n" +
          apiText
        );

      }

      else {

        setStatus(
          "Marker 1 nicht sichtbar\n\n" +
          apiText
        );

      }

    }


    renderer.render(
      scene,
      camera
    );

  }


  animate();

}

catch(error) {

  showError(error);

}

</script>

</body>
</html>
