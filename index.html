<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GeoChemAR – Phase 1</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js: Marker-Tracking-Version -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .info {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;

      z-index: 10;

      padding: 10px;

      background: rgba(0, 0, 0, 0.65);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 14px;

      border-radius: 8px;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="info">
    Kamera auf den Hiro-Marker richten
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true;"
    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      trackingMethod: best;
    "
  >

    <!-- Hiro-Testmarker -->
    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- Testobjekt -->
      <a-box
        position="0 0.5 0"
        rotation="0 0 0"
        width="0.7"
        height="0.7"
        depth="0.7"
        material="
          color: #2563EB;
          opacity: 0.85;
          transparent: true;
        "
      >
      </a-box>

    </a-marker>

    <!-- Kamera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
