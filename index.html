/* ==========================================================
   METHAN
   ========================================================== */

AFRAME.registerComponent("methane-model", {

  init: function () {

    const THREE =
      AFRAME.THREE;


    const group =
      new THREE.Group();


    const carbonRadius =
      0.22;

    const hydrogenRadius =
      0.14;

    const hydrogenDistance =
      0.72;

    const bondRadius =
      0.040;


    const carbonMaterial =
      new THREE.MeshStandardMaterial({

        color: 0x202020,
        roughness: 0.55,
        metalness: 0

      });


    const hydrogenMaterial =
      new THREE.MeshStandardMaterial({

        color: 0xffffff,
        roughness: 0.45,
        metalness: 0

      });


    const bondMaterial =
      new THREE.MeshStandardMaterial({

        color: 0xb8bec7,
        roughness: 0.50,
        metalness: 0

      });



    const carbonGeometry =
      new THREE.SphereGeometry(

        carbonRadius,
        48,
        32

      );


    const carbon =
      new THREE.Mesh(

        carbonGeometry,
        carbonMaterial

      );


    group.add(
      carbon
    );



    const hydrogenGeometry =
      new THREE.SphereGeometry(

        hydrogenRadius,
        40,
        28

      );


    const directions = [

      new THREE.Vector3(1, 1, 1),

      new THREE.Vector3(1, -1, -1),

      new THREE.Vector3(-1, 1, -1),

      new THREE.Vector3(-1, -1, 1)

    ];


    directions.forEach(

      direction =>
        direction.normalize()

    );


    const yAxis =
      new THREE.Vector3(
        0,
        1,
        0
      );


    directions.forEach(
      function (direction) {


        const hydrogen =
          new THREE.Mesh(

            hydrogenGeometry,
            hydrogenMaterial

          );


        hydrogen.position.copy(

          direction
            .clone()
            .multiplyScalar(
              hydrogenDistance
            )

        );


        group.add(
          hydrogen
        );



        const startDistance =
          carbonRadius;


        const endDistance =
          hydrogenDistance
          -
          hydrogenRadius;


        const startPoint =

          direction
            .clone()
            .multiplyScalar(
              startDistance
            );


        const endPoint =

          direction
            .clone()
            .multiplyScalar(
              endDistance
            );


        const bondVector =

          endPoint
            .clone()
            .sub(
              startPoint
            );


        const bondLength =
          bondVector.length();


        const bondGeometry =
          new THREE.CylinderGeometry(

            bondRadius,
            bondRadius,
            bondLength,
            32,
            1,
            false

          );


        const bond =
          new THREE.Mesh(

            bondGeometry,
            bondMaterial

          );


        bond.position.copy(

          startPoint
            .clone()
            .add(
              endPoint
            )
            .multiplyScalar(
              0.5
            )

        );


        bond.quaternion.setFromUnitVectors(

          yAxis,
          direction

        );


        group.add(
          bond
        );

      }
    );


    this.el.setObject3D(

      "methaneMesh",
      group

    );

  },


  remove: function () {

    this.el.removeObject3D(
      "methaneMesh"
    );

  }

});



/* ==========================================================
   EINZELMARKER-WÜRFELPOSE

   WICHTIG:

   - keine Mehrmarkerfusion
   - keine Eigenrotation
   - keine zusätzliche Glättung
   - ein Marker bestimmt die gesamte Pose

   So testen wir ausschließlich die Geometrie.
   ========================================================== */

AFRAME.registerComponent("single-marker-cube", {

  init: function () {

    const THREE =
      AFRAME.THREE;


    this.markers =
      [];


    this.visible = [

      false,
      false,
      false,
      false,
      false,
      false

    ];


    /*
     * Tatsächliche Geometrie:
     *
     * Würfelkante       = 45 mm
     * Markerbreite      = 40 mm
     *
     * Abstand Markerzentrum -> Würfelzentrum:
     *
     * 22.5 / 40 = 0.5625
     */

    const h =
      0.5625;


    const SQRT_HALF =
      Math.SQRT1_2;



    /* ======================================================
       MARKERTRANSFORMATIONEN

       Das gemeinsame Würfelkoordinatensystem wird so
       definiert, dass Marker 1 die Referenzseite ist.

       position:
       Position des Markerzentrums im Würfelsystem.

       quaternion:
       Orientierung des Markerkoordinatensystems relativ
       zum gemeinsamen Würfelsystem.
       ====================================================== */

    this.faces = [


      /* --------------------------------------------------
         MARKER 0

         Gute Kalibrierung:
         ungefähr -90° um X.
         -------------------------------------------------- */

      {
        position:
          new THREE.Vector3(
            0,
            0,
            -h
          ),

        quaternion:
          new THREE.Quaternion(

            -SQRT_HALF,
            0,
            0,
            SQRT_HALF

          )
      },



      /* --------------------------------------------------
         MARKER 1

         Referenzmarker.
         -------------------------------------------------- */

      {
        position:
          new THREE.Vector3(
            0,
            h,
            0
          ),

        quaternion:
          new THREE.Quaternion(
            0,
            0,
            0,
            1
          )
      },



      /* --------------------------------------------------
         MARKER 2

         Die Kalibrierung ergab praktisch exakt eine
         180°-Rotation um die Diagonale X/Y.

         Dadurch zeigt seine Flächennormale nach +X.
         -------------------------------------------------- */

      {
        position:
          new THREE.Vector3(
            h,
            0,
            0
          ),

        quaternion:
          new THREE.Quaternion(

            SQRT_HALF,
            SQRT_HALF,
            0,
            0

          )
      },



      /* --------------------------------------------------
         MARKER 3

         Gegenüberliegende Seite von Marker 1.

         Die direkte 2->3-Kalibrierung war stark instabil.
         Deshalb verwenden wir hier die exakte
         Würfelgeometrie.

         180° um Z:
         lokale +Y-Normale -> -Y.
         -------------------------------------------------- */

      {
        position:
          new THREE.Vector3(
            0,
            -h,
            0
          ),

        quaternion:
          new THREE.Quaternion(
            0,
            0,
            1,
            0
          )
      },



      /* --------------------------------------------------
         MARKER 4

         Gegenüber von Marker 2.

         Die Mehrwinkelmessung war stark instabil.
         Die frühere Messung lag aber ungefähr bei
         +90° um Z.

         lokale +Y-Normale -> -X.
         -------------------------------------------------- */

      {
        position:
          new THREE.Vector3(
            -h,
            0,
            0
          ),

        quaternion:
          new THREE.Quaternion(

            0,
            0,
            SQRT_HALF,
            SQRT_HALF

          )
      },



      /* --------------------------------------------------
         MARKER 5

         Gute Kalibrierung:
         ungefähr +90° um X.

         lokale +Y-Normale -> +Z.
         -------------------------------------------------- */

      {
        position:
          new THREE.Vector3(
            0,
            0,
            h
          ),

        quaternion:
          new THREE.Quaternion(

            SQRT_HALF,
            0,
            0,
            SQRT_HALF

          )
      }

    ];



    /*
     * Aus Position + Rotation jeweils die Transformation
     * Würfel -> Marker erzeugen.
     */

    this.faceMatrices =
      [];


    const unitScale =
      new THREE.Vector3(
        1,
        1,
        1
      );


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      this.faceMatrices[i] =

        new THREE.Matrix4()
          .compose(

            this.faces[i].position,

            this.faces[i].quaternion,

            unitScale

          );

    }



    /*
     * Arbeitsobjekte.
     */

    this.inverseFaceMatrix =
      new THREE.Matrix4();


    this.cubeWorldMatrix =
      new THREE.Matrix4();


    this.tempPosition =
      new THREE.Vector3();


    this.tempQuaternion =
      new THREE.Quaternion();


    this.tempScale =
      new THREE.Vector3();


    this.activeMarker =
      -1;


    this.activeMarkerDisplay =
      document.getElementById(
        "activeMarker"
      );



    /*
     * Marker registrieren.
     */

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      const marker =
        document.getElementById(
          "marker" + i
        );


      this.markers[i] =
        marker;


      marker.addEventListener(

        "markerFound",

        () => {

          this.visible[i] =
            true;

        }

      );


      marker.addEventListener(

        "markerLost",

        () => {

          this.visible[i] =
            false;

        }

      );

    }


    this.el.object3D.visible =
      false;

  },



  /* ======================================================
     BESTEN EINZELNEN MARKER AUSWÄHLEN

     Noch KEINE Fusion.

     Falls der bisherige Marker noch sichtbar ist,
     behalten wir ihn.

     Dadurch wird nicht bei jedem Frame zwischen zwei
     gleichzeitig sichtbaren Seiten hin- und hergeschaltet.
     ====================================================== */

  chooseMarker: function () {

    if (
      this.activeMarker >= 0
      &&
      this.visible[
        this.activeMarker
      ]
    ) {

      return this.activeMarker;

    }


    /*
     * Für den Test einfache feste Priorität.
     */

    const priority = [

      1,
      0,
      2,
      4,
      5,
      3

    ];


    for (
      const markerIndex of priority
    ) {

      if (
        this.visible[
          markerIndex
        ]
      ) {

        return markerIndex;

      }

    }


    return -1;

  },



  /* ======================================================
     WÜRFELPOSE AUS EINEM MARKER
     ====================================================== */

  updateCubeFromMarker: function (
    markerIndex
  ) {

    const marker =
      this.markers[
        markerIndex
      ];


    marker.object3D.updateMatrixWorld(
      true
    );


    /*
     * Markerpose in der Welt:
     *
     * W_marker
     *
     * Bekannte Transformation:
     *
     * T_cube_marker
     *
     * Gesucht:
     *
     * W_cube
     *
     * Da:
     *
     * W_marker =
     * W_cube × T_cube_marker
     *
     * folgt:
     *
     * W_cube =
     * W_marker × inverse(T_cube_marker)
     */

    this.inverseFaceMatrix
      .copy(
        this.faceMatrices[
          markerIndex
        ]
      )
      .invert();


    this.cubeWorldMatrix
      .multiplyMatrices(

        marker.object3D.matrixWorld,

        this.inverseFaceMatrix

      );


    this.cubeWorldMatrix.decompose(

      this.tempPosition,

      this.tempQuaternion,

      this.tempScale

    );


    /*
     * Würfelroot direkt setzen.
     *
     * Keine zusätzliche Glättung.
     */

    this.el.object3D.position.copy(
      this.tempPosition
    );


    this.el.object3D.quaternion.copy(
      this.tempQuaternion
    );


    this.el.object3D.scale.set(
      1,
      1,
      1
    );


    this.el.object3D.visible =
      true;

  },



  /* ======================================================
     FRAME
     ====================================================== */

  tick: function () {

    const chosen =
      this.chooseMarker();


    if (
      chosen < 0
    ) {

      this.activeMarker =
        -1;


      this.el.object3D.visible =
        false;


      this.activeMarkerDisplay.textContent =
        "Marker: –";


      return;

    }



    /*
     * Markerwechsel anzeigen.
     */

    if (
      chosen !==
      this.activeMarker
    ) {

      console.log(

        "GeoChemAR: aktiver Marker",

        this.activeMarker,

        "->",

        chosen

      );


      this.activeMarker =
        chosen;

    }



    this.activeMarkerDisplay.textContent =

      "Marker: "
      +
      this.activeMarker;



    this.updateCubeFromMarker(
      this.activeMarker
    );

  }

});



/* ==========================================================
   HAUPTPROGRAMM
   ========================================================== */

const sceneHost =
  document.getElementById(
    "sceneHost"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const rotateIcon =
  document.getElementById(
    "rotateIcon"
  );


const startTitle =
  document.getElementById(
    "startTitle"
  );


const startText =
  document.getElementById(
    "startText"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


let arStarted =
  false;


let cameraOptimized =
  false;



function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}



function isLandscape() {

  return (

    window.innerWidth
    >
    window.innerHeight

  );

}



function updateStartScreen() {

  if (
    !isMobileDevice()
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (
    arStarted
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (
    !isLandscape()
  ) {

    rotateIcon.style.display =
      "block";


    startTitle.textContent =
      "Bitte Smartphone drehen";


    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";


    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";


    startTitle.textContent =
      "GeoChemAR";


    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";


    startButton.style.display =
      "block";

  }

}



/* ==========================================================
   AR-SZENE
   ========================================================== */

function createARScene() {

  if (
    arStarted
  ) {

    return;

  }


  arStarted =
    true;


  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
      "

    >


      <!-- ============================================
           MARKER 0–5
           ============================================ -->

      <a-marker
        id="marker0"
        type="barcode"
        value="0"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker1"
        type="barcode"
        value="1"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker2"
        type="barcode"
        value="2"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker3"
        type="barcode"
        value="3"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker4"
        type="barcode"
        value="4"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker5"
        type="barcode"
        value="5"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>



      <!-- ============================================
           GEMEINSAMES WÜRFELKOORDINATENSYSTEM
           ============================================ -->

      <a-entity
        id="cubeRoot"
        single-marker-cube
      >


        <!--
          Methan liegt EXAKT im Würfelzentrum.

          Keine Animation.
          Keine Eigenrotation.

          Jede Rotation kommt ausschließlich
          aus der erkannten Würfelpose.
        -->

        <a-entity
          id="methane"
          position="0 0 0"
          rotation="0 0 0"
          methane-model>
        </a-entity>


      </a-entity>



      <!-- ============================================
           LICHT
           ============================================ -->

      <a-entity

        light="
          type: ambient;
          intensity: 1.0;
          color: #ffffff;
        "

      >
      </a-entity>


      <a-entity

        light="
          type: directional;
          intensity: 0.8;
          color: #ffffff;
        "

        position="1 2 1"

      >
      </a-entity>



      <a-entity camera></a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );

}



/* ==========================================================
   MOBILER START
   ========================================================== */

async function startMobileAR() {

  if (
    !isLandscape()
  ) {

    updateStartScreen();

    return;

  }


  try {

    const element =
      document.documentElement;


    if (
      element.requestFullscreen
    ) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }


  try {

    if (
      screen.orientation
      &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }


  setTimeout(
    createARScene,
    400
  );

}

   AR-VIDEO

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ==========================================================
   EBENEN
   ========================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );


  const scene =
    document.getElementById(
      "arScene"
    );


  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (host) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }


  if (scene) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );

    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }


  if (video) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.muted =
      true;

  }


  if (canvas) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );

    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ==========================================================
   VIDEO / CANVAS SYNCHRONISIEREN
   ========================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (
    !video
    ||
    !canvas
  ) {

    return;

  }


  const rect =
    video.getBoundingClientRect();


  if (
    rect.width <= 0
    ||
    rect.height <= 0
  ) {

    return;

  }


  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );


  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );


  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );


  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );


  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );


  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}



/* ==========================================================
   SMARTPHONE-KAMERA
   ========================================================== */

async function optimizeMobileCamera() {

  if (
    cameraOptimized
    ||
    !arStarted
  ) {

    return;

  }


  if (
    !isMobileDevice()
  ) {

    cameraOptimized =
      true;

    return;

  }


  const video =
    getARVideo();


  if (
    !video
    ||
    !video.srcObject
  ) {

    return;

  }


  const tracks =
    video.srcObject.getVideoTracks();


  if (
    !tracks.length
  ) {

    return;

  }


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }


  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        const desiredZoom =

          Math.max(

            capabilities.zoom.min,

            Math.min(
              1,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized =
    true;

}



/* ==========================================================
   ORIENTIERUNGSWECHSEL
   ========================================================== */

function orientationChanged() {

  if (
    !arStarted
  ) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (
    !isMobileDevice()
  ) {

    return;

  }


  if (
    !isLandscape()
  ) {

    const video =
      getARVideo();


    if (
      video
      &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    location.reload();

  }

}



/* ==========================================================
   EVENTS
   ========================================================== */

startButton.addEventListener(
  "click",
  startMobileAR
);


window.addEventListener(

  "orientationchange",

  function () {

    setTimeout(
      orientationChanged,
      250
    );

  }

);


window.addEventListener(

  "resize",

  function () {

    if (
      !arStarted
    ) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);



/* ==========================================================
   START
   ========================================================== */

if (
  isMobileDevice()
) {

  updateStartScreen();

}

else {

  createARScene();

}



/* ==========================================================
   LAUFENDE PFLEGE
   ========================================================== */

setInterval(

  function () {

    if (
      !arStarted
    ) {

      return;

    }


    enforceLayers();

    optimizeMobileCamera();

    synchronizeVisualGeometry();

  },

  250

);


</script>
