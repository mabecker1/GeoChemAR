<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Kameratest</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

      font-family: Arial, sans-serif;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #status {

      position: fixed;

      top: 6px;
      left: 6px;
      right: 6px;

      z-index: 100000;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.72);

      color: white;

      font-size: 11px;
      line-height: 1.3;

      border-radius: 6px;

      pointer-events: none;
    }

  </style>

</head>


<body>

  <div id="status">
    GeoChemAR startet …
  </div>


  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    renderer="
      alpha: true;
      antialias: true;
    "

    arjs="
      sourceType: webcam;
      sourceWidth: 640;
      sourceHeight: 480;
      displayWidth: 640;
      displayHeight: 480;
      debugUIEnabled: false;
      detectionMode: mono;
    "

  >

    <a-marker

      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"

    >

      <a-box

        position="0 0.3 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
          side: double;
        "

      >
      </a-box>

    </a-marker>


    <a-entity camera></a-entity>


  </a-scene>


  <script>

    const status =
      document.getElementById("status");


    function getVideo() {

      return (
        document.getElementById("arjs-video")
        ||
        document.querySelector("video")
      );

    }


    function keepVideoVisible() {

      const video = getVideo();

      if (!video) {
        return;
      }


      /*
        Wir verändern NICHT die vom
        Browser/AR.js berechnete Größe.

        Nur Sichtbarkeit und Ebene.
      */

      video.style.setProperty(
        "display",
        "block",
        "important"
      );

      video.style.setProperty(
        "visibility",
        "visible",
        "important"
      );

      video.style.setProperty(
        "opacity",
        "1",
        "important"
      );

      video.style.setProperty(
        "z-index",
        "0",
        "important"
      );


      video.setAttribute(
        "playsinline",
        ""
      );

      video.setAttribute(
        "webkit-playsinline",
        ""
      );

      video.muted = true;


      const canvas =
        document.querySelector(
          "canvas.a-canvas"
        );


      if (canvas) {

        canvas.style.setProperty(
          "z-index",
          "1",
          "important"
        );

        canvas.style.setProperty(
          "background",
          "transparent",
          "important"
        );

      }

    }


    function updateStatus() {

      const video = getVideo();

      let text =

        "Fenster: "
        +
        window.innerWidth
        +
        "×"
        +
        window.innerHeight;


      if (!video) {

        text +=
          " | Video nicht gefunden";

        status.textContent =
          text;

        return;
      }


      text +=

        " | Kamera: "
        +
        video.videoWidth
        +
        "×"
        +
        video.videoHeight;


      text +=

        " | ready="
        +
        video.readyState;


      /*
        Welche Kamera wurde tatsächlich
        vom Browser ausgewählt?
      */

      try {

        const stream =
          video.srcObject;

        if (
          stream &&
          stream.getVideoTracks
        ) {

          const tracks =
            stream.getVideoTracks();


          if (tracks.length > 0) {

            const track =
              tracks[0];


            const settings =
              track.getSettings
              ? track.getSettings()
              : {};


            const capabilities =
              track.getCapabilities
              ? track.getCapabilities()
              : {};


            if (settings.width) {

              text +=

                " | Stream: "
                +
                settings.width
                +
                "×"
                +
                settings.height;

            }


            if (
              settings.facingMode
            ) {

              text +=

                " | "
                +
                settings.facingMode;

            }


            if (
              settings.zoom !== undefined
            ) {

              text +=

                " | Zoom="
                +
                settings.zoom;

            }


            if (
              capabilities.zoom
            ) {

              text +=

                " | Zoom möglich "
                +
                capabilities.zoom.min
                +
                "–"
                +
                capabilities.zoom.max;

            }

          }

        }

      }

      catch (error) {

        text +=
          " | Kamera-Diagnose nicht verfügbar";

      }


      status.textContent =
        text;

    }


    setInterval(
      function () {

        keepVideoVisible();
        updateStatus();

      },
      500
    );

  </script>

</body>

</html>
