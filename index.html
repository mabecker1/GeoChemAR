<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – AR-Test</title>


  <!-- Lokal gespeicherte Bibliotheken -->

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      /*
        WICHTIG:
        Kein schwarzer Hintergrund.

        Das Kameravideo liegt bei AR.js
        hinter dem transparenten Canvas.
      */
      background: transparent;

    }


    /*
      Wir verändern NICHT die Größe
      des Videos.

      Wir holen es nur vor den
      Seitenhintergrund.
    */

    #arjs-video {

      z-index: 0 !important;

    }


    /*
      Das A-Frame-Canvas liegt
      direkt darüber.

      Auch hier verändern wir
      KEINE Breite oder Höhe.
    */

    canvas.a-canvas {

      z-index: 1 !important;

    }


    /*
      VR-Schaltfläche ausblenden
    */

    .a-enter-vr,
    .a-enter-ar {

      display: none !important;

    }


    /*
      Diagnoseanzeige
    */

    #status {

      position: fixed;

      top: 6px;
      left: 6px;
      right: 6px;

      z-index: 100000;

      box-sizing: border-box;

      padding: 6px 8px;

      background: rgba(0, 0, 0, 0.72);

      color: white;

      font-family: Arial, sans-serif;
      font-size: 11px;

      border-radius: 6px;

      pointer-events: none;

    }

  </style>

</head>


<body>


  <!-- Diagnose -->

  <div id="status">
    GeoChemAR startet …
  </div>


  <!-- AR-Szene -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      sourceWidth: window.innerWidth > window.innerHeight ? 640 : 480;
      sourceHeight: window.innerWidth > window.innerHeight ? 480 : 640;
      debugUIEnabled: false;
      detectionMode: mono;
    "

  >


    <!-- Hiro-Marker -->

    <a-marker

      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"

    >


      <!--
        Testwürfel

        0.6 × 0.6 × 0.6
      -->

      <a-box

        position="0 0.3 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
          side: double;
        "

      >
      </a-box>


    </a-marker>


    <!-- AR-Kamera -->

    <a-entity camera></a-entity>


  </a-scene>



  <script>

    const status =
      document.getElementById("status");


    /*
      Diese Funktion liest NUR Informationen aus.

      Sie verändert weder:
      - Video
      - Canvas
      - Kamera
      - Renderer
      - Projektionsmatrix
    */

    function updateStatus() {

      const video =
        document.getElementById("arjs-video")
        ||
        document.querySelector("video");


      const canvas =
        document.querySelector("canvas.a-canvas");


      let text =

        "Fenster: "
        +
        window.innerWidth
        +
        "×"
        +
        window.innerHeight;


      if (video) {

        text +=

          " | Video: "
          +
          video.videoWidth
          +
          "×"
          +
          video.videoHeight;


        text +=

          " | ready="
          +
          video.readyState;


        text +=

          " | video sichtbar";

      }

      else {

        text +=
          " | Video NICHT gefunden";

      }


      if (canvas) {

        text +=

          " | Canvas: "
          +
          canvas.width
          +
          "×"
          +
          canvas.height;

      }

      else {

        text +=
          " | Canvas NICHT gefunden";

      }


      status.textContent = text;

    }


    setInterval(
      updateStatus,
      500
    );

  </script>


</body>

</html>
