<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Sichtbarkeitstest</title>

  <!-- Lokale Bibliotheken -->
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;
    }


    /*
      A-Frame-Schaltflächen ausblenden
    */

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }


    /*
      Wichtig:
      Wir ändern hier NICHT die Größe
      des Videos und NICHT die Größe
      des Canvas.

      Nur die Ebenen werden festgelegt.
    */

    #arjs-video {
      z-index: 1 !important;
    }

    canvas.a-canvas {
      z-index: 2 !important;
      background: transparent !important;
    }


    /*
      Diagnoseanzeige
    */

    #status {
      position: fixed;

      top: 6px;
      left: 6px;
      right: 6px;

      z-index: 100000;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      font-family: Arial, sans-serif;
      font-size: 11px;
      line-height: 1.3;

      border-radius: 6px;

      pointer-events: none;
    }

  </style>
</head>


<body>

  <div id="status">
    GeoChemAR startet …
  </div>


  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    renderer="
      alpha: true;
      antialias: true;
    "

    arjs="
      sourceType: webcam;
      sourceWidth: window.innerWidth > window.innerHeight ? 640 : 480;
      sourceHeight: window.innerWidth > window.innerHeight ? 480 : 640;
      debugUIEnabled: false;
      detectionMode: mono;
    "

  >

    <a-marker
      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >

      <a-box
        position="0 0.3 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
          side: double;
        "
      >
      </a-box>

    </a-marker>


    <a-entity camera></a-entity>

  </a-scene>



  <script>

    const status =
      document.getElementById("status");


    /*
      AR.js erzeugt das Videoelement
      erst während der Initialisierung.

      Danach stellt AR.js teilweise
      eigene Styles ein.

      Wir ändern deshalb NUR:
      - z-index
      - Sichtbarkeit

      Keine Größen!
      Keine Projektion!
    */

    function keepVideoVisible() {

      const video =
        document.getElementById("arjs-video")
        ||
        document.querySelector("video");


      if (!video) {
        return;
      }


      video.style.setProperty(
        "z-index",
        "1",
        "important"
      );


      video.style.setProperty(
        "visibility",
        "visible",
        "important"
      );


      video.style.setProperty(
        "display",
        "block",
        "important"
      );


      video.style.setProperty(
        "opacity",
        "1",
        "important"
      );


      /*
        Wichtig für Smartphones
      */

      video.setAttribute(
        "playsinline",
        ""
      );

      video.setAttribute(
        "webkit-playsinline",
        ""
      );

      video.muted = true;


      const canvas =
        document.querySelector(
          "canvas.a-canvas"
        );


      if (canvas) {

        canvas.style.setProperty(
          "z-index",
          "2",
          "important"
        );

        canvas.style.setProperty(
          "background",
          "transparent",
          "important"
        );

      }

    }



    /*
      Diagnose
    */

    function updateStatus() {

      const video =
        document.getElementById("arjs-video")
        ||
        document.querySelector("video");


      const canvas =
        document.querySelector(
          "canvas.a-canvas"
        );


      let text =
        "Fenster: "
        +
        window.innerWidth
        +
        "×"
        +
        window.innerHeight;


      if (video) {

        const videoStyle =
          window.getComputedStyle(video);


        text +=
          " | Video: "
          +
          video.videoWidth
          +
          "×"
          +
          video.videoHeight;


        text +=
          " | ready="
          +
          video.readyState;


        text +=
          " | display="
          +
          videoStyle.display;


        text +=
          " | visibility="
          +
          videoStyle.visibility;


        text +=
          " | opacity="
          +
          videoStyle.opacity;


        text +=
          " | z="
          +
          videoStyle.zIndex;

      }

      else {

        text +=
          " | Video nicht gefunden";

      }


      if (canvas) {

        const canvasStyle =
          window.getComputedStyle(canvas);


        text +=
          " | Canvas "
          +
          canvas.width
          +
          "×"
          +
          canvas.height;


        text +=
          " | z="
          +
          canvasStyle.zIndex;

      }


      status.textContent =
        text;

    }



    /*
      Mehrfach nach der Initialisierung,
      weil AR.js das Videoelement erst
      etwas später erzeugt.
    */

    setTimeout(
      keepVideoVisible,
      100
    );

    setTimeout(
      keepVideoVisible,
      300
    );

    setTimeout(
      keepVideoVisible,
      600
    );

    setTimeout(
      keepVideoVisible,
      1000
    );

    setTimeout(
      keepVideoVisible,
      2000
    );


    /*
      Danach regelmäßig absichern.
    */

    setInterval(
      function () {

        keepVideoVisible();

        updateStatus();

      },
      500
    );

  </script>

</body>

</html>
