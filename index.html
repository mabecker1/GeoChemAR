<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>GeoChemAR – AprilTag Test 5a</title>

<style>

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: black;

  font-family: Arial, sans-serif;
}


#video {
  position: fixed;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  background: black;

  z-index: 1;
}


#overlay {
  position: fixed;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  z-index: 2;

  pointer-events: none;
}


#analysisCanvas {
  display: none;
}


#status {
  position: fixed;

  top: 10px;
  left: 10px;

  z-index: 10;

  padding: 10px 14px;

  border-radius: 8px;

  background: rgba(0,0,0,0.80);

  color: white;

  font-size: 14px;
  line-height: 1.45;

  white-space: pre-line;

  pointer-events: none;
}


#error {
  position: fixed;

  left: 10px;
  right: 10px;
  bottom: 10px;

  z-index: 20;

  padding: 10px;

  border-radius: 8px;

  background: rgba(160,0,0,0.90);

  color: white;

  font-size: 13px;

  white-space: pre-wrap;

  display: none;
}

</style>
</head>


<body>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>


<canvas id="overlay"></canvas>


<canvas
  id="analysisCanvas"
  width="640"
  height="480"
></canvas>


<div id="status">
AprilTag wird initialisiert …
</div>


<div id="error"></div>



<script type="module">

/*
 * =====================================================
 * COMLINK
 *
 * Genau wie in der Originaldemo.
 * =====================================================
 */

import * as Comlink
  from "https://unpkg.com/comlink/dist/esm/comlink.mjs";



/* =====================================================
   ELEMENTE
   ===================================================== */

const video =
  document.getElementById(
    "video"
  );


const overlay =
  document.getElementById(
    "overlay"
  );


const overlayCtx =
  overlay.getContext(
    "2d"
  );


const analysisCanvas =
  document.getElementById(
    "analysisCanvas"
  );


const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


const status =
  document.getElementById(
    "status"
  );


const errorBox =
  document.getElementById(
    "error"
  );



/* =====================================================
   KONSTANTEN
   ===================================================== */

const ANALYSIS_WIDTH =
  640;


const ANALYSIS_HEIGHT =
  480;



/* =====================================================
   ZUSTAND
   ===================================================== */

let apriltag =
  null;


let detectorReady =
  false;


let cameraReady =
  false;


let detectionRunning =
  false;


let detections =
  [];


let detectionCounter =
  0;


let detectionFPS =
  0;


let fpsStart =
  performance.now();



/* =====================================================
   FEHLER
   ===================================================== */

function showError(error) {

  console.error(error);


  errorBox.style.display =
    "block";


  errorBox.textContent =

    "FEHLER:\n" +

    (
      error &&
      error.stack

        ? error.stack

        : String(error)
    );

}



window.addEventListener(

  "error",

  function(event) {

    showError(

      event.error ||
      event.message

    );

  }

);



window.addEventListener(

  "unhandledrejection",

  function(event) {

    showError(
      event.reason
    );

  }

);



/* =====================================================
   APRILTAG-WORKER INITIALISIEREN
   ===================================================== */

async function initializeAprilTag() {

  status.textContent =
    "AprilTag-Worker wird gestartet …";


  /*
   * WICHTIG:
   *
   * apriltag.js läuft als Web Worker.
   *
   * Darin wird anschließend
   * apriltag_wasm.js geladen.
   */

  const worker =
    new Worker(
      "./libs/apriltag.js"
    );


  /*
   * Comlink macht die Apriltag-Klasse
   * aus dem Worker hier verfügbar.
   */

  const Apriltag =
    Comlink.wrap(
      worker
    );


  /*
   * Der Konstruktor erwartet einen
   * Callback, sobald WASM bereit ist.
   */

  apriltag =
    await new Apriltag(

      Comlink.proxy(
        function() {

          detectorReady =
            true;

        }
      )

    );


  /*
   * Warten, bis der Callback wirklich
   * ausgeführt wurde.
   */

  const startTime =
    performance.now();


  while (
    !detectorReady
  ) {

    await new Promise(
      function(resolve) {

        setTimeout(
          resolve,
          20
        );

      }
    );


    if (
      performance.now() -
      startTime >
      15000
    ) {

      throw new Error(
        "AprilTag-WASM wurde nach 15 Sekunden nicht bereit."
      );

    }

  }



  /*
   * Für 5a brauchen wir ausschließlich
   * Tag-ID und Ecken.
   *
   * Keine Poseberechnung.
   */

  await apriltag.set_return_pose(
    0
  );


  await apriltag.set_return_solutions(
    0
  );


  await apriltag.set_max_detections(
    6
  );

}



/* =====================================================
   KAMERA
   ===================================================== */

async function startCamera() {

  status.textContent =
    "Kamera wird gestartet …";


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "Dieser Browser unterstützt keine Kameranutzung."
    );

  }


  const stream =
    await navigator.mediaDevices.getUserMedia({

      audio:
        false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 640
        },

        height: {
          ideal: 480
        },

        aspectRatio: {
          ideal: 4 / 3
        },

        frameRate: {
          ideal: 30,
          max: 30
        }

      }

    });


  video.srcObject =
    stream;



  await new Promise(
    function(resolve) {

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        resolve();

        return;

      }


      video.addEventListener(

        "loadedmetadata",

        resolve,

        {
          once: true
        }

      );

    }
  );


  await video.play();


  cameraReady =
    true;


  resizeOverlay();

}



/* =====================================================
   OVERLAY
   ===================================================== */

function resizeOverlay() {

  const dpr =
    window.devicePixelRatio || 1;


  overlay.width =
    Math.round(
      window.innerWidth *
      dpr
    );


  overlay.height =
    Math.round(
      window.innerHeight *
      dpr
    );


  overlay.style.width =
    window.innerWidth +
    "px";


  overlay.style.height =
    window.innerHeight +
    "px";


  overlayCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}



window.addEventListener(
  "resize",
  resizeOverlay
);



/* =====================================================
   GRAUSTUFENBILD ERZEUGEN
   ===================================================== */

function createGrayscaleImage() {

  analysisCtx.drawImage(

    video,

    0,
    0,

    ANALYSIS_WIDTH,
    ANALYSIS_HEIGHT

  );


  const imageData =
    analysisCtx.getImageData(

      0,
      0,

      ANALYSIS_WIDTH,
      ANALYSIS_HEIGHT

    );


  const rgba =
    imageData.data;


  const grayscale =
    new Uint8Array(

      ANALYSIS_WIDTH *
      ANALYSIS_HEIGHT

    );


  /*
   * Die Originaldemo verwendet den
   * Mittelwert aus R, G und B.
   */

  for (
    let i = 0, j = 0;

    i < rgba.length;

    i += 4, j++
  ) {

    grayscale[j] =
      Math.round(

        (
          rgba[i] +
          rgba[i + 1] +
          rgba[i + 2]
        )

        / 3

      );

  }


  return grayscale;

}



/* =====================================================
   ERKENNUNG
   ===================================================== */

async function detectFrame() {

  if (
    !detectorReady ||
    !cameraReady ||
    detectionRunning
  ) {

    return;

  }


  detectionRunning =
    true;


  try {

    const grayscale =
      createGrayscaleImage();


    /*
     * Das entspricht der Originaldemo:
     *
     * apriltag.detect(
     *   grayscale,
     *   width,
     *   height
     * )
     */

    const result =
      await apriltag.detect(

        grayscale,

        ANALYSIS_WIDTH,

        ANALYSIS_HEIGHT

      );


    detections =
      Array.isArray(result)
        ? result
        : [];


    detectionCounter++;


    const now =
      performance.now();


    if (
      now -
      fpsStart >=
      1000
    ) {

      const seconds =

        (
          now -
          fpsStart
        )

        / 1000;


      detectionFPS =

        detectionCounter /
        seconds;


      detectionCounter =
        0;


      fpsStart =
        now;

    }

  }

  catch(error) {

    showError(error);

  }

  finally {

    detectionRunning =
      false;

  }

}



/* =====================================================
   ANALYSEKOORDINATEN → BILDSCHIRM
   ===================================================== */

function analysisToScreen(
  x,
  y
) {

  const screenWidth =
    window.innerWidth;


  const screenHeight =
    window.innerHeight;


  const videoAspect =
    ANALYSIS_WIDTH /
    ANALYSIS_HEIGHT;


  const screenAspect =
    screenWidth /
    screenHeight;


  let displayWidth;
  let displayHeight;

  let offsetX;
  let offsetY;



  if (
    screenAspect >
    videoAspect
  ) {

    displayHeight =
      screenHeight;


    displayWidth =
      displayHeight *
      videoAspect;


    offsetX =
      (
        screenWidth -
        displayWidth
      )

      / 2;


    offsetY =
      0;

  }

  else {

    displayWidth =
      screenWidth;


    displayHeight =
      displayWidth /
      videoAspect;


    offsetX =
      0;


    offsetY =
      (
        screenHeight -
        displayHeight
      )

      / 2;

  }



  return {

    x:

      offsetX +

      (
        x /
        ANALYSIS_WIDTH
      )

      * displayWidth,


    y:

      offsetY +

      (
        y /
        ANALYSIS_HEIGHT
      )

      * displayHeight

  };

}



/* =====================================================
   DETEKTION ZEICHNEN
   ===================================================== */

function drawDetections() {

  overlayCtx.clearRect(

    0,
    0,

    window.innerWidth,
    window.innerHeight

  );



  for (
    const detection
    of detections
  ) {

    if (
      !detection ||
      !Array.isArray(
        detection.corners
      ) ||
      detection.corners.length < 4
    ) {

      continue;

    }



    const points =
      detection.corners.map(

        function(corner) {

          return analysisToScreen(

            corner.x,
            corner.y

          );

        }

      );



    /* -----------------------------
       Rahmen
       ----------------------------- */

    overlayCtx.beginPath();


    overlayCtx.moveTo(

      points[0].x,
      points[0].y

    );


    for (
      let i = 1;
      i < 4;
      i++
    ) {

      overlayCtx.lineTo(

        points[i].x,
        points[i].y

      );

    }


    overlayCtx.closePath();


    overlayCtx.lineWidth =
      4;


    overlayCtx.strokeStyle =
      "#00ff66";


    overlayCtx.stroke();



    /* -----------------------------
       Ecken
       ----------------------------- */

    for (
      let i = 0;
      i < 4;
      i++
    ) {

      overlayCtx.beginPath();


      overlayCtx.arc(

        points[i].x,
        points[i].y,

        7,

        0,
        Math.PI * 2

      );


      /*
       * Ecke 0 rot,
       * restliche grün.
       */

      overlayCtx.fillStyle =

        i === 0

          ? "#ff3b30"

          : "#00ff66";


      overlayCtx.fill();

    }



    /* -----------------------------
       Mittelpunkt / ID
       ----------------------------- */

    let center;


    if (
      detection.center
    ) {

      center =
        analysisToScreen(

          detection.center.x,
          detection.center.y

        );

    }

    else {

      center = {

        x:
          (
            points[0].x +
            points[1].x +
            points[2].x +
            points[3].x
          ) / 4,


        y:
          (
            points[0].y +
            points[1].y +
            points[2].y +
            points[3].y
          ) / 4

      };

    }



    overlayCtx.font =
      "bold 22px Arial";


    overlayCtx.textAlign =
      "center";


    overlayCtx.textBaseline =
      "middle";


    overlayCtx.lineWidth =
      5;


    overlayCtx.strokeStyle =
      "black";


    overlayCtx.strokeText(

      "ID " +
      detection.id,

      center.x,
      center.y

    );


    overlayCtx.fillStyle =
      "white";


    overlayCtx.fillText(

      "ID " +
      detection.id,

      center.x,
      center.y

    );

  }

}



/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

  let ids =
    "keiner";


  if (
    detections.length > 0
  ) {

    ids =
      detections

        .map(
          function(detection) {

            return detection.id;

          }
        )

        .join(", ");

  }



  status.textContent =

    "APRILTAG TEST 5a\n\n" +

    "Detector: " +

    (
      detectorReady
        ? "BEREIT"
        : "lädt …"
    ) +

    "\nKamera: " +

    (
      cameraReady
        ? "BEREIT"
        : "lädt …"
    ) +

    "\n\nTags erkannt: " +
    detections.length +

    "\nIDs: " +
    ids +

    "\nErkennungen/s: " +
    detectionFPS.toFixed(1);

}



/* =====================================================
   HAUPTSCHLEIFE
   ===================================================== */

function animationLoop() {

  requestAnimationFrame(
    animationLoop
  );


  /*
   * Wichtig:
   *
   * Wir starten erst eine neue Erkennung,
   * wenn die vorherige fertig ist.
   *
   * Dadurch stapeln sich keine
   * WASM-Aufrufe.
   */

  if (
    !detectionRunning
  ) {

    detectFrame();

  }


  drawDetections();


  updateStatus();

}



/* =====================================================
   START
   ===================================================== */

async function start() {

  try {

    /*
     * Erst den Detector.
     *
     * Dadurch bekommen wir bei einem
     * Worker-/WASM-Problem eine eindeutige
     * Fehlermeldung, bevor die Kamera
     * dazwischenkommt.
     */

    await initializeAprilTag();


    status.textContent =
      "AprilTag bereit.\nKamera wird gestartet …";


    await startCamera();


    status.textContent =
      "Bereit – AprilTag zeigen";


    requestAnimationFrame(
      animationLoop
    );

  }

  catch(error) {

    showError(error);

  }

}



start();

</script>

</body>
</html>
