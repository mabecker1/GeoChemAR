<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR</title>

  <!-- Lokal gespeicherte Bibliotheken -->
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* ---------- AR-Szene ---------- */

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 2;
    }

    canvas.a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 2 !important;
    }

    #arjs-video {
      position: fixed !important;

      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100dvh !important;

      object-fit: cover !important;

      margin: 0 !important;
      transform: none !important;

      z-index: 1 !important;
    }

    /* ---------- Diagnose ---------- */

    #status {
      position: fixed;

      top: max(6px, env(safe-area-inset-top));
      left: max(6px, env(safe-area-inset-left));
      right: max(6px, env(safe-area-inset-right));

      z-index: 100000;

      box-sizing: border-box;
      padding: 6px 8px;

      background: rgba(0, 0, 0, 0.72);
      color: white;

      font-size: 10px;
      line-height: 1.25;

      border-radius: 6px;

      pointer-events: none;
    }

    /* ---------- Hochformat-Hinweis ---------- */

    #rotateMessage {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 200000;

      background: #111;
      color: white;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;
      box-sizing: border-box;
    }

    #rotateMessage .content {
      max-width: 420px;
    }

    #rotateSymbol {
      font-size: 60px;
      margin-bottom: 20px;
    }

    #rotateMessage strong {
      display: block;
      font-size: 22px;
      margin-bottom: 10px;
    }

    #rotateMessage span {
      font-size: 15px;
      line-height: 1.4;
    }

    /* Hochformat */
    @media (orientation: portrait) {

      #rotateMessage {
        display: flex;
      }

      #status {
        display: none;
      }

    }

  </style>
</head>


<body>

  <!-- Hinweis bei Hochformat -->

  <div id="rotateMessage">
    <div class="content">

      <div id="rotateSymbol">↻</div>

      <strong>Bitte Smartphone drehen</strong>

      <span>
        GeoChemAR wird im Querformat verwendet.
      </span>

    </div>
  </div>


  <!-- Diagnoseanzeige -->

  <div id="status">
    GeoChemAR startet …
  </div>


  <!-- AR-Szene -->

  <a-scene
    embedded

    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      detectionMode: mono;
    "
  >

    <!-- Hiro-Marker -->

    <a-marker
      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >

      <!-- Testwürfel -->

      <a-box
        position="0 0.5 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
        "
      >
      </a-box>

    </a-marker>


    <!-- AR-Kamera -->

    <a-entity camera></a-entity>

  </a-scene>


<script>

const status = document.getElementById("status");

let lastOrientation = "";


/* ---------------------------------
   Video korrekt auf Bildschirm legen
---------------------------------- */

function fixVideoLayout() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  if (!video) {
    return;
  }

  video.setAttribute("playsinline", "");
  video.muted = true;
  video.autoplay = true;

  video.style.position = "fixed";

  video.style.top = "0";
  video.style.left = "0";

  video.style.width = "100vw";
  video.style.height = "100dvh";

  video.style.objectFit = "cover";

  video.style.margin = "0";
  video.style.transform = "none";

  video.style.zIndex = "1";

}


/* ---------------------------------
   A-Frame-Größe aktualisieren
---------------------------------- */

function resizeScene() {

  const scene =
    document.querySelector("a-scene");

  if (!scene) {
    return;
  }

  if (scene.resize) {
    scene.resize();
  }

  if (
    scene.renderer &&
    scene.camera
  ) {

    const width =
      window.innerWidth;

    const height =
      window.innerHeight;

    scene.renderer.setSize(
      width,
      height,
      false
    );

    scene.camera.aspect =
      width / height;

    scene.camera.updateProjectionMatrix();

  }

}


/* ---------------------------------
   Layout komplett aktualisieren
---------------------------------- */

function updateLayout() {

  fixVideoLayout();
  resizeScene();

}


/* ---------------------------------
   Orientierung prüfen
---------------------------------- */

function checkOrientation() {

  const orientation =
    window.innerWidth >
    window.innerHeight
      ? "landscape"
      : "portrait";

  /*
    Wenn sich die Orientierung geändert hat,
    warten wir kurz, bis der Browser seine
    neue Größe vollständig berechnet hat.
  */

  if (
    lastOrientation &&
    lastOrientation !== orientation
  ) {

    setTimeout(updateLayout, 100);
    setTimeout(updateLayout, 300);
    setTimeout(updateLayout, 700);

  }

  lastOrientation = orientation;

}


/* ---------------------------------
   Diagnoseanzeige
---------------------------------- */

function updateStatus() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  let text =
    "Display: " +
    window.innerWidth +
    "×" +
    window.innerHeight;

  text +=
    " | Querformat";

  if (video) {

    text +=
      " | Kamera: " +
      video.videoWidth +
      "×" +
      video.videoHeight;

    text +=
      " | ready: " +
      video.readyState;

  } else {

    text +=
      " | Kamera: nicht gefunden";

  }

  status.textContent = text;

}


/* ---------------------------------
   Ereignisse
---------------------------------- */

window.addEventListener(
  "load",
  function () {

    setTimeout(updateLayout, 500);
    setTimeout(updateLayout, 1200);

  }
);


window.addEventListener(
  "resize",
  function () {

    checkOrientation();

    setTimeout(updateLayout, 200);

  }
);


window.addEventListener(
  "orientationchange",
  function () {

    setTimeout(updateLayout, 200);
    setTimeout(updateLayout, 600);

  }
);


/* AR.js erzeugt das Videoelement erst
   nach dem Laden. Deshalb kontrollieren
   wir das Layout regelmäßig. */

setInterval(
  function () {

    fixVideoLayout();
    checkOrientation();
    updateStatus();

  },
  1000
);

</script>

</body>
</html>
