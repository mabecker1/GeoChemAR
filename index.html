<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR</title>

  <!-- Lokale Bibliotheken -->
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

      font-family: Arial, sans-serif;
    }


    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }


    #arjs-video {
      z-index: 0 !important;

      visibility: visible !important;
      opacity: 1 !important;
    }


    canvas.a-canvas {
      z-index: 1 !important;
      background: transparent !important;
    }


    /* --------------------------------
       Diagnoseanzeige
       -------------------------------- */

    #status {
      position: fixed;

      top: max(6px, env(safe-area-inset-top));
      left: max(6px, env(safe-area-inset-left));
      right: max(6px, env(safe-area-inset-right));

      z-index: 100000;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.76);

      color: white;

      font-size: 10px;
      line-height: 1.3;

      border-radius: 6px;

      pointer-events: none;
    }


    /* --------------------------------
       Querformat-Warnung
       -------------------------------- */

    #rotateMessage {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 200000;

      box-sizing: border-box;

      padding: 30px;

      background: #111;

      color: white;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    #rotateMessage .rotateContent {
      max-width: 420px;
    }


    #rotateIcon {
      font-size: 64px;
      line-height: 1;

      margin-bottom: 22px;
    }


    #rotateMessage strong {

      display: block;

      margin-bottom: 12px;

      font-size: 22px;
    }


    #rotateMessage span {

      display: block;

      font-size: 15px;
      line-height: 1.45;

      opacity: 0.9;
    }

  </style>

</head>


<body>


  <!-- --------------------------------
       Querformat-Warnung
       -------------------------------- -->

  <div id="rotateMessage">

    <div class="rotateContent">

      <div id="rotateIcon">
        ↻
      </div>

      <strong>
        Bitte Smartphone drehen
      </strong>

      <span>
        GeoChemAR funktioniert auf mobilen Geräten
        im Querformat.
      </span>

    </div>

  </div>



  <!-- --------------------------------
       Diagnose
       -------------------------------- -->

  <div id="status">
    GeoChemAR startet …
  </div>



  <!-- --------------------------------
       AR-Szene
       -------------------------------- -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    renderer="
      alpha: true;
      antialias: true;
    "

    arjs="
      sourceType: webcam;
      sourceWidth: 640;
      sourceHeight: 480;
      debugUIEnabled: false;
      detectionMode: mono;
    "

  >


    <!-- Hiro-Marker -->

    <a-marker

      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"

    >


      <!-- Testwürfel -->

      <a-box

        position="0 0.3 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
          side: double;
        "

      >
      </a-box>


    </a-marker>


    <!-- AR-Kamera -->

    <a-entity camera></a-entity>


  </a-scene>



<script>

const status =
  document.getElementById("status");

const rotateMessage =
  document.getElementById("rotateMessage");


let cameraOptimized = false;


/*
  ----------------------------------------------------
  Mobilgerät erkennen
  ----------------------------------------------------
*/

function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        window.screen.width,
        window.screen.height
      ) < 1000
    )

  );

}



/*
  ----------------------------------------------------
  Querformat prüfen
  ----------------------------------------------------
*/

function isLandscape() {

  return (
    window.innerWidth >
    window.innerHeight
  );

}



/*
  ----------------------------------------------------
  Querformat-Warnung anzeigen/verstecken

  Nur Mobilgeräte sind betroffen.
  Computer bleiben unverändert.
  ----------------------------------------------------
*/

function updateOrientationWarning() {

  if (
    isMobileDevice()
    &&
    !isLandscape()
  ) {

    rotateMessage.style.display =
      "flex";

    status.style.display =
      "none";

  }

  else {

    rotateMessage.style.display =
      "none";

    status.style.display =
      "block";

  }

}



/*
  ----------------------------------------------------
  AR.js-Videoelement finden
  ----------------------------------------------------
*/

function getARVideo() {

  return (

    document.getElementById("arjs-video")
    ||
    document.querySelector("video")

  );

}



/*
  ----------------------------------------------------
  Sichtbarkeit absichern

  WICHTIG:
  Keine Größenänderung.
  Keine Änderung der Projektion.
  ----------------------------------------------------
*/

function keepVideoVisible() {

  const video = getARVideo();

  if (!video) {
    return;
  }


  video.style.setProperty(
    "visibility",
    "visible",
    "important"
  );

  video.style.setProperty(
    "opacity",
    "1",
    "important"
  );

  video.style.setProperty(
    "z-index",
    "0",
    "important"
  );


  video.setAttribute(
    "playsinline",
    ""
  );

  video.setAttribute(
    "webkit-playsinline",
    ""
  );


  video.muted = true;


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (canvas) {

    canvas.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/*
  ----------------------------------------------------
  Smartphone-Kamera optimieren
  ----------------------------------------------------
*/

async function optimizeMobileCamera() {

  if (cameraOptimized) {
    return;
  }


  if (!isMobileDevice()) {

    cameraOptimized = true;

    console.log(
      "GeoChemAR: Desktop – Webcam unverändert."
    );

    return;

  }


  const video = getARVideo();


  if (!video) {
    return;
  }


  const stream =
    video.srcObject;


  if (!stream) {
    return;
  }


  const tracks =
    stream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  const track =
    tracks[0];


  /*
    Höhere Kameraauflösung auf
    mobilen Geräten anfordern.
  */

  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Auflösungs-Constraints nicht übernommen:",
      error
    );

  }


  /*
    Wenn unterstützt:
    Kamera auf 1× Zoom setzen.
  */

  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        let desiredZoom = 1;


        desiredZoom =
          Math.max(
            capabilities.zoom.min,
            Math.min(
              desiredZoom,
              capabilities.zoom.max
            )
          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht gesetzt werden:",
      error
    );

  }


  cameraOptimized = true;

}



/*
  ----------------------------------------------------
  Diagnose
  ----------------------------------------------------
*/

function updateStatus() {

  const video = getARVideo();


  let text =

    isMobileDevice()

    ? "Mobil"

    : "Computer";


  text +=

    " | Fenster "
    +
    window.innerWidth
    +
    "×"
    +
    window.innerHeight;


  if (!video) {

    text +=
      " | Kamera wird initialisiert …";

    status.textContent =
      text;

    return;

  }


  text +=

    " | Video "
    +
    video.videoWidth
    +
    "×"
    +
    video.videoHeight;


  const stream =
    video.srcObject;


  if (
    stream
    &&
    stream.getVideoTracks
  ) {

    const tracks =
      stream.getVideoTracks();


    if (tracks.length) {

      const track =
        tracks[0];


      if (track.getSettings) {

        const settings =
          track.getSettings();


        if (
          settings.width
          &&
          settings.height
        ) {

          text +=

            " | Stream "
            +
            settings.width
            +
            "×"
            +
            settings.height;

        }


        if (settings.frameRate) {

          text +=

            " @ "
            +
            Math.round(
              settings.frameRate
            )
            +
            "fps";

        }


        if (settings.facingMode) {

          text +=

            " | "
            +
            settings.facingMode;

        }


        if (
          settings.zoom !== undefined
        ) {

          text +=

            " | Zoom "
            +
            settings.zoom;

        }

      }


      if (track.label) {

        text +=

          " | "
          +
          track.label;

      }

    }

  }


  status.textContent =
    text;

}



/*
  ----------------------------------------------------
  Orientierung überwachen
  ----------------------------------------------------
*/

window.addEventListener(
  "resize",
  updateOrientationWarning
);


window.addEventListener(
  "orientationchange",
  function () {

    /*
      Kleine Verzögerung, damit der Browser
      zuerst seine neue Fenstergröße kennt.
    */

    setTimeout(
      updateOrientationWarning,
      200
    );

  }
);



/*
  ----------------------------------------------------
  Start
  ----------------------------------------------------
*/

updateOrientationWarning();



/*
  ----------------------------------------------------
  Regelmäßige Initialisierung / Diagnose
  ----------------------------------------------------
*/

setInterval(

  function () {

    keepVideoVisible();

    optimizeMobileCamera();

    updateStatus();

    updateOrientationWarning();

  },

  500

);

</script>


</body>

</html>
