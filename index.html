<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
           maximum-scale=1.0, user-scalable=no"
>

<title>GeoChemAR – AprilTag Test 5a</title>

<style>

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: black;

  font-family: Arial, sans-serif;
}


/* =====================================================
   KAMERABILD
   ===================================================== */

#video {
  position: fixed;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  background: black;

  z-index: 1;
}


/* =====================================================
   OVERLAY FÜR ERKANNTE TAGS
   ===================================================== */

#overlay {
  position: fixed;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  z-index: 2;

  pointer-events: none;
}


/* =====================================================
   STATUS
   ===================================================== */

#status {
  position: fixed;

  top: 10px;
  left: 10px;

  z-index: 10;

  padding: 10px 14px;

  border-radius: 8px;

  background: rgba(0, 0, 0, 0.78);

  color: white;

  font-size: 14px;
  line-height: 1.45;

  white-space: pre-line;

  pointer-events: none;
}


/* =====================================================
   FEHLER
   ===================================================== */

#error {
  position: fixed;

  left: 10px;
  right: 10px;
  bottom: 10px;

  z-index: 20;

  padding: 10px;

  border-radius: 8px;

  background: rgba(160, 0, 0, 0.9);

  color: white;

  font-size: 13px;

  white-space: pre-wrap;

  display: none;
}


/* =====================================================
   UNSICHTBARES ANALYSE-CANVAS

   Hier hinein wird das Kamerabild mit 640 × 480
   gezeichnet und anschließend an AprilTag übergeben.
   ===================================================== */

#analysisCanvas {
  display: none;
}

</style>
</head>


<body>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>


<canvas id="overlay"></canvas>


<canvas
  id="analysisCanvas"
  width="640"
  height="480"
></canvas>


<div id="status">
AprilTag wird initialisiert …
</div>


<div id="error"></div>



<!--
  WASM-JavaScript-Wrapper.
  Die zugehörige apriltag_wasm.wasm muss
  im selben Ordner liegen.
-->
<script src="./libs/apriltag_wasm.js"></script>



<script>

/* =====================================================
   ELEMENTE
   ===================================================== */

const video =
  document.getElementById("video");


const overlay =
  document.getElementById("overlay");


const overlayCtx =
  overlay.getContext("2d");


const analysisCanvas =
  document.getElementById("analysisCanvas");


const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


const status =
  document.getElementById("status");


const errorBox =
  document.getElementById("error");



/* =====================================================
   KONSTANTEN
   ===================================================== */

const ANALYSIS_WIDTH =
  640;


const ANALYSIS_HEIGHT =
  480;


/*
 * Wir brauchen für 5a keine 30 Detektionen pro
 * Sekunde.
 *
 * 20 fps reichen für den ersten Tracking-Test
 * und belasten das Smartphone weniger.
 */

const DETECTION_INTERVAL =
  50;



/* =====================================================
   ZUSTAND
   ===================================================== */

let apriltag =
  null;


let detectorReady =
  false;


let cameraReady =
  false;


let detectionRunning =
  false;


let detections =
  [];


let lastDetectionTime =
  0;


let detectionCounter =
  0;


let detectionFPS =
  0;


let fpsStart =
  performance.now();



/* =====================================================
   FEHLER
   ===================================================== */

function showError(error) {

  console.error(error);


  errorBox.style.display =
    "block";


  errorBox.textContent =

    "FEHLER:\n" +

    (
      error && error.stack
        ? error.stack
        : String(error)
    );

}



window.addEventListener(
  "error",
  function(event) {

    showError(
      event.error ||
      event.message
    );

  }
);



window.addEventListener(
  "unhandledrejection",
  function(event) {

    showError(
      event.reason
    );

  }
);



/* =====================================================
   APRILTAG INITIALISIEREN
   ===================================================== */

function initializeAprilTag() {

  return new Promise(
    function(resolve, reject) {

      try {

        if (
          typeof Apriltag !==
          "function"
        ) {

          reject(
            new Error(
              "Apriltag-Klasse nicht gefunden. " +
              "Prüfe libs/apriltag_wasm.js."
            )
          );

          return;

        }


        apriltag =
          Apriltag(
            function() {

              detectorReady =
                true;


              /*
               * Für 5a wollen wir nur die Erkennung
               * und die Ecken.
               *
               * Keine Poseberechnung.
               */

              apriltag.set_return_pose(
                0
              );


              apriltag.set_return_solutions(
                0
              );


              /*
               * Wir interessieren uns zunächst nur
               * für wenige Tags gleichzeitig.
               */

              apriltag.set_max_detections(
                6
              );


              resolve();

            }
          );

      }

      catch(error) {

        reject(error);

      }

    }
  );

}



/* =====================================================
   KAMERA STARTEN
   ===================================================== */

async function startCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "getUserMedia wird von diesem Browser nicht unterstützt."
    );

  }


  const stream =
    await navigator.mediaDevices.getUserMedia({

      audio:
        false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 640
        },

        height: {
          ideal: 480
        },

        aspectRatio: {
          ideal: 4 / 3
        },

        frameRate: {
          ideal: 30,
          max: 30
        }

      }

    });


  video.srcObject =
    stream;


  await new Promise(
    function(resolve) {

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        resolve();

        return;

      }


      video.addEventListener(
        "loadedmetadata",
        resolve,
        {
          once: true
        }
      );

    }
  );


  await video.play();


  cameraReady =
    true;


  resizeOverlay();

}



/* =====================================================
   OVERLAY AN BILDSCHIRM ANPASSEN
   ===================================================== */

function resizeOverlay() {

  const dpr =
    window.devicePixelRatio || 1;


  overlay.width =
    Math.round(
      window.innerWidth *
      dpr
    );


  overlay.height =
    Math.round(
      window.innerHeight *
      dpr
    );


  overlay.style.width =
    window.innerWidth +
    "px";


  overlay.style.height =
    window.innerHeight +
    "px";


  overlayCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}



window.addEventListener(
  "resize",
  resizeOverlay
);



/* =====================================================
   KAMERABILD → ANALYSE-CANVAS

   Wir verwenden contain statt cover.

   Deshalb wird das komplette Kamerabild angezeigt
   und nichts abgeschnitten.
   ===================================================== */

function drawCameraToAnalysisCanvas() {

  analysisCtx.drawImage(

    video,

    0,
    0,

    ANALYSIS_WIDTH,
    ANALYSIS_HEIGHT

  );

}



/* =====================================================
   RGB → GRAUSTUFEN

   AprilTag erwartet ein Uint8Array mit genau einem
   Helligkeitswert pro Pixel.
   ===================================================== */

function createGrayscaleImage() {

  const imageData =
    analysisCtx.getImageData(

      0,
      0,

      ANALYSIS_WIDTH,
      ANALYSIS_HEIGHT

    );


  const rgba =
    imageData.data;


  const grayscale =
    new Uint8Array(

      ANALYSIS_WIDTH *
      ANALYSIS_HEIGHT

    );


  /*
   * Gewichtete Umwandlung in Graustufen.
   */

  for (
    let i = 0, j = 0;
    i < rgba.length;
    i += 4, j++
  ) {

    grayscale[j] =

      Math.round(

        0.299 *
        rgba[i]

        +

        0.587 *
        rgba[i + 1]

        +

        0.114 *
        rgba[i + 2]

      );

  }


  return grayscale;

}



/* =====================================================
   APRILTAG-ERKENNUNG
   ===================================================== */

async function runDetection() {

  if (
    !detectorReady ||
    !cameraReady ||
    detectionRunning
  ) {

    return;

  }


  detectionRunning =
    true;


  try {

    drawCameraToAnalysisCanvas();


    const grayscale =
      createGrayscaleImage();


    const result =
      await apriltag.detect(

        grayscale,

        ANALYSIS_WIDTH,

        ANALYSIS_HEIGHT

      );


    if (
      Array.isArray(result)
    ) {

      detections =
        result;

    }

    else {

      detections =
        [];

    }


    detectionCounter++;


    const now =
      performance.now();


    if (
      now -
      fpsStart >=
      1000
    ) {

      detectionFPS =
        detectionCounter;


      detectionCounter =
        0;


      fpsStart =
        now;

    }

  }

  catch(error) {

    showError(error);

  }

  finally {

    detectionRunning =
      false;

  }

}



/* =====================================================
   KOORDINATEN ANALYSEBILD → SICHTBARES VIDEO

   video nutzt object-fit: contain.

   Daher können links/rechts oder oben/unten
   schwarze Balken entstehen.
   ===================================================== */

function analysisToScreen(
  x,
  y
) {

  const screenWidth =
    window.innerWidth;


  const screenHeight =
    window.innerHeight;


  const videoAspect =
    ANALYSIS_WIDTH /
    ANALYSIS_HEIGHT;


  const screenAspect =
    screenWidth /
    screenHeight;


  let displayWidth;
  let displayHeight;
  let offsetX;
  let offsetY;


  if (
    screenAspect >
    videoAspect
  ) {

    displayHeight =
      screenHeight;


    displayWidth =
      displayHeight *
      videoAspect;


    offsetX =
      (
        screenWidth -
        displayWidth
      ) / 2;


    offsetY =
      0;

  }

  else {

    displayWidth =
      screenWidth;


    displayHeight =
      displayWidth /
      videoAspect;


    offsetX =
      0;


    offsetY =
      (
        screenHeight -
        displayHeight
      ) / 2;

  }


  return {

    x:
      offsetX +
      (
        x /
        ANALYSIS_WIDTH
      ) *
      displayWidth,

    y:
      offsetY +
      (
        y /
        ANALYSIS_HEIGHT
      ) *
      displayHeight

  };

}



/* =====================================================
   ERKANNTE TAGS ZEICHNEN
   ===================================================== */

function drawDetections() {

  overlayCtx.clearRect(

    0,
    0,

    window.innerWidth,
    window.innerHeight

  );


  for (
    const detection
    of detections
  ) {

    if (
      !detection ||
      !Array.isArray(
        detection.corners
      ) ||
      detection.corners.length < 4
    ) {

      continue;

    }


    const points =
      detection.corners.map(
        function(corner) {

          return analysisToScreen(

            corner.x,
            corner.y

          );

        }
      );


    /*
     * Außenlinie
     */

    overlayCtx.beginPath();


    overlayCtx.moveTo(
      points[0].x,
      points[0].y
    );


    for (
      let i = 1;
      i < points.length;
      i++
    ) {

      overlayCtx.lineTo(
        points[i].x,
        points[i].y
      );

    }


    overlayCtx.closePath();


    overlayCtx.lineWidth =
      4;


    overlayCtx.strokeStyle =
      "#00ff66";


    overlayCtx.stroke();



    /*
     * Vier Ecken
     */

    for (
      let i = 0;
      i < points.length;
      i++
    ) {

      const point =
        points[i];


      overlayCtx.beginPath();


      overlayCtx.arc(

        point.x,
        point.y,

        7,

        0,
        Math.PI * 2

      );


      overlayCtx.fillStyle =
        i === 0
          ? "#ff3b30"
          : "#00ff66";


      overlayCtx.fill();

    }



    /*
     * ID am Mittelpunkt
     */

    let center;


    if (
      detection.center
    ) {

      center =
        analysisToScreen(

          detection.center.x,
          detection.center.y

        );

    }

    else {

      center = {

        x:
          (
            points[0].x +
            points[1].x +
            points[2].x +
            points[3].x
          ) / 4,

        y:
          (
            points[0].y +
            points[1].y +
            points[2].y +
            points[3].y
          ) / 4

      };

    }


    overlayCtx.font =
      "bold 22px Arial";


    overlayCtx.textAlign =
      "center";


    overlayCtx.textBaseline =
      "middle";


    overlayCtx.lineWidth =
      5;


    overlayCtx.strokeStyle =
      "black";


    overlayCtx.strokeText(

      "ID " +
      detection.id,

      center.x,
      center.y

    );


    overlayCtx.fillStyle =
      "white";


    overlayCtx.fillText(

      "ID " +
      detection.id,

      center.x,
      center.y

    );

  }

}



/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

  let tagText =
    "keiner";


  if (
    detections.length > 0
  ) {

    tagText =
      detections
        .map(
          function(detection) {
            return detection.id;
          }
        )
        .join(", ");

  }


  status.textContent =

    "APRILTAG TEST 5a\n\n" +

    "Detector: " +
    (
      detectorReady
        ? "BEREIT"
        : "lädt …"
    ) +

    "\nKamera: " +
    (
      cameraReady
        ? "BEREIT"
        : "lädt …"
    ) +

    "\n\nTags erkannt: " +
    detections.length +

    "\nIDs: " +
    tagText +

    "\nErkennungen/s: " +
    detectionFPS;

}



/* =====================================================
   HAUPTSCHLEIFE
   ===================================================== */

async function animationLoop(
  timestamp
) {

  requestAnimationFrame(
    animationLoop
  );


  /*
   * Detection begrenzen.

   * Dadurch kann der Browser zwischen den
   * Detektionen weiter flüssig zeichnen.
   */

  if (
    timestamp -
    lastDetectionTime >=
    DETECTION_INTERVAL
  ) {

    lastDetectionTime =
      timestamp;


    runDetection();

  }


  drawDetections();


  updateStatus();

}



/* =====================================================
   START
   ===================================================== */

async function start() {

  try {

    status.textContent =
      "AprilTag-Detector wird geladen …";


    /*
     * Detector und Kamera können parallel
     * initialisiert werden.
     */

    await Promise.all([

      initializeAprilTag(),

      startCamera()

    ]);


    status.textContent =
      "Bereit – AprilTag zeigen";


    requestAnimationFrame(
      animationLoop
    );

  }

  catch(error) {

    showError(error);

  }

}


start();

</script>

</body>
</html>
