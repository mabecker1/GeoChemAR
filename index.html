<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Phase 4f-1 Native MultiMarker</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #sceneHost {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10 !important;
      width: 100%;
      height: 100%;
      pointer-events: none !important;
    }

    #arScene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none !important;
      background: transparent !important;
    }

    #arjs-video {
      position: fixed !important;
      z-index: 1 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      z-index: 11 !important;
      visibility: visible !important;
      opacity: 1 !important;
      display: block !important;
      background: transparent !important;
      pointer-events: none !important;
    }

    #diagnostic {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      padding: 8px 11px;
      border-radius: 8px;
      background: rgba(0,0,0,0.68);
      color: white;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
      background: #111;
      color: white;
      text-align: center;
    }

    #startScreen.visible {
      display: flex;
    }

    #startContent {
      width: 100%;
      max-width: 420px;
    }

    #rotateIcon {
      margin-bottom: 20px;
      font-size: 64px;
    }

    #startTitle {
      margin-bottom: 12px;
      font-size: 23px;
      font-weight: bold;
    }

    #startText {
      margin-bottom: 22px;
      font-size: 15px;
      line-height: 1.45;
      opacity: 0.9;
    }

    #startButton {
      display: none;
      margin: 0 auto;
      padding: 13px 25px;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111;
    }
  </style>
</head>

<body>

<div id="sceneHost"></div>

<div id="diagnostic">
  Phase 4f-1 – Native MultiMarker<br>
  <span id="trackingInfo">Multimarker wird geladen …</span>
</div>

<div id="startScreen">
  <div id="startContent">

    <div id="rotateIcon">↻</div>

    <div id="startTitle">
      Bitte Smartphone drehen
    </div>

    <div id="startText">
      GeoChemAR wird im Querformat verwendet.
    </div>

    <button id="startButton">
      AR starten
    </button>

  </div>
</div>

<script>

/* ==========================================================
   METHAN – BEWÄHRTE GEOMETRIE
   ========================================================== */

AFRAME.registerComponent("methane-model", {

  init: function () {

    const THREE = AFRAME.THREE;
    const group = new THREE.Group();

    const carbonRadius = 0.22;
    const hydrogenRadius = 0.14;
    const hydrogenDistance = 0.72;
    const bondRadius = 0.040;

    const carbonMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x202020,
        roughness: 0.55,
        metalness: 0
      });

    const hydrogenMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.45,
        metalness: 0
      });

    const bondMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xb8bec7,
        roughness: 0.50,
        metalness: 0
      });

    const carbon =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          carbonRadius,
          48,
          32
        ),
        carbonMaterial
      );

    group.add(carbon);

    const hydrogenGeometry =
      new THREE.SphereGeometry(
        hydrogenRadius,
        40,
        28
      );

    const directions = [
      new THREE.Vector3(1, 1, 1),
      new THREE.Vector3(1, -1, -1),
      new THREE.Vector3(-1, 1, -1),
      new THREE.Vector3(-1, -1, 1)
    ];

    directions.forEach(
      direction => direction.normalize()
    );

    const yAxis =
      new THREE.Vector3(0, 1, 0);

    directions.forEach(function(direction) {

      const hydrogen =
        new THREE.Mesh(
          hydrogenGeometry,
          hydrogenMaterial
        );

      hydrogen.position.copy(
        direction.clone().multiplyScalar(
          hydrogenDistance
        )
      );

      group.add(hydrogen);

      const startDistance =
        carbonRadius;

      const endDistance =
        hydrogenDistance - hydrogenRadius;

      const startPoint =
        direction.clone().multiplyScalar(
          startDistance
        );

      const endPoint =
        direction.clone().multiplyScalar(
          endDistance
        );

      const bondVector =
        endPoint.clone().sub(startPoint);

      const bondLength =
        bondVector.length();

      const bondGeometry =
        new THREE.CylinderGeometry(
          bondRadius,
          bondRadius,
          bondLength,
          32,
          1,
          false
        );

      const bond =
        new THREE.Mesh(
          bondGeometry,
          bondMaterial
        );

      bond.position.copy(
        startPoint
          .clone()
          .add(endPoint)
          .multiplyScalar(0.5)
      );

      bond.quaternion.setFromUnitVectors(
        yAxis,
        direction
      );

      group.add(bond);

    });

    this.el.setObject3D(
      "methaneMesh",
      group
    );

  }

});


/* ==========================================================
   NATIVES ARTOOLKIT-MULTIMARKER-TRACKING

   KEINE:
   - eigene Markerfusion
   - Frontality-Gewichtung
   - Sprungerkennung
   - Markerumschaltung
   - Quaternion-Mittelung

   ARToolKit berechnet EINE robuste Pose.
   ========================================================== */

AFRAME.registerComponent(
  "native-multimarker",
  {

    init: function () {

      this.info =
        document.getElementById(
          "trackingInfo"
        );

      this.controller = null;
      this.context = null;
      this.multiMarkerId = null;

      this.initialized = false;
      this.receivedThisFrame = false;

      this.lastSeen =
        performance.now();

      this.holdTime = 180;

      this.el.object3D.visible =
        false;

      this.tryInitialize();

    },


    tryInitialize: function () {

      if (
        this.initialized
      ) {
        return;
      }

      const scene =
        this.el.sceneEl;

      if (
        !scene ||
        !scene.systems ||
        !scene.systems.artoolkit
      ) {

        setTimeout(
          () => this.tryInitialize(),
          100
        );

        return;

      }

      const system =
        scene.systems.artoolkit;

      if (
        !system.arToolkitContext ||
        !system.arToolkitContext.arController
      ) {

        setTimeout(
          () => this.tryInitialize(),
          100
        );

        return;

      }

      this.context =
        system.arToolkitContext;

      this.controller =
        this.context.arController;

      this.loadMultiMarker();

    },


    loadMultiMarker: function () {

      const self = this;

      this.info.textContent =
        "Lade cube.dat …";

      this.controller.loadMultiMarker(

        "cube.dat",

        function(
          multiMarkerId,
          markerNum
        ) {

          self.multiMarkerId =
            multiMarkerId;

          self.initialized =
            true;

          self.info.textContent =
            "Multimarker bereit – "
            +
            markerNum
            +
            " Marker";

        },

        function(error) {

          console.error(
            "GeoChemAR: cube.dat konnte nicht geladen werden.",
            error
          );

          self.info.textContent =
            "FEHLER: cube.dat nicht geladen";

        }

      );


      this.controller.addEventListener(

        "getMultiMarker",

        function(event) {

          if (
            self.multiMarkerId === null
          ) {
            return;
          }

          if (
            event.data.multiMarkerId
            !==
            self.multiMarkerId
          ) {
            return;
          }

          self.applyMultiMarkerPose(
            event
          );

        }

      );

    },


    applyMultiMarkerPose: function(
      event
    ) {

      const THREE =
        AFRAME.THREE;

      /*
       * event.data.matrix ist bereits die von
       * JSARToolKit berechnete robuste Pose
       * des GESAMTEN Multimarkers.
       */

      const modelViewMatrix =
        new THREE.Matrix4()
          .fromArray(
            event.data.matrix
          );

      /*
       * Gleiche Achsenumrechnung, die
       * AR.js auch bei normalen Markern
       * verwendet.
       */

      const converted =
        new THREE.Matrix4()
          .copy(
            this.context
              ._projectionAxisTransformMatrix
          );

      converted.multiply(
        modelViewMatrix
      );

      /*
       * ARToolKit:
       * Z = Markernormale
       *
       * AR.js / A-Frame:
       * Y = Markernormale
       */

      const markerAxisTransform =
        new THREE.Matrix4()
          .makeRotationX(
            Math.PI / 2
          );

      converted.multiply(
        markerAxisTransform
      );

      /*
       * Die Multimarker-Konfiguration
       * verwendet Millimeter.
       *
       * ARToolKit liefert deshalb auch
       * Translationen in Millimetern.
       *
       * Unser bisheriges A-Frame-Modell
       * verwendet Markerbreite = 1.
       *
       * 40 mm entsprechen also 1 Einheit.
       */

      const position =
        new THREE.Vector3();

      const quaternion =
        new THREE.Quaternion();

      const scale =
        new THREE.Vector3();

      converted.decompose(
        position,
        quaternion,
        scale
      );

      position.multiplyScalar(
        1 / 40
      );

      /*
       * KEINE Glättung.
       *
       * Genau die native Messung soll
       * zunächst sichtbar werden.
       */

      this.el.object3D.position.copy(
        position
      );

      this.el.object3D.quaternion.copy(
        quaternion
      );

      this.el.object3D.scale.set(
        1,
        1,
        1
      );

      this.el.object3D.visible =
        true;

      this.lastSeen =
        performance.now();

      this.receivedThisFrame =
        true;

      let visibleCount = 0;

      try {

        const count =
          this.controller
            .getMultiMarkerPatternCount(
              this.multiMarkerId
            );

        for (
          let i = 0;
          i < count;
          i++
        ) {

          const markerInfo =
            this.controller
              .getMultiEachMarker(
                this.multiMarkerId,
                i
              );

          if (
            markerInfo &&
            markerInfo.visible >= 0
          ) {

            visibleCount++;

          }

        }

      }

      catch (error) {

        /*
         * Diagnose ist optional.
         * Tracking darf davon niemals
         * beeinflusst werden.
         */

      }

      this.info.textContent =
        "Multimarker erkannt | sichtbar: "
        +
        visibleCount;

    },


    tick: function () {

      if (
        !this.initialized
      ) {

        this.tryInitialize();

        return;
      }

      const now =
        performance.now();

      if (
        now - this.lastSeen
        >
        this.holdTime
      ) {

        this.el.object3D.visible =
          false;

        this.info.textContent =
          "Multimarker: –";

      }

    }

  }
);


/* ==========================================================
   HAUPTPROGRAMM
   ========================================================== */

const sceneHost =
  document.getElementById(
    "sceneHost"
  );

const startScreen =
  document.getElementById(
    "startScreen"
  );

const rotateIcon =
  document.getElementById(
    "rotateIcon"
  );

const startTitle =
  document.getElementById(
    "startTitle"
  );

const startText =
  document.getElementById(
    "startText"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

let arStarted = false;
let cameraOptimized = false;


function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}


function isLandscape() {

  return (
    window.innerWidth >
    window.innerHeight
  );

}


function updateStartScreen() {

  if (
    !isMobileDevice()
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }

  if (
    arStarted
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }

  startScreen.classList.add(
    "visible"
  );

  if (
    !isLandscape()
  ) {

    rotateIcon.style.display =
      "block";

    startTitle.textContent =
      "Bitte Smartphone drehen";

    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";

    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";

    startTitle.textContent =
      "GeoChemAR";

    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";

    startButton.style.display =
      "block";

  }

}


/* ==========================================================
   AR-SZENE

   Wieder die bewährten 640 × 480.
   KEIN 320 × 240 aus 4e-10.
   ========================================================== */

function createARScene() {

  if (
    arStarted
  ) return;

  arStarted = true;

  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        canvasWidth: 640;
        canvasHeight: 480;
        maxDetectionRate: 30;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
      "

    >

      <!--
        Keine sechs a-marker mehr.

        ARToolKit verarbeitet cube.dat
        als EINEN Multimarker.
      -->

      <a-entity
        id="cubeRoot"
        native-multimarker
      >

        <a-entity
          id="methane"
          position="0 0 0"
          rotation="0 0 0"
          methane-model>
        </a-entity>

      </a-entity>


      <a-entity
        light="
          type: ambient;
          intensity: 1.0;
          color: #ffffff;
        ">
      </a-entity>


      <a-entity
        light="
          type: directional;
          intensity: 0.8;
          color: #ffffff;
        "
        position="1 2 1">
      </a-entity>


      <a-entity camera></a-entity>

    </a-scene>

  `;

  startScreen.classList.remove(
    "visible"
  );

}


/* ==========================================================
   MOBILER START
   ========================================================== */

async function startMobileAR() {

  if (
    !isLandscape()
  ) {

    updateStartScreen();

    return;

  }

  try {

    const element =
      document.documentElement;

    if (
      element.requestFullscreen
    ) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }

  try {

    if (
      screen.orientation &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }

  setTimeout(
    createARScene,
    400
  );

}


/* ==========================================================
   VIDEO
   ========================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}


/* ==========================================================
   EBENEN
   ========================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );

  const scene =
    document.getElementById(
      "arScene"
    );

  const video =
    getARVideo();

  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );

  if (host) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }

  if (scene) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );

    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }

  if (video) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.muted = true;

  }

  if (canvas) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );

    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}


/* ==========================================================
   VIDEO / CANVAS SYNCHRONISIEREN
   ========================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();

  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );

  if (
    !video ||
    !canvas
  ) return;

  const rect =
    video.getBoundingClientRect();

  if (
    rect.width <= 0 ||
    rect.height <= 0
  ) return;

  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );

  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );

  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );

  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );

  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );

  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}


/* ==========================================================
   SMARTPHONE-KAMERA
   Zurück zum bewährten 4e-6-Stand.
   ========================================================== */

async function optimizeMobileCamera() {

  if (
    cameraOptimized ||
    !arStarted
  ) return;

  if (
    !isMobileDevice()
  ) {

    cameraOptimized = true;

    return;

  }

  const video =
    getARVideo();

  if (
    !video ||
    !video.srcObject
  ) return;

  const tracks =
    video.srcObject.getVideoTracks();

  if (
    !tracks.length
  ) return;

  const track =
    tracks[0];

  try {

    await track.applyConstraints({

      width: {
        ideal: 640
      },

      height: {
        ideal: 480
      },

      aspectRatio: {
        ideal: 4 / 3
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }

  try {

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : null;

    if (
      capabilities &&
      capabilities.zoom
    ) {

      const desiredZoom =
        Math.max(
          capabilities.zoom.min,
          Math.min(
            1,
            capabilities.zoom.max
          )
        );

      await track.applyConstraints({

        advanced: [
          {
            zoom: desiredZoom
          }
        ]

      });

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }

  cameraOptimized = true;

}


/* ==========================================================
   ORIENTIERUNGSWECHSEL
   ========================================================== */

function orientationChanged() {

  if (
    !arStarted
  ) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }

  if (
    !isMobileDevice()
  ) return;

  if (
    !isLandscape()
  ) {

    const video =
      getARVideo();

    if (
      video &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

    location.reload();

  }

}


/* ==========================================================
   EVENTS
   ========================================================== */

startButton.addEventListener(
  "click",
  startMobileAR
);

window.addEventListener(

  "orientationchange",

  function() {

    setTimeout(
      orientationChanged,
      250
    );

  }

);

window.addEventListener(

  "resize",

  function() {

    if (
      !arStarted
    ) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);


/* ==========================================================
   START
   ========================================================== */

if (
  isMobileDevice()
) {

  updateStartScreen();

}

else {

  createARScene();

}


/* ==========================================================
   LAUFENDE PFLEGE
   ========================================================== */

setInterval(

  function() {

    if (
      !arStarted
    ) return;

    enforceLayers();

    optimizeMobileCamera();

    synchronizeVisualGeometry();

  },

  250

);

</script>

</body>
</html>
