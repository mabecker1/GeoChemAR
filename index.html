<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GeoChemAR – Kalibrierung Marker 1/2</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      max-width: 520px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0,0,0,0.78);
      color: white;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
      white-space: pre-line;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 9999;
      padding: 10px;
      background: rgba(150,0,0,0.9);
      color: white;
      font-size: 13px;
      white-space: pre-wrap;
      display: none;
    }

    canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 2 !important;
    }

    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
  </style>
</head>

<body>

<div id="status">Initialisierung …</div>
<div id="error"></div>


<script>
  window.addEventListener("error", function(event) {
    const box = document.getElementById("error");

    box.style.display = "block";

    box.textContent =
      "JavaScript-Fehler:\n" +
      event.message +
      "\n" +
      event.filename +
      "\nZeile " +
      event.lineno;
  });

  window.addEventListener("unhandledrejection", function(event) {
    const box = document.getElementById("error");

    box.style.display = "block";

    box.textContent =
      "Promise-Fehler:\n" +
      String(event.reason);
  });
</script>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js",
    "threex": "./libs/ar-threex.mjs"
  }
}
</script>


<script type="module">

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


function setStatus(text) {
  status.textContent = text;
}


function showError(error) {

  console.error(error);

  errorBox.style.display = "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error && error.stack
        ? error.stack
        : String(error)
    );

}


try {

  /* =====================================================
     MODULE
     ===================================================== */

  const THREE =
    await import("three");


  const THREEX =
    await import("threex");


  const {
    ArToolkitSource,
    ArToolkitContext,
    ArMarkerControls
  } = THREEX;



  /* =====================================================
     THREE.JS
     ===================================================== */

  const scene =
    new THREE.Scene();


  const camera =
    new THREE.Camera();


  scene.add(camera);


  const renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });


  renderer.setClearColor(
    0x000000,
    0
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  document.body.appendChild(
    renderer.domElement
  );



  /* =====================================================
     ZWEI MARKERROOTS
     ===================================================== */

  const marker1Root =
    new THREE.Group();


  const marker2Root =
    new THREE.Group();


  marker1Root.visible =
    false;


  marker2Root.visible =
    false;


  scene.add(
    marker1Root
  );


  scene.add(
    marker2Root
  );



  /* =====================================================
     AR SOURCE
     ===================================================== */

  const arToolkitSource =
    new ArToolkitSource({

      sourceType:
        "webcam",

      sourceWidth:
        640,

      sourceHeight:
        480,

      displayWidth:
        640,

      displayHeight:
        480

    });


  setStatus(
    "Kamera wird gestartet …"
  );


  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitSource.init(
          function() {
            resolve();
          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  /* =====================================================
     VIDEO
     ===================================================== */

  const video =
    arToolkitSource.domElement;


  if (!video) {

    throw new Error(
      "Kein Videoelement vorhanden."
    );

  }


  video.setAttribute(
    "playsinline",
    ""
  );


  video.muted =
    true;


  video.style.position =
    "fixed";

  video.style.top =
    "0px";

  video.style.left =
    "0px";

  video.style.zIndex =
    "1";

  video.style.visibility =
    "visible";

  video.style.opacity =
    "1";



  /* =====================================================
     AUF VIDEO WARTEN
     ===================================================== */

  if (
    video.readyState < 2 ||
    video.videoWidth === 0
  ) {

    await new Promise(
      (resolve, reject) => {

        const timeout =
          setTimeout(
            function() {

              reject(
                new Error(
                  "Kein Kamerabild nach 10 Sekunden."
                )
              );

            },
            10000
          );


        function ready() {

          if (
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {

            clearTimeout(
              timeout
            );


            video.removeEventListener(
              "canplay",
              ready
            );


            video.removeEventListener(
              "loadedmetadata",
              ready
            );


            resolve();

          }

        }


        video.addEventListener(
          "canplay",
          ready
        );


        video.addEventListener(
          "loadedmetadata",
          ready
        );


        ready();

      }
    );

  }



  /* =====================================================
     BEWÄHRTE KAMERA-CONSTRAINTS
     ===================================================== */

  try {

    const stream =
      video.srcObject;


    if (stream) {

      const tracks =
        stream.getVideoTracks();


      if (tracks.length > 0) {

        await tracks[0].applyConstraints({

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        });

      }

    }

  }

  catch(error) {

    console.warn(
      "Kamera-Constraints:",
      error
    );

  }



  /* =====================================================
     ARTOOLKIT
     ===================================================== */

  const arToolkitContext =
    new ArToolkitContext({

      cameraParametersUrl:
        "https://raw.githack.com/AR-js-org/AR.js/3.4.8/data/data/camera_para.dat",

      detectionMode:
        "mono_and_matrix",

      matrixCodeType:
        "3x3_HAMMING63",

      maxDetectionRate:
        30,

      canvasWidth:
        640,

      canvasHeight:
        480

    });



  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitContext.init(
          function() {

            try {

              camera
                .projectionMatrix
                .copy(
                  arToolkitContext
                    .getProjectionMatrix()
                );


              resolve();

            }

            catch(error) {
              reject(error);
            }

          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  /* =====================================================
     MARKER 1
     ===================================================== */

  const marker1Controls =
    new ArMarkerControls(

      arToolkitContext,

      marker1Root,

      {

        type:
          "barcode",

        barcodeValue:
          1,

        size:
          1,

        changeMatrixMode:
          "modelViewMatrix"

      }

    );



  /* =====================================================
     MARKER 2
     ===================================================== */

  const marker2Controls =
    new ArMarkerControls(

      arToolkitContext,

      marker2Root,

      {

        type:
          "barcode",

        barcodeValue:
          2,

        size:
          1,

        changeMatrixMode:
          "modelViewMatrix"

      }

    );



  /* =====================================================
     RESIZE
     ===================================================== */

  function onResize() {

    arToolkitSource
      .onResizeElement();


    arToolkitSource
      .copyElementSizeTo(
        renderer.domElement
      );


    if (
      arToolkitContext &&
      arToolkitContext.arController
    ) {

      arToolkitSource
        .copyElementSizeTo(
          arToolkitContext
            .arController
            .canvas
        );

    }

  }


  window.addEventListener(
    "resize",
    onResize
  );


  onResize();


  video.style.zIndex =
    "1";


  renderer.domElement.style.zIndex =
    "2";



  /* =====================================================
     RELATIVE TRANSFORMATION

     M12 = inverse(W1) * W2

     Damit beschreiben wir Marker 2
     im Koordinatensystem von Marker 1.
     ===================================================== */

  const inverse1 =
    new THREE.Matrix4();


  const relative12 =
    new THREE.Matrix4();


  const relativePosition =
    new THREE.Vector3();


  const relativeQuaternion =
    new THREE.Quaternion();


  const relativeScale =
    new THREE.Vector3();



  /* =====================================================
     STABILE MESSUNG

     Wir sammeln nur Frames, in denen
     BEIDE Marker gleichzeitig erkannt werden.
     ===================================================== */

  const samples =
    [];


  const REQUIRED_SAMPLES =
    30;


  let finished =
    false;



  function quaternionToText(q) {

    return (
      q.x.toFixed(5) + ", " +
      q.y.toFixed(5) + ", " +
      q.z.toFixed(5) + ", " +
      q.w.toFixed(5)
    );

  }



  function positionToText(p) {

    return (
      p.x.toFixed(4) + ", " +
      p.y.toFixed(4) + ", " +
      p.z.toFixed(4)
    );

  }



  function calculateAverage() {

    if (
      samples.length === 0
    ) {
      return null;
    }


    /* -------------------------
       Position mitteln
       ------------------------- */

    const avgPosition =
      new THREE.Vector3();


    samples.forEach(
      function(sample) {

        avgPosition.add(
          sample.position
        );

      }
    );


    avgPosition.multiplyScalar(
      1 / samples.length
    );



    /* -------------------------
       Quaternion mitteln

       Alle Quaternions zunächst
       auf dieselbe Hemisphäre
       bringen.
       ------------------------- */

    const reference =
      samples[0].quaternion;


    let x = 0;
    let y = 0;
    let z = 0;
    let w = 0;


    samples.forEach(
      function(sample) {

        const q =
          sample.quaternion.clone();


        if (
          reference.dot(q) < 0
        ) {

          q.x *= -1;
          q.y *= -1;
          q.z *= -1;
          q.w *= -1;

        }


        x += q.x;
        y += q.y;
        z += q.z;
        w += q.w;

      }
    );


    const avgQuaternion =
      new THREE.Quaternion(
        x,
        y,
        z,
        w
      );


    avgQuaternion.normalize();


    return {

      position:
        avgPosition,

      quaternion:
        avgQuaternion

    };

  }



  /* =====================================================
     RENDER LOOP
     ===================================================== */

  function animate() {

    requestAnimationFrame(
      animate
    );


    if (
      arToolkitSource.ready
    ) {

      arToolkitContext.update(
        arToolkitSource.domElement
      );

    }



    if (!finished) {

      if (
        marker1Root.visible &&
        marker2Root.visible
      ) {

        /*
         * MatrixWorld aktualisieren
         */

        marker1Root.updateMatrixWorld(
          true
        );


        marker2Root.updateMatrixWorld(
          true
        );


        /*
         * inverse(W1)
         */

        inverse1
          .copy(
            marker1Root.matrixWorld
          )
          .invert();


        /*
         * relative12 =
         * inverse(W1) * W2
         */

        relative12.multiplyMatrices(

          inverse1,

          marker2Root.matrixWorld

        );


        relative12.decompose(

          relativePosition,

          relativeQuaternion,

          relativeScale

        );


        samples.push({

          position:
            relativePosition.clone(),

          quaternion:
            relativeQuaternion.clone()

        });



        setStatus(

          "Marker 1 + 2 erkannt\n\n" +

          "Messung: " +
          samples.length +
          " / " +
          REQUIRED_SAMPLES +

          "\n\nWürfel möglichst ruhig halten."

        );



        if (
          samples.length >=
          REQUIRED_SAMPLES
        ) {

          finished =
            true;


          const result =
            calculateAverage();


          setStatus(

            "MESSUNG FERTIG\n\n" +

            "1 → 2\n\n" +

            "Position:\n" +
            positionToText(
              result.position
            ) +

            "\n\nQuaternion x,y,z,w:\n" +
            quaternionToText(
              result.quaternion
            ) +

            "\n\nDiese Werte bitte an mich schicken."

          );

        }

      }

      else {

        let visibleText =
          "Keiner";


        if (
          marker1Root.visible &&
          !marker2Root.visible
        ) {

          visibleText =
            "nur Marker 1";

        }


        if (
          !marker1Root.visible &&
          marker2Root.visible
        ) {

          visibleText =
            "nur Marker 2";

        }


        setStatus(

          "Kalibrierung Marker 1 ↔ 2\n\n" +

          "Sichtbar: " +
          visibleText +

          "\n\nBitte Würfel so halten,\n" +
          "dass Marker 1 UND 2 sichtbar sind." +

          "\n\nMessung: " +
          samples.length +
          " / " +
          REQUIRED_SAMPLES

        );

      }

    }


    renderer.render(
      scene,
      camera
    );

  }


  animate();

}

catch(error) {

  showError(error);

}

</script>

</body>
</html>
