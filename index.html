<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>GeoChemAR – OpenCV Diagnosetest</title>

<style>
html,
body {
  margin: 0;
  padding: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
}

#status {
  margin: 20px;
  padding: 15px;
  background: #222;
  border-radius: 8px;
  white-space: pre-wrap;
  font-size: 16px;
  line-height: 1.5;
}

.ok {
  color: #70ff70;
}

.error {
  color: #ff7070;
}
</style>
</head>

<body>

<div id="status">HTML geladen ✓</div>

<script>

const status =
  document.getElementById("status");

function addStatus(text) {

  status.textContent +=
    "\n" + text;

}

addStatus(
  "Normales JavaScript läuft ✓"
);


/* =====================================================
   GLOBALE FEHLER SICHTBAR MACHEN
   ===================================================== */

window.addEventListener(
  "error",
  event => {

    addStatus(
      "\n❌ JAVASCRIPT-FEHLER:\n" +
      event.message +
      "\nDatei: " +
      event.filename +
      "\nZeile: " +
      event.lineno
    );

  }
);

window.addEventListener(
  "unhandledrejection",
  event => {

    addStatus(
      "\n❌ PROMISE-FEHLER:\n" +
      String(event.reason)
    );

  }
);


/* =====================================================
   TEST STARTEN
   ===================================================== */

async function runTest() {

  try {

    /* -----------------------------------------------
       1. THREE.JS
       ----------------------------------------------- */

    addStatus(
      "\n1. Three.js wird geladen …"
    );

    const THREE =
      await import(
        "./libs/three.module.min.js"
      );

    addStatus(
      "   Three.js geladen ✓"
    );

    addStatus(
      "   THREE.REVISION = " +
      THREE.REVISION
    );


    /* -----------------------------------------------
       2. COMLINK
       ----------------------------------------------- */

    addStatus(
      "\n2. Comlink wird geladen …"
    );

    const Comlink =
      await import(
        "https://unpkg.com/comlink/dist/esm/comlink.mjs"
      );

    addStatus(
      "   Comlink geladen ✓"
    );


    /* -----------------------------------------------
       3. OPENCV.JS DATEI
       ----------------------------------------------- */

    addStatus(
      "\n3. opencv.js wird geladen …"
    );


    await new Promise(
      (resolve, reject) => {

        const script =
          document.createElement(
            "script"
          );

        script.src =
          "./libs/opencv.js";

        script.async =
          true;


        script.onload =
          () => {

            addStatus(
              "   opencv.js-Datei geladen ✓"
            );

            resolve();

          };


        script.onerror =
          () => {

            reject(
              new Error(
                "libs/opencv.js konnte nicht geladen werden."
              )
            );

          };


        document.head.appendChild(
          script
        );

      }
    );


    /* -----------------------------------------------
       4. CV UNTERSUCHEN
       ----------------------------------------------- */

    addStatus(
      "\n4. cv wird untersucht …"
    );


    addStatus(
      "   typeof cv = " +
      typeof window.cv
    );


    if (
      typeof window.cv ===
      "undefined"
    ) {

      throw new Error(
        "opencv.js wurde geladen, aber window.cv existiert nicht."
      );

    }


    const isPromise =
      window.cv &&
      typeof window.cv.then ===
      "function";


    addStatus(
      "   cv ist Promise: " +
      (
        isPromise
          ? "JA"
          : "NEIN"
      )
    );


    /* -----------------------------------------------
       5. PROMISE FALLS NÖTIG AUFLÖSEN
       ----------------------------------------------- */

    let resolvedCV =
      window.cv;


    if (isPromise) {

      addStatus(
        "\n5. Warte auf cv-Promise …"
      );


      resolvedCV =
        await Promise.race([

          window.cv,

          new Promise(
            (_, reject) => {

              setTimeout(
                () => {

                  reject(
                    new Error(
                      "cv-Promise nach 20 Sekunden noch nicht aufgelöst."
                    )
                  );

                },
                20000
              );

            }
          )

        ]);


      addStatus(
        "   cv-Promise aufgelöst ✓"
      );

    }

    else {

      addStatus(
        "\n5. Kein cv-Promise vorhanden."
      );

    }


    /* -----------------------------------------------
       6. OPENCV FUNKTIONEN
       ----------------------------------------------- */

    addStatus(
      "\n6. OpenCV-Funktionen:"
    );


    addStatus(
      "   Mat: " +
      typeof resolvedCV.Mat
    );


    addStatus(
      "   matFromArray: " +
      typeof resolvedCV.matFromArray
    );


    addStatus(
      "   solvePnP: " +
      typeof resolvedCV.solvePnP
    );


    addStatus(
      "   Rodrigues: " +
      typeof resolvedCV.Rodrigues
    );


    if (
      typeof resolvedCV.Mat !==
        "function" ||
      typeof resolvedCV.solvePnP !==
        "function" ||
      typeof resolvedCV.Rodrigues !==
        "function"
    ) {

      throw new Error(
        "OpenCV wurde geladen, aber benötigte Funktionen fehlen."
      );

    }


    addStatus(
      "\n=============================="
    );

    addStatus(
      "✅ OPENCV IST VOLLSTÄNDIG BEREIT"
    );

    addStatus(
      "=============================="
    );

  }

  catch(error) {

    console.error(
      error
    );

    addStatus(
      "\n=============================="
    );

    addStatus(
      "❌ FEHLER"
    );

    addStatus(
      String(
        error?.stack ||
        error
      )
    );

    addStatus(
      "=============================="
    );

  }

}


/*
 * Wichtig:
 *
 * Dieser Aufruf erfolgt aus einem normalen
 * klassischen Script und hängt daher NICHT
 * von einem statischen ES-Modul-Import ab.
 */

runTest();

</script>

</body>
</html>
