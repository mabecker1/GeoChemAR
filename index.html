<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GeoChemAR – MultiMarker Pose-Diagnose</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#status {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 9999;

  padding: 10px 14px;
  border-radius: 8px;

  background: rgba(0,0,0,0.82);
  color: white;

  font-size: 14px;
  line-height: 1.45;
  white-space: pre-line;
  pointer-events: none;
}

#error {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 9999;

  padding: 10px;

  background: rgba(150,0,0,0.9);
  color: white;

  font-size: 13px;
  white-space: pre-wrap;

  display: none;
}

canvas {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  z-index: 2 !important;
}

video {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  z-index: 1 !important;

  visibility: visible !important;
  opacity: 1 !important;
}
</style>
</head>

<body>

<div id="status">Initialisierung …</div>
<div id="error"></div>


<script>

window.addEventListener(
  "error",
  function(event) {

    const box =
      document.getElementById("error");

    box.style.display =
      "block";

    box.textContent =
      "JavaScript-Fehler:\n" +
      event.message +
      "\n" +
      event.filename +
      "\nZeile " +
      event.lineno;
  }
);


window.addEventListener(
  "unhandledrejection",
  function(event) {

    const box =
      document.getElementById("error");

    box.style.display =
      "block";

    box.textContent =
      "Promise-Fehler:\n" +
      String(event.reason);
  }
);

</script>


<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.min.js",
    "threex": "./libs/ar-threex.mjs"
  }
}
</script>


<script type="module">

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");


function showError(error) {

  console.error(error);

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "FEHLER:\n" +
    (
      error && error.stack
        ? error.stack
        : String(error)
    );
}


try {

  /* =====================================================
     MODULE
     ===================================================== */

  const THREE =
    await import("three");


  const THREEX =
    await import("threex");


  const {
    ArToolkitSource,
    ArToolkitContext,
    ArMarkerControls
  } = THREEX;



  /* =====================================================
     THREE
     ===================================================== */

  const scene =
    new THREE.Scene();


  const camera =
    new THREE.Camera();


  scene.add(
    camera
  );


  const renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });


  renderer.setClearColor(
    0x000000,
    0
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  document.body.appendChild(
    renderer.domElement
  );



  /* =====================================================
     NORMALE MARKERROOTS

     Nur damit wir gleichzeitig wissen,
     welche Seiten tatsächlich erkannt sind.
     ===================================================== */

  const marker1Root =
    new THREE.Group();


  const marker2Root =
    new THREE.Group();


  marker1Root.visible =
    false;


  marker2Root.visible =
    false;


  scene.add(
    marker1Root
  );


  scene.add(
    marker2Root
  );



  /* =====================================================
     MULTIMARKER ROOT
     ===================================================== */

  const cubeRoot =
    new THREE.Group();


  cubeRoot.matrixAutoUpdate =
    false;


  cubeRoot.visible =
    false;


  scene.add(
    cubeRoot
  );



  /* =====================================================
     METHAN
     ===================================================== */

  const methane =
    new THREE.Group();


  const carbonRadius =
    0.22;

  const hydrogenRadius =
    0.14;

  const hydrogenDistance =
    0.72;

  const bondRadius =
    0.040;


  const carbonMaterial =
    new THREE.MeshBasicMaterial({
      color: 0x202020
    });


  const hydrogenMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xffffff
    });


  const bondMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xb8bec7
    });



  const carbon =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        carbonRadius,
        48,
        32
      ),

      carbonMaterial

    );


  methane.add(
    carbon
  );



  const directions = [

    new THREE.Vector3(
      1,
      1,
      1
    ).normalize(),

    new THREE.Vector3(
      1,
      -1,
      -1
    ).normalize(),

    new THREE.Vector3(
      -1,
      1,
      -1
    ).normalize(),

    new THREE.Vector3(
      -1,
      -1,
      1
    ).normalize()

  ];



  directions.forEach(
    function(direction) {

      const hydrogen =
        new THREE.Mesh(

          new THREE.SphereGeometry(
            hydrogenRadius,
            40,
            28
          ),

          hydrogenMaterial

        );


      hydrogen.position.copy(

        direction
          .clone()
          .multiplyScalar(
            hydrogenDistance
          )

      );


      methane.add(
        hydrogen
      );



      const startDistance =
        carbonRadius;


      const endDistance =
        hydrogenDistance -
        hydrogenRadius;


      const startPoint =
        direction
          .clone()
          .multiplyScalar(
            startDistance
          );


      const endPoint =
        direction
          .clone()
          .multiplyScalar(
            endDistance
          );


      const bondVector =
        endPoint
          .clone()
          .sub(
            startPoint
          );


      const bondLength =
        bondVector.length();


      const bondGeometry =
        new THREE.CylinderGeometry(
          bondRadius,
          bondRadius,
          bondLength,
          32,
          1,
          false
        );


      const bond =
        new THREE.Mesh(
          bondGeometry,
          bondMaterial
        );


      bond.position.copy(

        startPoint
          .clone()
          .add(
            endPoint
          )
          .multiplyScalar(
            0.5
          )

      );


      bond.quaternion.setFromUnitVectors(

        new THREE.Vector3(
          0,
          1,
          0
        ),

        direction

      );


      methane.add(
        bond
      );

    }
  );



  methane.scale.setScalar(
    40
  );


  methane.position.set(
    0,
    0,
    0
  );


  cubeRoot.add(
    methane
  );



  /* =====================================================
     KAMERA
     ===================================================== */

  const arToolkitSource =
    new ArToolkitSource({

      sourceType:
        "webcam",

      sourceWidth:
        640,

      sourceHeight:
        480,

      displayWidth:
        640,

      displayHeight:
        480

    });


  status.textContent =
    "Kamera wird gestartet …";


  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitSource.init(
          function() {
            resolve();
          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  const video =
    arToolkitSource.domElement;


  if (!video) {

    throw new Error(
      "Kein Videoelement vorhanden."
    );

  }


  video.setAttribute(
    "playsinline",
    ""
  );


  video.muted =
    true;


  video.style.position =
    "fixed";

  video.style.top =
    "0px";

  video.style.left =
    "0px";

  video.style.zIndex =
    "1";

  video.style.visibility =
    "visible";

  video.style.opacity =
    "1";



  /* =====================================================
     AUF VIDEO WARTEN
     ===================================================== */

  if (
    video.readyState < 2 ||
    video.videoWidth === 0
  ) {

    await new Promise(
      (resolve, reject) => {

        const timeout =
          setTimeout(
            function() {

              reject(
                new Error(
                  "Kein Kamerabild nach 10 Sekunden."
                )
              );

            },
            10000
          );


        function ready() {

          if (
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {

            clearTimeout(
              timeout
            );


            video.removeEventListener(
              "canplay",
              ready
            );


            video.removeEventListener(
              "loadedmetadata",
              ready
            );


            resolve();

          }

        }


        video.addEventListener(
          "canplay",
          ready
        );


        video.addEventListener(
          "loadedmetadata",
          ready
        );


        ready();

      }
    );

  }



  /* =====================================================
     BEWÄHRTE KAMERAEINSTELLUNGEN
     ===================================================== */

  try {

    const stream =
      video.srcObject;


    if (stream) {

      const tracks =
        stream.getVideoTracks();


      if (
        tracks.length > 0
      ) {

        await tracks[0].applyConstraints({

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          },

          aspectRatio: {
            ideal: 4 / 3
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        });

      }

    }

  }

  catch(error) {

    console.warn(
      "Kamera-Constraints:",
      error
    );

  }



  /* =====================================================
     ARTOOLKIT
     ===================================================== */

  status.textContent =
    "ARToolKit wird initialisiert …";


  const arToolkitContext =
    new ArToolkitContext({

      cameraParametersUrl:
        "https://raw.githack.com/AR-js-org/AR.js/3.4.8/data/data/camera_para.dat",

      detectionMode:
        "mono_and_matrix",

      matrixCodeType:
        "3x3_HAMMING63",

      maxDetectionRate:
        30,

      canvasWidth:
        640,

      canvasHeight:
        480

    });



  await new Promise(
    (resolve, reject) => {

      try {

        arToolkitContext.init(
          function() {

            try {

              camera
                .projectionMatrix
                .copy(
                  arToolkitContext
                    .getProjectionMatrix()
                );


              resolve();

            }

            catch(error) {
              reject(error);
            }

          }
        );

      }

      catch(error) {
        reject(error);
      }

    }
  );



  const controller =
    arToolkitContext.arController;


  if (!controller) {

    throw new Error(
      "ARController nicht vorhanden."
    );

  }



  /* =====================================================
     NORMALE MARKER 1 UND 2
     ===================================================== */

  new ArMarkerControls(

    arToolkitContext,

    marker1Root,

    {
      type:
        "barcode",

      barcodeValue:
        1,

      size:
        1,

      changeMatrixMode:
        "modelViewMatrix"
    }

  );


  new ArMarkerControls(

    arToolkitContext,

    marker2Root,

    {
      type:
        "barcode",

      barcodeValue:
        2,

      size:
        1,

      changeMatrixMode:
        "modelViewMatrix"
    }

  );



  /* =====================================================
     MULTIMARKER LADEN
     ===================================================== */

  let multiMarkerId =
    null;


  let loadedMarkerCount =
    null;


  await new Promise(
    (resolve, reject) => {

      try {

        controller.loadMultiMarker(

          "./data/cube-12.dat",

          function(
            markerId,
            markerNum
          ) {

            multiMarkerId =
              markerId;


            loadedMarkerCount =
              markerNum;


            resolve();

          },

          function(error) {

            reject(
              new Error(
                "cube-12.dat konnte nicht geladen werden: " +
                String(error)
              )
            );

          }

        );

      }

      catch(error) {

        reject(error);

      }

    }
  );



  /* =====================================================
     POSE-DIAGNOSE
     ===================================================== */

  const measuredMatrix =
    new THREE.Matrix4();


  const measuredPosition =
    new THREE.Vector3();


  const measuredQuaternion =
    new THREE.Quaternion();


  const measuredScale =
    new THREE.Vector3();


  let multiEventCount =
    0;


  let lastSeenTime =
    0;


  let havePose =
    false;



  controller.addEventListener(

    "getMultiMarker",

    function(event) {

      if (
        !event ||
        !event.data ||
        event.data.multiMarkerId !==
          multiMarkerId ||
        !event.data.matrixGL_RH
      ) {

        return;

      }


      /*
       * Dieselbe Matrix wie in 4f-2b.
       */

      measuredMatrix.fromArray(
        event.data.matrixGL_RH
      );


      /*
       * Position und Rotation nur
       * für die Diagnose auslesen.
       */

      measuredMatrix.decompose(

        measuredPosition,

        measuredQuaternion,

        measuredScale

      );


      /*
       * Unverändert auch auf cubeRoot
       * übertragen.
       */

      cubeRoot.matrix.copy(
        measuredMatrix
      );


      cubeRoot.matrixWorldNeedsUpdate =
        true;


      cubeRoot.visible =
        true;


      multiEventCount++;


      lastSeenTime =
        performance.now();


      havePose =
        true;

    }

  );



  /* =====================================================
     RESIZE
     ===================================================== */

  function onResize() {

    arToolkitSource
      .onResizeElement();


    arToolkitSource
      .copyElementSizeTo(
        renderer.domElement
      );


    if (
      arToolkitContext &&
      arToolkitContext.arController
    ) {

      arToolkitSource
        .copyElementSizeTo(
          arToolkitContext
            .arController
            .canvas
        );

    }

  }


  window.addEventListener(
    "resize",
    onResize
  );


  onResize();


  video.style.zIndex =
    "1";


  renderer.domElement.style.zIndex =
    "2";



  /* =====================================================
     HILFSFUNKTIONEN
     ===================================================== */

  function f(value) {

    return Number(
      value
    ).toFixed(
      2
    );

  }


  function yesNo(value) {

    return value
      ? "JA"
      : "NEIN";

  }



  /* =====================================================
     LOOP
     ===================================================== */

  function animate() {

    requestAnimationFrame(
      animate
    );


    if (
      arToolkitSource.ready
    ) {

      arToolkitContext.update(
        arToolkitSource.domElement
      );

    }



    const recentlySeen =

      performance.now() -
      lastSeenTime

      < 150;


    if (
      !recentlySeen
    ) {

      cubeRoot.visible =
        false;

    }



    let visibility;


    if (
      marker1Root.visible &&
      marker2Root.visible
    ) {

      visibility =
        "1 + 2";

    }

    else if (
      marker1Root.visible
    ) {

      visibility =
        "nur 1";

    }

    else if (
      marker2Root.visible
    ) {

      visibility =
        "nur 2";

    }

    else {

      visibility =
        "keiner";

    }



    let poseText =
      "Noch keine Pose";


    if (
      havePose
    ) {

      poseText =

        "Position matrixGL_RH:\n" +

        "X = " +
        f(measuredPosition.x) +

        "\nY = " +
        f(measuredPosition.y) +

        "\nZ = " +
        f(measuredPosition.z) +

        "\n\nQuaternion x,y,z,w:\n" +

        f(measuredQuaternion.x) +
        ", " +

        f(measuredQuaternion.y) +
        ", " +

        f(measuredQuaternion.z) +
        ", " +

        f(measuredQuaternion.w);

    }



    status.textContent =

      "MULTIMARKER POSE-DIAGNOSE\n\n" +

      "Marker sichtbar: " +
      visibility +

      "\nMultiMarker-Pose aktuell: " +
      yesNo(
        recentlySeen
      ) +

      "\nEvents gesamt: " +
      multiEventCount +

      "\n\n" +

      poseText +

      "\n\n" +

      "Bitte nacheinander testen:\n" +

      "1. nur Marker 1\n" +
      "2. nur Marker 2\n" +
      "3. Marker 1 + 2";



    renderer.render(
      scene,
      camera
    );

  }


  animate();

}

catch(error) {

  showError(error);

}

</script>

</body>
</html>
