<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>GeoChemAR – Mobile Test</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #status {
      position: fixed;
      top: max(6px, env(safe-area-inset-top));
      left: 6px;
      right: 6px;
      z-index: 100000;

      box-sizing: border-box;

      padding: 6px 8px;

      background: rgba(0, 0, 0, 0.72);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 10px;
      line-height: 1.25;

      border-radius: 6px;

      white-space: normal;
      overflow-wrap: anywhere;

      pointer-events: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2;
    }

    canvas.a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
    }

    #arjs-video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      object-fit: cover !important;

      z-index: 1 !important;

      margin: 0 !important;

      transform: none !important;
    }
  </style>
</head>

<body>

<div id="status">
  GeoChemAR startet …
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="antialias: true; alpha: true;"
  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
    detectionMode: mono;
  "
>

  <a-marker
    preset="hiro"
    smooth="true"
    smoothCount="5"
    smoothTolerance="0.01"
    smoothThreshold="2"
  >

    <a-box
      position="0 0.5 0"
      scale="0.6 0.6 0.6"
      material="color: #2563eb; opacity: 0.8; transparent: true;"
    ></a-box>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>

const status = document.getElementById("status");

function fixVideoLayout() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  if (!video) return;

  video.setAttribute("playsinline", "");
  video.setAttribute("muted", "");
  video.autoplay = true;

  video.style.position = "fixed";
  video.style.top = "0";
  video.style.left = "0";

  video.style.width = "100vw";
  video.style.height = "100vh";

  video.style.objectFit = "cover";

  video.style.margin = "0";
  video.style.transform = "none";

  video.style.zIndex = "1";
}

function updateStatus() {

  const video =
    document.getElementById("arjs-video") ||
    document.querySelector("video");

  let text =
    "Display: " +
    window.innerWidth +
    "×" +
    window.innerHeight;

  text +=
    " | Orientierung: " +
    (window.innerWidth > window.innerHeight
      ? "Querformat"
      : "Hochformat");

  if (video) {

    text +=
      " | Kamera: " +
      video.videoWidth +
      "×" +
      video.videoHeight;

    text +=
      " | ready: " +
      video.readyState;

  } else {

    text += " | Kamera: nicht gefunden";

  }

  status.textContent = text;
}

function refreshLayout() {

  setTimeout(() => {

    fixVideoLayout();

    const scene = document.querySelector("a-scene");

    if (
      scene &&
      scene.renderer &&
      scene.camera
    ) {

      scene.resize();

    }

  }, 400);

}

setInterval(() => {

  fixVideoLayout();
  updateStatus();

}, 1000);

window.addEventListener(
  "resize",
  refreshLayout
);

window.addEventListener(
  "orientationchange",
  refreshLayout
);

window.addEventListener(
  "load",
  refreshLayout
);

</script>

</body>
</html>
