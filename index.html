<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Robuste Würfelkalibrierung</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #sceneHost {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10 !important;
      width: 100%;
      height: 100%;
      pointer-events: none !important;
    }

    #arScene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none !important;
      background: transparent !important;
    }

    #arjs-video {
      position: fixed !important;
      z-index: 1 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      z-index: 11 !important;
      visibility: visible !important;
      opacity: 1 !important;
      display: block !important;
      background: transparent !important;
      pointer-events: none !important;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: none;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 30px;
      background: #111;
      color: white;
      text-align: center;
    }

    #startScreen.visible {
      display: flex;
    }

    #startContent {
      width: 100%;
      max-width: 420px;
    }

    #rotateIcon {
      margin-bottom: 20px;
      font-size: 64px;
    }

    #startTitle {
      margin-bottom: 12px;
      font-size: 23px;
      font-weight: bold;
    }

    #startText {
      margin-bottom: 22px;
      font-size: 15px;

    }

    #startButton {
      display: none;
      margin: 0 auto;
      padding: 13px 25px;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111;
    }


    /* ======================================================
       KALIBRIERUNG
       ====================================================== */

    #calibrationPanel {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;

      box-sizing: border-box;

      width: 370px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);

      overflow-y: auto;

      padding: 12px 14px;

      border-radius: 10px;

      background: rgba(0, 0, 0, 0.76);
      color: white;

      font-size: 13px;
      line-height: 1.35;

      pointer-events: auto;
    }

    #calibrationTitle {
      margin-bottom: 7px;
      font-size: 17px;
      font-weight: bold;
    }

    #instruction {
      margin-bottom: 7px;
    }

    #visibleMarkers {
      margin-bottom: 7px;
      font-family: monospace;
    }

    #progress {
      margin-bottom: 7px;

    }

    #quality {
      margin-bottom: 7px;

    }

    #calibrationButton {
      display: none;

    }

  </style>
</head>


<body>


<div id="sceneHost"></div>


<div id="startScreen">

  <div id="startContent">

    <div id="rotateIcon">
      ↻
    </div>

    <div id="startTitle">
      Bitte Smartphone drehen
    </div>

    <div id="startText">
      GeoChemAR wird im Querformat verwendet.
    </div>

    <button id="startButton">
      AR starten
    </button>

  </div>

</div>


<div id="calibrationPanel">

  <div id="calibrationTitle">
    GeoChemAR – Würfelkalibrierung
  </div>

  <div id="instruction">
    AR wird vorbereitet …
  </div>

  <div id="visibleMarkers">
    Sichtbar: –
  </div>

  <div id="progress">
    –
  </div>

  <div id="quality"></div>

  <button id="calibrationButton">
    Messung starten
  </button>

  <div id="results"></div>

</div>



<script>


/* ==========================================================
   ROBUSTE MEHRWINKEL-KALIBRIERUNG
   ========================================================== */

AFRAME.registerComponent("cube-calibration", {


  init: function () {

    const THREE =
      AFRAME.THREE;


    this.markers =
      [];


    this.visible = [
      false,
      false,
      false,
      false,
      false,
      false
    ];


    /*
     * Verbindungsgraph des Würfels.
     */

    this.pairs = [

      [1, 0],
      [1, 2],
      [1, 4],
      [2, 3],
      [1, 5]

    ];


    /*
     * Fünf unterschiedliche Würfelstellungen
     * pro Seitenpaar.
     */

    this.measurementsPerPair =
      5;


    /*
     * Jede Einzelmessung mittelt 30 Frames.
     */

    this.framesPerMeasurement =
      30;


    this.currentPair =
      0;


    this.currentMeasurement =
      0;


    this.collecting =
      false;


    this.frameSamples =
      [];


    /*
     * pairMeasurements[pairIndex]
     * enthält später die fünf gemittelten
     * Einzelmessungen.
     */

    this.pairMeasurements =
      this.pairs.map(
        () => []
      );


    this.finalResults =
      [];


    this.instruction =
      document.getElementById(
        "instruction"
      );


    this.visibleMarkers =
      document.getElementById(
        "visibleMarkers"
      );


    this.progress =
      document.getElementById(
        "progress"
      );


    this.quality =
      document.getElementById(
        "quality"
      );


    this.button =
      document.getElementById(
        "calibrationButton"
      );


    this.results =
      document.getElementById(
        "results"
      );



    /*
     * Marker registrieren.
     */

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      const marker =
        document.getElementById(
          "marker" + i
        );


      this.markers[i] =
        marker;


      marker.addEventListener(

        "markerFound",

        () => {

          this.visible[i] =
            true;

        }

      );


      marker.addEventListener(

        "markerLost",

        () => {

          this.visible[i] =
            false;

        }

      );

    }



    /*
     * Messknopf
     */

    this.button.addEventListener(

      "click",

      () => {

        this.startMeasurement();

      }

    );


    this.updateUI();

  },



  /* ======================================================
     MESSUNG STARTEN
     ====================================================== */

  startMeasurement: function () {

    if (
      this.collecting
    ) {

      return;

    }


    if (
      this.currentPair >=
      this.pairs.length
    ) {

      return;

    }


    const pair =
      this.pairs[
        this.currentPair
      ];


    if (
      !this.visible[pair[0]]
      ||
      !this.visible[pair[1]]
    ) {

      return;

    }


    this.frameSamples =
      [];


    this.collecting =
      true;


    this.button.style.display =
      "none";


    this.quality.textContent =
      "";


    this.instruction.textContent =
      "Würfel jetzt ruhig halten …";

  },



  /* ======================================================
     RELATIVE MATRIX

     M_rel = inverse(M_A) × M_B

     Damit erhalten wir Marker B im
     Koordinatensystem von Marker A.
     ====================================================== */

  getRelativeMatrix: function (
    a,
    b
  ) {

    const THREE =
      AFRAME.THREE;


    const markerA =
      this.markers[a];


    const markerB =
      this.markers[b];


    markerA.object3D.updateMatrixWorld(
      true
    );


    markerB.object3D.updateMatrixWorld(
      true
    );


    const inverseA =
      new THREE.Matrix4()
        .copy(
          markerA.object3D.matrixWorld
        )
        .invert();


    return new THREE.Matrix4()
      .multiplyMatrices(

        inverseA,

        markerB.object3D.matrixWorld

      );

  },



  /* ======================================================
     MATRIX ZERLEGEN
     ====================================================== */

  decomposeMatrix: function (
    matrix
  ) {

    const THREE =
      AFRAME.THREE;


    const position =
      new THREE.Vector3();


    const quaternion =
      new THREE.Quaternion();


    const scale =
      new THREE.Vector3();


    matrix.decompose(

      position,
      quaternion,
      scale

    );


    quaternion.normalize();


    return {

      position:
        position,

      quaternion:
        quaternion

    };

  },



  /* ======================================================
     QUATERNION-WINKELABSTAND IN GRAD
     ====================================================== */

  quaternionAngle: function (
    q1,
    q2
  ) {

    let dot =
      Math.abs(
        q1.dot(q2)
      );


    dot =
      Math.min(
        1,
        Math.max(
          -1,
          dot
        )
      );


    return (

      2
      *
      Math.acos(dot)
      *
      180
      /
      Math.PI

    );

  },



  /* ======================================================
     QUATERNIONEN MITTELN
     ====================================================== */

  averageQuaternions: function (
    quaternions
  ) {

    const THREE =
      AFRAME.THREE;


    if (
      quaternions.length === 1
    ) {

      return quaternions[0].clone();

    }


    /*
     * Erst alle Quaternionen auf dieselbe
     * Hemisphäre bringen.
     */

    const reference =
      quaternions[0];


    let x = 0;
    let y = 0;
    let z = 0;
    let w = 0;


    for (
      const original of quaternions
    ) {

      const q =
        original.clone();


      if (
        reference.dot(q) < 0
      ) {

        q.set(
          -q.x,
          -q.y,
          -q.z,
          -q.w
        );

      }


      x += q.x;
      y += q.y;
      z += q.z;
      w += q.w;

    }


    return new THREE.Quaternion(

      x,
      y,
      z,
      w

    ).normalize();

  },



  /* ======================================================
     MITTELWERT EINER FRAME-SERIE
     ====================================================== */

  averageFrameSamples: function (
    samples
  ) {

    const THREE =
      AFRAME.THREE;


    const positions =
      [];


    const quaternions =
      [];


    for (
      const matrix of samples
    ) {

      const pose =
        this.decomposeMatrix(
          matrix
        );


      positions.push(
        pose.position
      );


      quaternions.push(
        pose.quaternion
      );

    }


    const avgPosition =
      new THREE.Vector3();


    for (
      const p of positions
    ) {

      avgPosition.add(
        p
      );

    }


    avgPosition.multiplyScalar(

      1 /
      positions.length

    );


    const avgQuaternion =
      this.averageQuaternions(
        quaternions
      );


    /*
     * Streuung innerhalb dieser 30 Frames.
     */

    let positionVariance =
      0;


    let rotationVariance =
      0;


    for (
      let i = 0;
      i < positions.length;
      i++
    ) {

      positionVariance +=

        positions[i]
          .distanceToSquared(
            avgPosition
          );


      const angle =

        this.quaternionAngle(

          quaternions[i],

          avgQuaternion

        );


      rotationVariance +=

        angle
        *
        angle;

    }


    const positionStd =

      Math.sqrt(

        positionVariance
        /
        positions.length

      );


    const rotationStd =

      Math.sqrt(

        rotationVariance
        /
        positions.length

      );


    return {

      position:
        avgPosition,

      quaternion:
        avgQuaternion,

      positionStd:
        positionStd,

      rotationStd:
        rotationStd

    };

  },



  /* ======================================================
     MEDIAN
     ====================================================== */

  median: function (
    values
  ) {

    const sorted =
      [...values]
        .sort(
          (a, b) => a - b
        );


    const middle =
      Math.floor(
        sorted.length / 2
      );


    if (
      sorted.length % 2 === 0
    ) {

      return (

        sorted[middle - 1]
        +
        sorted[middle]

      ) / 2;

    }


    return sorted[middle];

  },



  /* ======================================================
     ROBUSTES ERGEBNIS AUS DEN FÜNF BLICKWINKELN
     ====================================================== */

  calculateRobustResult: function (
    measurements
  ) {

    const THREE =
      AFRAME.THREE;


    /*
     * Zunächst Medianposition bestimmen.
     */

    const medianPosition =
      new THREE.Vector3(

        this.median(
          measurements.map(
            m => m.position.x
          )
        ),

        this.median(
          measurements.map(
            m => m.position.y
          )
        ),

        this.median(
          measurements.map(
            m => m.position.z
          )
        )

      );


    /*
     * Vorläufige mittlere Rotation.
     */

    const initialQuaternion =

      this.averageQuaternions(

        measurements.map(
          m => m.quaternion
        )

      );



    /*
     * Für jede der fünf Messungen bestimmen wir
     * den Positions- und Rotationsabstand.
     */

    const scored =
      measurements.map(

        (measurement, index) => {

          return {

            index: index,

            measurement:
              measurement,

            positionError:

              measurement.position
                .distanceTo(
                  medianPosition
                ),

            rotationError:

              this.quaternionAngle(

                measurement.quaternion,

                initialQuaternion

              )

          };

        }

      );



    /*
     * Robuste Schwellen über den Median der Fehler.
     */

    const medianPositionError =
      this.median(
        scored.map(
          s => s.positionError
        )
      );


    const medianRotationError =
      this.median(
        scored.map(
          s => s.rotationError
        )
      );


    /*
     * Mindestens kleine Toleranzen zulassen.
     *
     * Gleichzeitig darf ein stark abweichender
     * Blickwinkel verworfen werden.
     */

    const positionThreshold =
      Math.max(

        0.08,

        medianPositionError
        *
        2.5

      );


    const rotationThreshold =
      Math.max(

        5,

        medianRotationError
        *
        2.5

      );


    let accepted =
      scored.filter(

        s =>

          s.positionError
            <= positionThreshold

          &&

          s.rotationError
            <= rotationThreshold

      );



    /*
     * Falls durch extrem unruhige Daten weniger als
     * drei übrig bleiben, verwenden wir die drei
     * insgesamt ähnlichsten Messungen.
     */

    if (
      accepted.length < 3
    ) {

      const ranked =
        [...scored]
          .sort(

            (a, b) => {

              const scoreA =

                a.positionError
                /
                Math.max(
                  positionThreshold,
                  0.001
                )

                +

                a.rotationError
                /
                Math.max(
                  rotationThreshold,
                  0.001
                );


              const scoreB =

                b.positionError
                /
                Math.max(
                  positionThreshold,
                  0.001
                )

                +

                b.rotationError
                /
                Math.max(
                  rotationThreshold,
                  0.001
                );


              return scoreA - scoreB;

            }

          );


      accepted =
        ranked.slice(
          0,
          Math.min(
            3,
            ranked.length
          )
        );

    }



    const acceptedMeasurements =

      accepted.map(
        s => s.measurement
      );



    /*
     * Endposition
     */

    const finalPosition =
      new THREE.Vector3();


    for (
      const m of acceptedMeasurements
    ) {

      finalPosition.add(
        m.position
      );

    }


    finalPosition.multiplyScalar(

      1 /
      acceptedMeasurements.length

    );



    /*
     * Endrotation
     */

    const finalQuaternion =

      this.averageQuaternions(

        acceptedMeasurements.map(
          m => m.quaternion
        )

      );



    /*
     * Streuung der Blickwinkel um das Endergebnis.
     */

    let positionVariance =
      0;


    let rotationVariance =
      0;


    for (
      const m of acceptedMeasurements
    ) {

      const pError =

        m.position.distanceTo(
          finalPosition
        );


      positionVariance +=

        pError
        *
        pError;


      const rError =

        this.quaternionAngle(

          m.quaternion,

          finalQuaternion

        );


      rotationVariance +=

        rError
        *
        rError;

    }


    const positionStd =

      Math.sqrt(

        positionVariance
        /
        acceptedMeasurements.length

      );


    const rotationStd =

      Math.sqrt(

        rotationVariance
        /
        acceptedMeasurements.length

      );


    return {

      position:
        finalPosition,

      quaternion:
        finalQuaternion,

      positionStd:
        positionStd,

      rotationStd:
        rotationStd,

      accepted:
        acceptedMeasurements.length,

      total:
        measurements.length

    };

  },



  /* ======================================================
     QUALITÄTSTEXT
     ====================================================== */

  qualityText: function (
    result
  ) {

    let label;


    if (
      result.positionStd < 0.08
      &&
      result.rotationStd < 4
    ) {

      label =
        "gut";

    }

    else if (
      result.positionStd < 0.18
      &&
      result.rotationStd < 10
    ) {

      label =
        "mittel";

    }

    else {

      label =
        "stark schwankend";

    }


    return (

      label
      +
      " | Positionsstreuung "
      +
      result.positionStd.toFixed(3)
      +
      " | Rotationsstreuung "
      +
      result.rotationStd.toFixed(1)
      +
      "°"

    );

  },



  /* ======================================================
     UI
     ====================================================== */

  updateUI: function () {

    const visibleIDs =
      [];


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      if (
        this.visible[i]
      ) {

        visibleIDs.push(
          i
        );

      }

    }


    this.visibleMarkers.textContent =

      "Sichtbar: "
      +
      (
        visibleIDs.length
          ?
          visibleIDs.join(", ")
          :
          "–"
      );


    if (
      this.currentPair >=
      this.pairs.length
    ) {

      this.progress.textContent =
        "Kalibrierung abgeschlossen";


      this.button.style.display =
        "none";


      return;

    }


    const pair =
      this.pairs[
        this.currentPair
      ];


    this.progress.textContent =

      "Paar "
      +
      (this.currentPair + 1)
      +
      " / "
      +
      this.pairs.length
      +
      "   |   Blickwinkel "
      +
      (this.currentMeasurement + 1)
      +
      " / "
      +
      this.measurementsPerPair;


    if (
      this.collecting
    ) {

      return;

    }


    const bothVisible =

      this.visible[pair[0]]
      &&
      this.visible[pair[1]];


    if (
      bothVisible
    ) {

      this.button.style.display =
        "block";


      this.button.textContent =

        "Messung "
        +
        (this.currentMeasurement + 1)
        +
        " starten";

    }

    else {

      this.button.style.display =
        "none";

    }

  },



  /* ======================================================
     NÄCHSTE ANWEISUNG
     ====================================================== */

  showInstruction: function () {

    if (
      this.currentPair >=
      this.pairs.length
    ) {

      this.instruction.textContent =

        "Fertig. Bitte die Endergebnisse unten an ChatGPT schicken.";


      return;

    }


    const pair =
      this.pairs[
        this.currentPair
      ];


    if (
      this.currentMeasurement === 0
    ) {

      this.instruction.textContent =

        "Marker "
        +
        pair[0]
        +
        " und "
        +
        pair[1]
        +
        " gleichzeitig zeigen. Für jede Messung den Blickwinkel etwas verändern.";

    }

    else {

      this.instruction.textContent =

        "Jetzt den Würfel etwas anders zur Kamera halten. Beide Marker "
        +
        pair[0]
        +
        " und "
        +
        pair[1]
        +
        " müssen gut sichtbar sein.";

    }

  },



  /* ======================================================
     PAAR ABSCHLIESSEN
     ====================================================== */

  finishPair: function () {

    const pair =
      this.pairs[
        this.currentPair
      ];


    const measurements =
      this.pairMeasurements[
        this.currentPair
      ];


    const robust =
      this.calculateRobustResult(
        measurements
      );


    this.finalResults.push({

      a:
        pair[0],

      b:
        pair[1],

      position:
        robust.position.clone(),

      quaternion:
        robust.quaternion.clone(),

      positionStd:
        robust.positionStd,

      rotationStd:
        robust.rotationStd,

      accepted:
        robust.accepted,

      total:
        robust.total

    });



    this.quality.textContent =

      "Letztes Paar: "
      +
      this.qualityText(
        robust
      );


    this.currentPair++;


    this.currentMeasurement =
      0;


    if (
      this.currentPair >=
      this.pairs.length
    ) {

      this.showFinalResults();

      return;

    }


    this.showInstruction();

  },



  /* ======================================================
     ENDERGEBNIS
     ====================================================== */

  showFinalResults: function () {

    let text =

      "=== ENDERGEBNIS ===\n";


    for (
      const r of this.finalResults
    ) {

      text +=

        "\n"
        +
        r.a
        +
        " -> "
        +
        r.b
        +
        "\n";


      text +=

        "P: "
        +
        r.position.x.toFixed(4)
        +
        ", "
        +
        r.position.y.toFixed(4)
        +
        ", "
        +
        r.position.z.toFixed(4)
        +
        "\n";


      text +=

        "Q: "
        +
        r.quaternion.x.toFixed(5)
        +
        ", "
        +
        r.quaternion.y.toFixed(5)
        +
        ", "
        +
        r.quaternion.z.toFixed(5)
        +
        ", "
        +
        r.quaternion.w.toFixed(5)
        +
        "\n";


      text +=

        "Streuung Position: "
        +
        r.positionStd.toFixed(4)
        +
        "\n";


      text +=

        "Streuung Rotation: "
        +
        r.rotationStd.toFixed(2)
        +
        "°\n";


      text +=

        "Verwendet: "
        +
        r.accepted
        +
        " / "
        +
        r.total
        +
        "\n";

    }


    this.results.textContent =
      text;


    this.instruction.textContent =

      "Kalibrierung abgeschlossen. Bitte diese Endergebnisse an ChatGPT schicken.";


    this.progress.textContent =
      "5 / 5 Seitenpaare abgeschlossen";


    this.button.style.display =
      "none";


    console.log(
      text
    );

  },



  /* ======================================================
     TICK
     ====================================================== */

  tick: function () {

    this.updateUI();


    if (
      !this.collecting
    ) {

      return;

    }


    const pair =
      this.pairs[
        this.currentPair
      ];


    /*
     * Geht ein Marker während der Aufnahme verloren,
     * wird diese Einzelmessung verworfen.
     */

    if (
      !this.visible[pair[0]]
      ||
      !this.visible[pair[1]]
    ) {

      this.collecting =
        false;


      this.frameSamples =
        [];


      this.instruction.textContent =

        "Messung abgebrochen. Beide Marker müssen während der gesamten Messung sichtbar bleiben.";


      return;

    }



    const relativeMatrix =
      this.getRelativeMatrix(

        pair[0],

        pair[1]

      );


    this.frameSamples.push(
      relativeMatrix
    );


    this.instruction.textContent =

      "Würfel ruhig halten – "
      +
      this.frameSamples.length
      +
      " / "
      +
      this.framesPerMeasurement;


    if (
      this.frameSamples.length <
      this.framesPerMeasurement
    ) {

      return;

    }



    /*
     * Einzelmessung fertig.
     */

    const measurement =

      this.averageFrameSamples(
        this.frameSamples
      );


    this.pairMeasurements[
      this.currentPair
    ].push(
      measurement
    );


    this.collecting =
      false;


    this.frameSamples =
      [];


    this.quality.textContent =

      "Einzelmessung: σ Position "
      +
      measurement.positionStd.toFixed(3)
      +
      " | σ Rotation "
      +
      measurement.rotationStd.toFixed(1)
      +
      "°";


    this.currentMeasurement++;



    /*
     * Fünf Blickwinkel vollständig?
     */

    if (
      this.currentMeasurement >=
      this.measurementsPerPair
    ) {

      this.finishPair();

    }

    else {

      this.showInstruction();

    }

  }

});



/* ==========================================================
   HAUPTPROGRAMM
   ========================================================== */

const sceneHost =
  document.getElementById(
    "sceneHost"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const rotateIcon =
  document.getElementById(
    "rotateIcon"
  );


const startTitle =
  document.getElementById(
    "startTitle"
  );


const startText =
  document.getElementById(
    "startText"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


let arStarted =
  false;


let cameraOptimized =
  false;



function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}



function isLandscape() {

  return (
    window.innerWidth
    >
    window.innerHeight
  );

}



function updateStartScreen() {

  if (
    !isMobileDevice()
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (
    arStarted
  ) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (
    !isLandscape()
  ) {

    rotateIcon.style.display =
      "block";


    startTitle.textContent =
      "Bitte Smartphone drehen";


    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";


    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";


    startTitle.textContent =
      "GeoChemAR";


    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";


    startButton.style.display =
      "block";

  }

}



/* ==========================================================
   AR-SZENE
   ========================================================== */

function createARScene() {

  if (
    arStarted
  ) {

    return;

  }


  arStarted =
    true;


  sceneHost.innerHTML = `

    <a-scene

      id="arScene"

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
      "

    >


      <a-marker
        id="marker0"
        type="barcode"
        value="0"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker1"
        type="barcode"
        value="1"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker2"
        type="barcode"
        value="2"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker3"
        type="barcode"
        value="3"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker4"
        type="barcode"
        value="4"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-marker
        id="marker5"
        type="barcode"
        value="5"
        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2">
      </a-marker>


      <a-entity
        cube-calibration>
      </a-entity>


      <a-entity camera></a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );


  /*
   * Nach dem Erzeugen der Szene erste
   * Kalibrierungsanweisung anzeigen.
   */

  setTimeout(

    function () {

      const calibrationEntity =
        document.querySelector(
          "[cube-calibration]"
        );


      if (
        calibrationEntity
        &&
        calibrationEntity.components
        &&
        calibrationEntity.components[
          "cube-calibration"
        ]
      ) {

        calibrationEntity.components[
          "cube-calibration"
        ].showInstruction();

      }

    },

    1000

  );

}



/* ==========================================================
   MOBILER START
   ========================================================== */

async function startMobileAR() {

  if (
    !isLandscape()
  ) {

    updateStartScreen();

    return;

  }


  try {

    const element =
      document.documentElement;


    if (
      element.requestFullscreen
    ) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }


  try {

    if (
      screen.orientation
      &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }


  setTimeout(
    createARScene,
    400
  );

}



/* ==========================================================
   AR-VIDEO
   ========================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ==========================================================
   EBENEN
   ========================================================== */

function enforceLayers() {

  const host =
    document.getElementById(
      "sceneHost"
    );


  const scene =
    document.getElementById(
      "arScene"
    );


  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (host) {

    host.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    host.style.setProperty(
      "z-index",
      "10",
      "important"
    );

  }


  if (scene) {

    scene.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    scene.style.setProperty(
      "z-index",
      "10",
      "important"
    );

    scene.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    scene.style.setProperty(
      "opacity",
      "1",
      "important"
    );

  }


  if (video) {

    video.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    video.style.setProperty(
      "z-index",
      "1",
      "important"
    );

    video.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    video.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.muted =
      true;

  }


  if (canvas) {

    canvas.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    canvas.style.setProperty(
      "z-index",
      "11",
      "important"
    );

    canvas.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    canvas.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    canvas.style.setProperty(
      "display",
      "block",
      "important"
    );

    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ==========================================================
   VIDEO / CANVAS SYNCHRONISIEREN
   ========================================================== */

function synchronizeVisualGeometry() {

  const video =
    getARVideo();


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (
    !video
    ||
    !canvas
  ) {

    return;

  }


  const rect =
    video.getBoundingClientRect();


  if (
    rect.width <= 0
    ||
    rect.height <= 0
  ) {

    return;

  }


  canvas.style.setProperty(
    "left",
    rect.left + "px",
    "important"
  );


  canvas.style.setProperty(
    "top",
    rect.top + "px",
    "important"
  );


  canvas.style.setProperty(
    "width",
    rect.width + "px",
    "important"
  );


  canvas.style.setProperty(
    "height",
    rect.height + "px",
    "important"
  );


  canvas.style.setProperty(
    "right",
    "auto",
    "important"
  );


  canvas.style.setProperty(
    "bottom",
    "auto",
    "important"
  );

}



/* ==========================================================
   MOBILE KAMERAOPTIMIERUNG
   ========================================================== */

async function optimizeMobileCamera() {

  if (
    cameraOptimized
    ||
    !arStarted
  ) {

    return;

  }


  if (
    !isMobileDevice()
  ) {

    cameraOptimized =
      true;

    return;

  }


  const video =
    getARVideo();


  if (
    !video
    ||
    !video.srcObject
  ) {

    return;

  }


  const tracks =
    video.srcObject.getVideoTracks();


  if (
    !tracks.length
  ) {

    return;

  }


  const track =
    tracks[0];


  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }


  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        const desiredZoom =

          Math.max(

            capabilities.zoom.min,

            Math.min(
              1,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized =
    true;

}



/* ==========================================================
   ORIENTIERUNGSWECHSEL
   ========================================================== */

function orientationChanged() {

  if (
    !arStarted
  ) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (
    !isMobileDevice()
  ) {

    return;

  }


  if (
    !isLandscape()
  ) {

    const video =
      getARVideo();


    if (
      video
      &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    location.reload();

  }

}



/* ==========================================================
   EVENTS
   ========================================================== */

startButton.addEventListener(
  "click",
  startMobileAR
);


window.addEventListener(

  "orientationchange",

  function () {

    setTimeout(
      orientationChanged,
      250
    );

  }

);


window.addEventListener(

  "resize",

  function () {

    if (
      !arStarted
    ) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);



/* ==========================================================
   START
   ========================================================== */

if (
  isMobileDevice()
) {

  updateStartScreen();

}

else {

  createARScene();

}



/* ==========================================================
   LAUFENDE PFLEGE
   ========================================================== */

setInterval(

  function () {

    if (
      !arStarted
    ) {

      return;

    }


    enforceLayers();

    optimizeMobileCamera();

    synchronizeVisualGeometry();

  },

  250

);


</script>
