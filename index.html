<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Kamera-Diagnose</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      background: transparent;

      font-family: Arial, sans-serif;
    }


    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }


    /*
      Nur Sichtbarkeit korrigieren.
      Keine Größenänderung!
    */

    #arjs-video {
      z-index: 0 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }


    canvas.a-canvas {
      z-index: 1 !important;
      background: transparent !important;
    }


    #status {

      position: fixed;

      top: 6px;
      left: 6px;
      right: 6px;

      z-index: 100000;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.78);

      color: white;

      font-size: 10px;
      line-height: 1.35;

      border-radius: 6px;

      pointer-events: none;
    }

  </style>

</head>


<body>


  <div id="status">
    GeoChemAR startet …
  </div>


  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    renderer="
      alpha: true;
      antialias: true;
    "

    arjs="
      sourceType: webcam;
      sourceWidth: 640;
      sourceHeight: 480;
      displayWidth: 640;
      displayHeight: 480;
      canvasWidth: 640;
      canvasHeight: 480;
      debugUIEnabled: false;
      detectionMode: mono;
    "

  >


    <a-marker
      preset="hiro"

      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >

      <a-box

        position="0 0.3 0"

        width="0.6"
        height="0.6"
        depth="0.6"

        material="
          color: #2563eb;
          opacity: 0.8;
          transparent: true;
          side: double;
        "

      >
      </a-box>

    </a-marker>


    <a-entity camera></a-entity>


  </a-scene>



  <script>

    const status =
      document.getElementById("status");


    function getVideo() {

      return (
        document.getElementById("arjs-video")
        ||
        document.querySelector("video")
      );

    }



    function keepVisible() {

      const video = getVideo();

      if (!video) {
        return;
      }


      video.style.setProperty(
        "z-index",
        "0",
        "important"
      );

      video.style.setProperty(
        "visibility",
        "visible",
        "important"
      );

      video.style.setProperty(
        "opacity",
        "1",
        "important"
      );


      const canvas =
        document.querySelector(
          "canvas.a-canvas"
        );


      if (canvas) {

        canvas.style.setProperty(
          "z-index",
          "1",
          "important"
        );

        canvas.style.setProperty(
          "background",
          "transparent",
          "important"
        );

      }

    }



    async function readCameraInfo() {

      const video = getVideo();


      if (!video) {

        status.textContent =
          "Videoelement noch nicht vorhanden …";

        return;
      }


      let text =

        "Fenster "
        +
        window.innerWidth
        +
        "×"
        +
        window.innerHeight;


      text +=

        " | Video "
        +
        video.videoWidth
        +
        "×"
        +
        video.videoHeight;


      text +=

        " | ready="
        +
        video.readyState;



      const stream =
        video.srcObject;


      if (!stream) {

        text +=
          " | Kein Stream";

        status.textContent =
          text;

        return;
      }


      const tracks =
        stream.getVideoTracks();


      if (tracks.length === 0) {

        text +=
          " | Kein Video-Track";

        status.textContent =
          text;

        return;
      }


      const track =
        tracks[0];


      /*
        Kameraname
      */

      if (track.label) {

        text +=
          " | "
          +
          track.label;

      }


      /*
        Tatsächliche Einstellungen
      */

      if (track.getSettings) {

        const s =
          track.getSettings();


        if (s.width && s.height) {

          text +=

            " | Stream "
            +
            s.width
            +
            "×"
            +
            s.height;

        }


        if (s.frameRate) {

          text +=

            " @ "
            +
            Math.round(s.frameRate)
            +
            "fps";

        }


        if (s.facingMode) {

          text +=

            " | "
            +
            s.facingMode;

        }


        if (s.zoom !== undefined) {

          text +=

            " | Zoom="
            +
            s.zoom;

        }


        if (s.deviceId) {

          text +=

            " | ID="
            +
            s.deviceId.substring(0, 8)
            +
            "…";

        }

      }



      /*
        Fähigkeiten der Kamera
      */

      if (track.getCapabilities) {

        const c =
          track.getCapabilities();


        if (
          c.width &&
          c.width.min !== undefined
        ) {

          text +=

            " | Breite "
            +
            c.width.min
            +
            "–"
            +
            c.width.max;

        }


        if (
          c.height &&
          c.height.min !== undefined
        ) {

          text +=

            " | Höhe "
            +
            c.height.min
            +
            "–"
            +
            c.height.max;

        }


        if (
          c.zoom &&
          c.zoom.min !== undefined
        ) {

          text +=

            " | Zoombereich "
            +
            c.zoom.min
            +
            "–"
            +
            c.zoom.max;

        }

      }


      status.textContent =
        text;

    }



    setInterval(

      function () {

        keepVisible();
        readCameraInfo();

      },

      500

    );

  </script>


</body>

</html>
