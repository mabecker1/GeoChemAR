<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>GeoChemAR – Methan-Test</title>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

      font-family: Arial, sans-serif;
    }


    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }


    #sceneHost {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;
    }


    #arjs-video {
      z-index: 0 !important;

      visibility: visible !important;
      opacity: 1 !important;
    }


    canvas.a-canvas {
      z-index: 1 !important;

      background: transparent !important;
    }


    #startScreen {
      position: fixed;

      inset: 0;

      z-index: 2147483647;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding: 30px;

      background: #111;

      color: white;

      text-align: center;
    }


    #startScreen.visible {
      display: flex;
    }


    #startContent {
      width: 100%;
      max-width: 420px;
    }


    #rotateIcon {
      margin-bottom: 20px;

      font-size: 64px;
      line-height: 1;
    }


    #startTitle {
      margin-bottom: 12px;

      font-size: 23px;
      font-weight: bold;
    }


    #startText {
      margin-bottom: 22px;

      font-size: 15px;
      line-height: 1.45;

      opacity: 0.9;
    }


    #startButton {
      display: none;

      margin: 0 auto;

      padding: 13px 25px;

      border: 0;
      border-radius: 8px;

      background: white;
      color: #111;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }


    #status {
      position: fixed;

      top: max(6px, env(safe-area-inset-top));
      left: max(6px, env(safe-area-inset-left));
      right: max(6px, env(safe-area-inset-right));

      z-index: 100000;

      box-sizing: border-box;

      padding: 7px 9px;

      background: rgba(0, 0, 0, 0.76);

      color: white;

      font-size: 10px;
      line-height: 1.3;

      border-radius: 6px;

      pointer-events: none;
    }

  </style>

</head>


<body>


  <div id="sceneHost"></div>


  <div id="status">
    GeoChemAR startet …
  </div>


  <div id="startScreen">

    <div id="startContent">

      <div id="rotateIcon">
        ↻
      </div>

      <div id="startTitle">
        Bitte Smartphone drehen
      </div>

      <div id="startText">
        GeoChemAR wird im Querformat verwendet.
      </div>

      <button id="startButton">
        AR starten
      </button>

    </div>

  </div>



<script>


const sceneHost =
  document.getElementById("sceneHost");

const status =
  document.getElementById("status");

const startScreen =
  document.getElementById("startScreen");

const rotateIcon =
  document.getElementById("rotateIcon");

const startTitle =
  document.getElementById("startTitle");

const startText =
  document.getElementById("startText");

const startButton =
  document.getElementById("startButton");


let arStarted = false;
let cameraOptimized = false;



/* ==================================================
   Mobilgerät erkennen
   ================================================== */

function isMobileDevice() {

  return (

    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    )

    ||

    (
      navigator.maxTouchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) < 1000
    )

  );

}



/* ==================================================
   Querformat
   ================================================== */

function isLandscape() {

  return (
    window.innerWidth >
    window.innerHeight
  );

}



/* ==================================================
   Startbildschirm
   ================================================== */

function updateStartScreen() {

  if (!isMobileDevice()) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  if (arStarted) {

    startScreen.classList.remove(
      "visible"
    );

    return;

  }


  startScreen.classList.add(
    "visible"
  );


  if (!isLandscape()) {

    rotateIcon.style.display =
      "block";

    startTitle.textContent =
      "Bitte Smartphone drehen";

    startText.textContent =
      "GeoChemAR wird im Querformat verwendet.";

    startButton.style.display =
      "none";

  }

  else {

    rotateIcon.style.display =
      "none";

    startTitle.textContent =
      "GeoChemAR";

    startText.textContent =
      "Das Smartphone ist im Querformat. GeoChemAR kann jetzt gestartet werden.";

    startButton.style.display =
      "block";

  }

}



/* ==================================================
   AR-Szene erzeugen
   ================================================== */

function createARScene() {

  if (arStarted) {
    return;
  }


  arStarted = true;


  sceneHost.innerHTML = `

    <a-scene

      embedded

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

      renderer="
        alpha: true;
        antialias: true;
      "

      arjs="
        sourceType: webcam;
        sourceWidth: 640;
        sourceHeight: 480;
        debugUIEnabled: false;
        detectionMode: mono;
      "

    >


      <a-marker

        preset="hiro"

        smooth="true"
        smoothCount="3"
        smoothTolerance="0.01"
        smoothThreshold="2"

      >


        <!-- =======================================
             REFERENZWÜRFEL

             Das ist wieder exakt die einfache
             Darstellungsart, die funktioniert hat.
             ======================================= -->

        <a-box

          position="-0.65 0.30 0"

          width="0.25"
          height="0.25"
          depth="0.25"

          material="
            color: #2563eb;
            shader: flat;
            opacity: 0.9;
            transparent: true;
          "

        ></a-box>



        <!-- =======================================
             METHAN – nur die fünf Atome

             Molekülzentrum:
             (0.20, 0.60, 0)

             C-H-Abstand:
             0.48

             0.48 / sqrt(3)
             ≈ 0.2771
             ======================================= -->


        <!-- C -->

        <a-sphere

          position="0.20 0.60 0"

          radius="0.17"

          material="
            color: #222222;
            shader: flat;
          "

        ></a-sphere>



        <!-- H 1 -->

        <a-sphere

          position="0.4771 0.8771 0.2771"

          radius="0.11"

          material="
            color: #ffffff;
            shader: flat;
          "

        ></a-sphere>



        <!-- H 2 -->

        <a-sphere

          position="0.4771 0.3229 -0.2771"

          radius="0.11"

          material="
            color: #ffffff;
            shader: flat;
          "

        ></a-sphere>



        <!-- H 3 -->

        <a-sphere

          position="-0.0771 0.8771 -0.2771"

          radius="0.11"

          material="
            color: #ffffff;
            shader: flat;
          "

        ></a-sphere>



        <!-- H 4 -->

        <a-sphere

          position="-0.0771 0.3229 0.2771"

          radius="0.11"

          material="
            color: #ffffff;
            shader: flat;
          "

        ></a-sphere>


      </a-marker>


      <a-entity camera></a-entity>


    </a-scene>

  `;


  startScreen.classList.remove(
    "visible"
  );

}



/* ==================================================
   Smartphone starten
   ================================================== */

async function startMobileAR() {

  if (!isLandscape()) {

    updateStartScreen();

    return;

  }



  /* Vollbild */

  try {

    const element =
      document.documentElement;


    if (element.requestFullscreen) {

      await element.requestFullscreen();

    }

    else if (
      element.webkitRequestFullscreen
    ) {

      element.webkitRequestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Vollbildmodus nicht verfügbar.",
      error
    );

  }



  /* Querformat sperren */

  try {

    if (
      screen.orientation
      &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Orientierung konnte nicht gesperrt werden.",
      error
    );

  }



  /*
    AR.js erst starten, nachdem
    Vollbild/Querformat aufgebaut wurde.
  */

  setTimeout(

    function () {

      createARScene();

    },

    400

  );

}



/* ==================================================
   AR.js-Video finden
   ================================================== */

function getARVideo() {

  return (

    document.getElementById(
      "arjs-video"
    )

    ||

    document.querySelector(
      "video"
    )

  );

}



/* ==================================================
   Video sichtbar halten
   ================================================== */

function keepVideoVisible() {

  if (!arStarted) {
    return;
  }


  const video =
    getARVideo();


  if (!video) {
    return;
  }


  video.style.setProperty(
    "visibility",
    "visible",
    "important"
  );


  video.style.setProperty(
    "opacity",
    "1",
    "important"
  );


  video.style.setProperty(
    "z-index",
    "0",
    "important"
  );


  video.setAttribute(
    "playsinline",
    ""
  );


  video.setAttribute(
    "webkit-playsinline",
    ""
  );


  video.muted =
    true;


  const canvas =
    document.querySelector(
      "canvas.a-canvas"
    );


  if (canvas) {

    canvas.style.setProperty(
      "z-index",
      "1",
      "important"
    );


    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );

  }

}



/* ==================================================
   Smartphone-Kamera optimieren
   ================================================== */

async function optimizeMobileCamera() {

  if (cameraOptimized) {
    return;
  }


  if (!arStarted) {
    return;
  }


  /*
    PC unverändert lassen.
  */

  if (!isMobileDevice()) {

    cameraOptimized =
      true;

    return;

  }


  const video =
    getARVideo();


  if (!video) {
    return;
  }


  const stream =
    video.srcObject;


  if (!stream) {
    return;
  }


  const tracks =
    stream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  const track =
    tracks[0];



  /*
    Kameraauflösung
  */

  try {

    await track.applyConstraints({

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      },

      aspectRatio: {
        ideal: 16 / 9
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    });

  }

  catch (error) {

    console.log(
      "GeoChemAR: Kameraauflösung konnte nicht angepasst werden.",
      error
    );

  }



  /*
    Zoom möglichst 1×
  */

  try {

    if (
      track.getCapabilities
      &&
      track.applyConstraints
    ) {

      const capabilities =
        track.getCapabilities();


      if (
        capabilities.zoom
        &&
        capabilities.zoom.min !== undefined
      ) {

        const desiredZoom =

          Math.max(

            capabilities.zoom.min,

            Math.min(
              1,
              capabilities.zoom.max
            )

          );


        await track.applyConstraints({

          advanced: [

            {
              zoom: desiredZoom
            }

          ]

        });

      }

    }

  }

  catch (error) {

    console.log(
      "GeoChemAR: Zoom konnte nicht angepasst werden.",
      error
    );

  }


  cameraOptimized =
    true;

}



/* ==================================================
   Status
   ================================================== */

function updateStatus() {

  if (!arStarted) {

    status.style.display =
      "none";

    return;

  }


  status.style.display =
    "block";


  const video =
    getARVideo();


  let text =

    isMobileDevice()

      ? "Mobil"

      : "Computer";


  text +=

    " | Fenster "
    +
    window.innerWidth
    +
    "×"
    +
    window.innerHeight;


  if (!video) {

    text +=
      " | Kamera wird initialisiert …";

    status.textContent =
      text;

    return;

  }


  text +=

    " | Video "
    +
    video.videoWidth
    +
    "×"
    +
    video.videoHeight;


  const stream =
    video.srcObject;


  if (
    stream
    &&
    stream.getVideoTracks
  ) {

    const tracks =
      stream.getVideoTracks();


    if (tracks.length) {

      const track =
        tracks[0];


      if (track.getSettings) {

        const settings =
          track.getSettings();


        if (
          settings.width
          &&
          settings.height
        ) {

          text +=

            " | Stream "
            +
            settings.width
            +
            "×"
            +
            settings.height;

        }


        if (settings.frameRate) {

          text +=

            " @ "
            +
            Math.round(
              settings.frameRate
            )
            +
            "fps";

        }


        if (settings.facingMode) {

          text +=

            " | "
            +
            settings.facingMode;

        }


        if (
          settings.zoom !== undefined
        ) {

          text +=

            " | Zoom "
            +
            settings.zoom;

        }

      }

    }

  }


  status.textContent =
    text;

}



/* ==================================================
   Orientierungswechsel
   ================================================== */

function orientationChanged() {

  if (!arStarted) {

    setTimeout(
      updateStartScreen,
      200
    );

    return;

  }


  if (!isMobileDevice()) {
    return;
  }


  if (!isLandscape()) {

    const video =
      getARVideo();


    if (
      video
      &&
      video.srcObject
    ) {

      video.srcObject
        .getTracks()
        .forEach(

          function (track) {

            track.stop();

          }

        );

    }


    location.reload();

  }

}



/* ==================================================
   Events
   ================================================== */

startButton.addEventListener(

  "click",

  startMobileAR

);


window.addEventListener(

  "orientationchange",

  function () {

    setTimeout(
      orientationChanged,
      250
    );

  }

);


window.addEventListener(

  "resize",

  function () {

    if (!arStarted) {

      setTimeout(
        updateStartScreen,
        150
      );

    }

  }

);



/* ==================================================
   Start
   ================================================== */

if (isMobileDevice()) {

  updateStartScreen();

}

else {

  createARScene();

}



/* ==================================================
   Laufender Betrieb
   ================================================== */

setInterval(

  function () {

    if (!arStarted) {
      return;
    }


    keepVideoVisible();

    optimizeMobileCamera();

    updateStatus();

  },

  500

);


</script>


</body>

</html>
